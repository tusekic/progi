<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROGI priprema ispita</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#dcd8cf;
  --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#e6eef6;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --bad:#b4372f; --bad-soft:#fbe7e5; --warn:#9a6a00; --warn-soft:#fbf1d9;
  --dg-fill:#fbfaf7; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#e7e9ec; --muted:#a2a9b3; --line:#343941;
    --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#243444;
    --ok:#5cc78e; --ok-soft:#1b3326; --bad:#f08a80; --bad-soft:#3a2221; --warn:#e3b54f; --warn-soft:#352c17;
    --dg-fill:#23272c; --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2226; --ink:#e7e9ec; --muted:#a2a9b3; --line:#343941;
  --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#243444;
  --ok:#5cc78e; --ok-soft:#1b3326; --bad:#f08a80; --bad-soft:#3a2221; --warn:#e3b54f; --warn-soft:#352c17;
  --dg-fill:#23272c; --shadow:none; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.2px;margin-right:auto;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);margin-left:6px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
nav.tabs button:hover{background:var(--card)}
nav.tabs button.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;cursor:pointer}
h1{font-size:1.45rem;margin:24px 0 6px}
h2{font-size:1.15rem;margin:22px 0 8px}
h3{font-size:1rem;margin:16px 0 6px}
p{margin:8px 0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);margin:14px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:.9rem;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.gray{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.qtext{font-size:1.08rem;margin:10px 0 12px;white-space:pre-line}
.dg{overflow-x:auto;margin:6px 0 14px;padding:10px;background:var(--dg-fill);border:1px solid var(--line);border-radius:10px;text-align:center;-webkit-overflow-scrolling:touch}
.dg svg{max-width:100%;height:auto;color:var(--ink)}
.dg.wide svg{max-width:none}
svg.uml .u-ln{stroke:currentColor;stroke-width:1.3;fill:none}
svg.uml .u-thick{stroke-width:2.2}
svg.uml .u-dash{stroke-dasharray:6 4}
svg.uml .u-fill{fill:currentColor;stroke:currentColor;stroke-width:1}
svg.uml .u-hollow{fill:var(--dg-fill);stroke:currentColor;stroke-width:1.3}
svg.uml .u-node{fill:var(--card);stroke:currentColor;stroke-width:1.3}
svg.uml .u-box{fill:none;stroke:currentColor;stroke-width:1.3}
svg.uml .u-frame{fill:none;stroke:currentColor;stroke-width:1.1}
svg.uml .u-act{fill:var(--card);stroke:currentColor;stroke-width:1.1}
svg.uml .u-bg{fill:var(--dg-fill)}
svg.uml .u-note{fill:var(--warn-soft);stroke:currentColor;stroke-width:1}
svg.uml .u-tx{fill:currentColor}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);padding:11px 14px;border-radius:10px;cursor:pointer;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;border:1px solid var(--line);font-weight:700;font-size:.85rem;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.expl{margin-top:14px;border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 10px 10px 0}
.expl.ok{border-color:var(--ok);background:var(--ok-soft)}
.expl.bad{border-color:var(--bad);background:var(--bad-soft)}
.expl .t{font-weight:700;margin-bottom:4px}
.src{font-size:.85rem;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-size:1.5rem;font-weight:700}
.stat .l{font-size:.85rem;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.ok>i{background:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:.93rem}
table.t th,table.t td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-weight:600}
.examq{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.examq:first-child{border-top:0;margin-top:0;padding-top:0}
.examq .clr{font-size:.85rem;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;padding:4px 0}
.sticky{position:sticky;top:57px;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.score{font-size:2.4rem;font-weight:800}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.blank{background:var(--warn-soft);color:var(--warn)}
textarea{width:100%;min-height:110px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:10px;font:inherit;font-size:.95rem;resize:vertical}
.sol{margin-top:10px}
.sol ul,.sol ol{margin:6px 0 6px 0;padding-left:22px}
.sol li{margin:3px 0}
.check li{list-style:none;margin-left:-20px}
.check li::before{content:"☐ ";color:var(--muted)}
.step{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--card)}
.step h3{margin-top:0}
.task-list{display:grid;gap:10px}
.task-item{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;cursor:pointer}
.task-item:hover{border-color:var(--accent)}
.task-item b{display:block;margin-bottom:2px}
.kbd{font-size:.8rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.notice{background:var(--warn-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.93rem}
@media (max-width:560px){
  .card{padding:14px}
  h1{font-size:1.25rem}
  .brand small{display:none}
  .sticky{top:95px}
  header.top .in{gap:6px 12px;padding:8px 12px}
  #theme{order:2}
  nav.tabs{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  nav.tabs button{padding:6px 9px;white-space:nowrap;flex:none}
}

</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand">PROGI · priprema za ispit <small id="qcount"></small></div>
  <nav class="tabs" aria-label="Glavni izbornik">
    <button data-v="vjezba">Vježba</button>
    <button data-v="ispit">Ispit (1. dio)</button>
    <button data-v="zadaci">Zadaci (2. dio)</button>
    <button data-v="napredak">Napredak</button>
  </nav>
  <button class="iconbtn" id="theme" title="Svijetla / tamna tema" aria-label="Promijeni temu">◐</button>
</div></header>
<main class="wrap" id="main"></main>
<script>
const Q = [];
/* Mini UML renderer: use case (uc), sequence (seq), class (cls), flow (flow) -> inline SVG */
const UML = (() => {
  let uid = 0;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const tw = (s, fs = 12) => String(s).length * fs * 0.56;
  const FONT = 'font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"';

  function defs(id) {
    return `<defs>
<marker id="op${id}" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11" class="u-ln" /></marker>
<marker id="fi${id}" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" class="u-fill" /></marker>
<marker id="tr${id}" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" class="u-hollow" /></marker>
<marker id="dh${id}" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="20" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,6 L10,1 L19,6 L10,11 Z" class="u-hollow" /></marker>
<marker id="df${id}" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="20" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,6 L10,1 L19,6 L10,11 Z" class="u-fill" /></marker>
</defs>`;
  }
  const wrap = (s, max) => {
    const words = String(s).split(' '); const lines = []; let cur = '';
    for (const w of words) {
      if (w === '\\n') { lines.push(cur); cur = ''; continue; }
      if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
    }
    if (cur) lines.push(cur); return lines;
  };
  const text = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || 'middle'}" font-size="${o.fs || 12}"${o.it ? ' font-style="italic"' : ''}${o.b ? ' font-weight="600"' : ''}${o.u ? ' text-decoration="underline"' : ''} class="u-tx">${esc(s)}</text>`;
  const svgWrap = (w, h, id, body, title) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" class="uml" role="img" aria-label="${esc(title || 'UML dijagram')}" ${FONT}>${defs(id)}${body}</svg>`;

  function stick(x, y, name) { // y = centre of figure
    return `<g class="u-ln"><circle cx="${x}" cy="${y - 22}" r="8" class="u-hollow"/><line x1="${x}" y1="${y - 14}" x2="${x}" y2="${y + 8}"/><line x1="${x - 14}" y1="${y - 6}" x2="${x + 14}" y2="${y - 6}"/><line x1="${x}" y1="${y + 8}" x2="${x - 11}" y2="${y + 24}"/><line x1="${x}" y1="${y + 8}" x2="${x + 11}" y2="${y + 24}"/></g>` +
      wrap(name, 16).map((l, i) => text(x, y + 40 + i * 14, l)).join('');
  }
  function line(x1, y1, x2, y2, cls, ms, me) {
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="${cls}"${ms ? ` marker-start="url(#${ms})"` : ''}${me ? ` marker-end="url(#${me})"` : ''}/>`;
  }

  /* ---------------- USE CASE ---------------- */
  function uc(d) {
    const id = ++uid;
    const L = d.actors.filter(a => a.side !== 'R'), R = d.actors.filter(a => a.side === 'R');
    const cols = Math.max(1, ...d.uc.map(u => (u.col || 0) + 1));
    const W = d.w || (cols === 1 ? 560 : 720);
    const bx1 = L.length ? (d.lw || 130) : 20, bx2 = R.length ? W - (d.rw || 130) : W - 20;
    const rowH = d.rowH || 92;
    const perCol = Array.from({ length: cols }, () => 0);
    d.uc.forEach(u => { const c = u.col || 0; u._r = u.row !== undefined ? u.row : perCol[c]; perCol[c] = Math.max(perCol[c], u._r + 1); });
    const rows = Math.max(...perCol);
    const by1 = 20, by2 = by1 + 44 + Math.max(rows * rowH, Math.max(L.length, R.length) * 120);
    const H = by2 + 20;
    const pos = {};
    d.uc.forEach(u => {
      const c = u.col || 0;
      const cx = bx1 + (bx2 - bx1) * (c + 0.5) / cols;
      const lines = wrap(u.n, 22);
      const rx = Math.max(62, Math.max(...lines.map(l => tw(l))) / 2 + 22);
      const ry = 20 + (lines.length - 1) * 7;
      pos[u.id] = { x: cx, y: by1 + 44 + u._r * rowH + rowH / 2 - 6, rx, ry, lines, t: 'e' };
    });
    const place = (arr, x) => arr.forEach((a, i) => {
      const y = a.row !== undefined ? by1 + 44 + a.row * rowH + rowH / 2 - 12 : by1 + (by2 - by1) * (i + 1) / (arr.length + 1) - 10;
      pos[a.id] = { x: x + (a.dx || 0), y, t: a.box ? 'b' : 'a', n: a.n, box: a.box };
    });
    place(L, 62); place(R, W - 62);
    const clip = (p, tx, ty) => {
      const dx = tx - p.x, dy = ty - p.y, len = Math.hypot(dx, dy) || 1;
      if (p.t === 'e') { const t = 1 / Math.sqrt((dx / p.rx) ** 2 + (dy / p.ry) ** 2); return [p.x + dx * t, p.y + dy * t]; }
      if (p.t === 'b') { const hw = 52, hh = 20; const t = Math.min(hw / Math.abs(dx || 1e-9), hh / Math.abs(dy || 1e-9)); return [p.x + dx * t, p.y + dy * t]; }
      if (dy / len > 0.75) return [p.x, p.y + 44 + (wrap(p.n, 16).length - 1) * 14 + 6];
      return [p.x + dx / len * 26, p.y + dy / len * 30];
    };
    let body = `<rect x="${bx1}" y="${by1}" width="${bx2 - bx1}" height="${by2 - by1}" class="u-box" rx="2"/>` + text((bx1 + bx2) / 2, by1 + 22, d.sys, { b: 1, fs: 13 });
    let edges = '';
    (d.rel || []).forEach(r => {
      const a = pos[r.f], b = pos[r.t];
      const [x1, y1] = clip(a, b.x, b.y), [x2, y2] = clip(b, a.x, a.y);
      const k = r.k || 'a';
      if (k === 'a') edges += line(x1, y1, x2, y2, 'u-ln', null, r.dir ? 'op' + id : null);
      else if (k === 'i' || k === 'e') edges += line(x1, y1, x2, y2, 'u-ln u-dash', null, 'op' + id);
      else if (k === 'g') edges += line(x1, y1, x2, y2, 'u-ln', null, 'tr' + id);
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const lab = r.l !== undefined ? r.l : (k === 'i' ? '«include»' : k === 'e' ? '«extend»' : '');
      if (lab) edges += `<rect x="${mx - tw(lab, 11) / 2 - 3}" y="${my - 11}" width="${tw(lab, 11) + 6}" height="15" class="u-bg"/>` + text(mx, my, lab, { fs: 11 });
      if (r.m1) edges += text(x1 + (x2 - x1) * 0.12, y1 + (y2 - y1) * 0.12 - 6, r.m1, { fs: 11 });
      if (r.m2) edges += text(x2 + (x1 - x2) * 0.12, y2 + (y1 - y2) * 0.12 - 6, r.m2, { fs: 11 });
    });
    let nodes = '';
    Object.values(pos).forEach(p => {
      if (p.t === 'e') {
        nodes += `<ellipse cx="${p.x}" cy="${p.y}" rx="${p.rx}" ry="${p.ry}" class="u-node"/>`;
        p.lines.forEach((l, i) => nodes += text(p.x, p.y + 4 + (i - (p.lines.length - 1) / 2) * 14, l));
      } else if (p.t === 'b') {
        nodes += `<rect x="${p.x - 52}" y="${p.y - 20}" width="104" height="40" class="u-node"/>` + text(p.x, p.y - 4, '«actor»', { fs: 10 }) + text(p.x, p.y + 11, p.n, { fs: 11 });
      } else nodes += stick(p.x, p.y, p.n);
    });
    const extra = (d.notes || []).map(n => `<g><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h || 34}" class="u-note"/>${wrap(n.t, Math.floor(n.w / 6.4)).map((l, i) => text(n.x + 6, n.y + 15 + i * 13, l, { a: 'start', fs: 11 })).join('')}</g>`).join('');
    return svgWrap(W, H + (d.extraH || 0), id, body + edges + nodes + extra, d.title);
  }

  /* ---------------- SEQUENCE ---------------- */
  function seq(d) {
    const id = ++uid;
    const P = d.p; const px = {}; let x = 20;
    const gap = d.gap || 0;
    P.forEach((p, i) => {
      const w = Math.max(100, tw(p.n) + 24);
      p._w = w;
      if (i === 0) x = Math.max(70, w / 2 + 12);
      else x += Math.max(150 + gap, (P[i - 1]._w + w) / 2 + 40 + gap);
      px[p.id] = x;
    });
    let W = x + Math.max(90, P[P.length - 1]._w / 2 + 20) + (d.padR || 0);
    d.m.forEach(m => { if (m.f && m.f === m.t) W = Math.max(W, px[m.f] + 56 + tw(m.l || '', 11)); });
    const top = 14, headH = 36;
    let y = top + headH + (P.some(p => p.a) ? 50 : 34);
    const created = {}, destroyed = {};
    const rows = [];
    let depth = 0; const stack = [];
    d.m.forEach(m => {
      if (m.fr) { const f = { op: m.fr, g: m.g || '', y1: y - 8, depth: depth, elses: [] }; stack.push(f); depth++; y += 40; rows.push({ type: 'frs', f }); return; }
      if (m.el !== undefined) { const f = stack[stack.length - 1]; f.elses.push({ y: y - 6, g: m.el }); y += 38; return; }
      if (m.end) { const f = stack.pop(); depth--; f.y2 = y - 6; y += 14; rows.push({ type: 'fre', f }); return; }
      if (m.destroy) { destroyed[m.destroy] = y - 10; y += 16; return; }
      if (m.k === 'c') { created[m.t] = y; rows.push({ type: 'msg', m, y }); y += 56; return; }
      rows.push({ type: 'msg', m, y }); y += (m.f === m.t ? 50 : 40);
    });
    const H = y + 10;
    let body = '';
    // heads & lifelines
    P.forEach(p => {
      const cx = px[p.id];
      const hy = created[p.id] !== undefined ? created[p.id] - headH / 2 : top;
      const lifeEnd = destroyed[p.id] !== undefined ? destroyed[p.id] : H - 6;
      if (p.a) {
        body += `<g class="u-ln"><circle cx="${cx}" cy="${hy + 6}" r="6" class="u-hollow"/><line x1="${cx}" y1="${hy + 12}" x2="${cx}" y2="${hy + 26}"/><line x1="${cx - 10}" y1="${hy + 17}" x2="${cx + 10}" y2="${hy + 17}"/><line x1="${cx}" y1="${hy + 26}" x2="${cx - 8}" y2="${hy + 36}"/><line x1="${cx}" y1="${hy + 26}" x2="${cx + 8}" y2="${hy + 36}"/></g>` + text(cx, hy + 50, p.n);
        body += line(cx, hy + 56, cx, lifeEnd, 'u-ln u-dash');
      } else {
        body += `<rect x="${cx - p._w / 2}" y="${hy}" width="${p._w}" height="${headH}" class="u-node"/>` + text(cx, hy + 22, p.n, { u: p.u });
        body += line(cx, hy + headH, cx, lifeEnd, 'u-ln u-dash');
      }

    // fragments
    const xs = Object.values(px); const fx1 = Math.min(...xs) - 60; let fx2 = Math.max(...xs) + 60; d.m.forEach(m => { if (m.f && m.f === m.t) fx2 = Math.max(fx2, px[m.f] + 56 + tw(m.l || '', 11)); }); fx2 = Math.min(fx2, W - 4);

  /* ---------------- CLASS ---------------- */

      c._w = Math.max(110, Math.max(...lines.map(l => tw(l) * (/^[A-Z_]+$/.test(l) ? 1.12 : 1))) + 18);

    const pos = {};

      const top = rowY[c.y || 0] + (rowHeights[c.y || 0] - c._h) / 2 + (c.dy || 0);
      pos[c.id] = { x: cx, y: top + c._h / 2, hw: c._w / 2, hh: c._h / 2, c, top };

    const clip = (p, tx, ty) => {

    };

    C.forEach(c => {
      const p = pos[c.id]; const x0 = p.x - p.hw; let yy = p.top;
      body += `<rect x="${x0}" y="${yy}" width="${c._w}" height="${c._h}" class="u-node"/>`;
      if (c.st) { body += text(p.x, yy + 14, c.st, { fs: 10.5 }); body += text(p.x, yy + 29, c.n, { b: 1, it: c.ab }); }
      else body += text(p.x, yy + 17, c.n, { b: 1, it: c.ab });
      yy += c._nh;
      if (c._ah) { body += line(x0, yy, x0 + c._w, yy, 'u-ln'); (c.at || []).forEach((a, i) => body += text(x0 + 7, yy + 15 + i * 15, a, { a: 'start', fs: 11.5, u: /\{static\}/.test(a) })); yy += c._ah; }
      if (c._h - c._nh - c._ah > 0) { body += line(x0, yy, x0 + c._w, yy, 'u-ln'); (c.op || []).forEach((o, i) => body += text(x0 + 7, yy + 15 + i * 15, o.replace(/\{abstract\}/, ''), { a: 'start', fs: 11.5, it: /\{abstract\}/.test(o) })); }
    });

{id:'p1-16',t:'P1',q:'Prema tradicionalnoj metrici, kako se zove projekt koji je završen, ali kasni, prekoračio je proračun i ima manje funkcionalnosti?',o:['Izazovan (s poteškoćama)','Uspješan','Neuspješan','Prekinut'],a:0,e:'Uspješan: na vrijeme, u proračunu, prema specifikaciji. Izazovan: završen, ali izvan proračuna, kasni ili ima manje funkcionalnosti. Neuspješan: prekinut prije kraja.',s:'P01 · Statistika uspješnosti projekata'},
{id:'p1-17',t:'P1',q:'Koja tri ograničenja čine projektni (željezni) trokut?',o:['Opseg, vrijeme i trošak','Kvaliteta, rizik i opseg','Ljudi, procesi i alati','Zahtjevi, arhitektura i ispitivanje'],a:0,e:'Projektni trokut (Iron Triangle) čine opseg (što), vrijeme (do kada) i trošak (kojim resursima). Kvaliteta je rezultat usklađivanja ta tri faktora.',s:'P01 · Projektni trokut'},
{id:'p1-18',t:'P1',q:'Gdje se u projektnom trokutu nalazi kvaliteta?',o:['Ona je rezultat usklađivanja opsega, vremena i troška','Ona je četvrti vrh trokuta','Ona zamjenjuje trošak u modernim metodama','Kvaliteta nije povezana s projektnim trokutom'],a:0,e:'Kvaliteta je rezultat usklađivanja opsega, vremena i troška.',s:'P01 · Projektni trokut'},
{id:'p1-19',t:'P1',q:'Koji je autor opisao jedinstvena svojstva programa (nevidljivost, složenost, promjenjivost, usklađenost)?',o:['Fred Brooks, „No Silver Bullet” (1987.)','Edsger Dijkstra, „The Humble Programmer” (1972.)','Winston Royce (1970.)','Barry Boehm (1988.)'],a:0,e:'Svojstva programa i podjela na suštinske i nenamjerne teškoće potječu iz Brooksova eseja „No Silver Bullet” (1987.).',s:'P01 · Jedinstvena svojstva programa'},
{id:'p1-20',t:'P1',q:'Koja je posljedica svojstva nematerijalnosti i nevidljivosti programa?',o:['Teško je pratiti i mjeriti napredak; održavanje znači prilagodbu i evoluciju, a ne fizički popravak','Program se troši uporabom pa ga treba fizički popravljati','Program se ne može kopirati','Program ne zastarijeva'],a:0,e:'Program nema fizičku formu, ne troši se uporabom, ali zastarijeva i lako se reproducira. Zato je teško pratiti napredak, a održavanje je prilagodba i evolucija.',s:'P01 · Jedinstvena svojstva programa'},
{id:'p1-21',t:'P1',q:'Što kaže Brooksov zakon spomenut uz svojstvo ovisnosti o ljudskom faktoru?',o:['Dodavanje ljudi na projekt koji kasni dodatno ga usporava','Broj tranzistora udvostručuje se svake dvije godine','Struktura sustava odražava komunikacijsku strukturu organizacije','Sustav koji se koristi mora se stalno mijenjati'],a:0,e:'Brooksov zakon: dodavanje ljudi na projekt koji kasni dodatno ga usporava. (Struktura sustava i organizacije je Conwayev zakon, a stalna promjena Lehmanov zakon.)',s:'P01 · Jedinstvena svojstva programa'},
{id:'p1-22',t:'P1',q:'Koje svojstvo programa opisuje to da se program mora prilagoditi postojećim, često nelogičnim ljudskim sustavima?',o:['Usklađenost (Conformity)','Promjenjivost (Changeability)','Nevidljivost (Invisibility)','Složenost (Complexity)'],a:0,e:'Usklađenost: vanjski sustav diktira pravila i problem se ne može pojednostaviti. To je često glavni izvor složenosti koju nije moguće izbjeći.',s:'P01 · Jedinstvena svojstva programa'},
{id:'p1-23',t:'P1',q:'Koje svojstvo programa najviše vodi rastu tehničkog duga i potrebi za fleksibilnom arhitekturom?',o:['Promjenjivost','Odnos sa sklopovljem','Nevidljivost','Ovisnost o ljudskom faktoru'],a:0,e:'Promjenjivost: programi se stalno mijenjaju i lako ih je modificirati, često bez razumijevanja posljedica. Zato arhitektura mora biti fleksibilna, uz stalnu borbu protiv uništavanja strukture i rasta tehničkog duga.',s:'P01 · Jedinstvena svojstva programa'},
{id:'p1-24',t:'P1',q:'Što su suštinske (essential) teškoće razvoja?',o:['Teškoće koje proizlaze iz prirode samog problema, npr. složenosti stvarnog svijeta','Teškoće zbog loših alata i programskih jezika','Teškoće koje se mogu ukloniti boljom tehnologijom','Teškoće zbog nedovoljnog broja programera'],a:0,e:'Suštinske teškoće su u biti problema, a složenost je jedno od svojstava koje ih stvara. Nenamjerne teškoće nastaju zbog jezika, alata, tehnologija i procesa i mogu se riješiti boljom tehnologijom.',s:'P01 · Analiza teškoća'},
{id:'p1-25',t:'P1',q:'Koja je najvažnija karakteristika nenamjernih (accidental) teškoća?',o:['Mogu se riješiti boljom tehnologijom','Ne mogu se nikada ukloniti','Proizlaze iz složenosti stvarnog svijeta','Odnose se samo na sklopovlje'],a:0,e:'Nenamjerne teškoće nastaju zbog načina na koji razvijamo sustav (jezici, alati, tehnologije, procesi) i mogu se riješiti boljom tehnologijom.',s:'P01 · Analiza teškoća'},
{id:'p1-26',t:'P1',q:'Što prema predavanju napredak sklopovlja, jezika i alata čini s teškoćama razvoja?',o:['Može znatno smanjiti nenamjerne teškoće, ali ne uklanja temeljne probleme, a očekivanja i suštinske teškoće rastu','Uklanja i suštinske i nenamjerne teškoće','Povećava nenamjerne teškoće','Nema nikakav utjecaj na teškoće'],a:0,e:'Nova tehnologija može olakšati razvoj (smanjiti nenamjerne teškoće), ali uz eksploziju očekivanja i pojačavanje suštinskih teškoća sama ne uklanja temeljne probleme.',s:'P01 · Problemi razvoja programa'},
{id:'p1-27',t:'P1',q:'Koja je tvrdnja o UI-ju u programskom inženjerstvu u skladu s predavanjem?',o:['UI ubrzava rad s kodom, ali odgovornost za kvalitetu i posljedice ostaje na ljudima i timu','UI uklanja potrebu za specifikacijom i ispitivanjem','Veća brzina implementacije uz UI jamči veću kvalitetu','Za generirani kod odgovornost snosi alat'],a:0,e:'UI mijenja način razvoja, ali ne uklanja potrebu za programskim inženjerstvom. Dio napora prelazi na specifikaciju, pregled, verifikaciju, ispitivanje, integraciju i sigurnost, a odgovornost ostaje na ljudima.',s:'P01 · UI i programsko inženjerstvo'},
{id:'p1-28',t:'P1',q:'Koji je cilj programskog inženjerstva u odnosu na složenost i promjene?',o:['Sustavno upravljati njima uz prihvatljivu kvalitetu, trošak, vrijeme i rizik','Potpuno ukloniti složenost i promjene','Zabraniti promjene zahtjeva nakon specifikacije','Prebaciti složenost na korisnike'],a:0,e:'Cilj nije ukloniti složenost i promjene, nego njima sustavno upravljati. Ne postoji jedan najbolji način razvoja; pristup mora odgovarati problemu i kontekstu.',s:'P01 · Osnovni izazovi programskog inženjerstva'},
{id:'p1-29',t:'P1',q:'Kojim se sredstvima prema predavanju upravlja izazovom „brzina isporuke” (time-to-market)?',o:['Efikasnim procesima i automatizacijom (CI/CD, DevOps)','Kontejnerizacijom i neovisnošću o platformi','Formalnim metodama i rigoroznim ispitivanjem','Apstrakcijom, modeliranjem i dekompozicijom'],a:0,e:'Brzina isporuke: CI/CD i DevOps. Složenost: apstrakcija, modeliranje, dekompozicija. Kvaliteta: formalne metode i ispitivanje. Heterogenost: kontejnerizacija.',s:'P01 · Osnovni izazovi programskog inženjerstva'},
{id:'p1-30',t:'P1',q:'Kojim se pristupom prema predavanju upravlja heterogenošću (heterogeneity management)?',o:['Tehnikama i arhitekturama poput kontejnerizacije koje omogućuju prenosivost','Scrumom i jasnim ulogama','Agilnim metodama za upravljanje promjenama','Funkcijskim točkama'],a:0,e:'Upravljanje heterogenošću: tehnike i arhitekture (npr. kontejnerizacija) koje omogućuju prenosivost i neovisnost o platformi.',s:'P01 · Osnovni izazovi programskog inženjerstva'},
{id:'p1-31',t:'P1',q:'Što prema predavanju može biti najbolje rješenje problema u inženjerskom pristupu?',o:['Ponekad kupiti ili prilagoditi postojeće rješenje umjesto razvijanja novog','Uvijek razviti novi program od nule','Uvijek odabrati najnoviju tehnologiju','Rješenje s najviše funkcionalnosti'],a:0,e:'Cilj nije nužno razviti novi program, nego pronaći najbolje izvedivo rješenje. Ponekad je najbolje kupiti ili prilagoditi postojeće.',s:'P01 · Programsko inženjerstvo'},
{id:'p1-32',t:'P1',q:'Tko su dionici (stakeholders)?',o:['Sve osobe, skupine ili organizacije koje utječu na projekt ili na koje projekt utječe','Samo kupci koji plaćaju razvoj','Samo krajnji korisnici sustava','Samo članovi razvojnog tima'],a:0,e:'Dionici su sve osobe, skupine ili organizacije koje utječu ili na koje projekt utječe: korisnici, kupci, razvojni tim, menadžeri, regulatori, pravna služba, društvo.',s:'P01 · Dionici i različiti interesi'},
{id:'p1-33',t:'P1',q:'Na što je prema predavanju usmjeren fokus kupaca (customers)?',o:['Na cijenu, povrat investicije (ROI) i ostvarenje cilja','Na uporabljivost i funkcionalnost','Na tehničku izvedivost i kvalitetu koda','Na zakonitost i privatnost'],a:0,e:'Kupci plaćaju razvoj i zanima ih cijena, ROI i ostvarenje cilja. Korisnici: uporabljivost i funkcionalnost. Razvojni tim: izvedivost, kvaliteta koda, održivost. Menadžeri: željezni trokut. Regulatori: zakonitost, sigurnost, privatnost.',s:'P01 · Dionici i različiti interesi'},
{id:'p1-34',t:'P1',q:'Koliki dio ukupnog troška životnog ciklusa prema procjeni odlazi na održavanje i evoluciju?',o:['Oko 60–80 %','Oko 5–10 %','Oko 20–40 %','Gotovo 100 %'],a:0,e:'Pisanje novog koda („greenfield”) je manji dio, oko 20–40 % troška. Održavanje i evolucija čine oko 60–80 %: ispravci grešaka, prilagodba novim platformama, nove funkcionalnosti, refaktoriranje.',s:'P01 · Životni ciklus programske potpore'},
{id:'p1-35',t:'P1',q:'Što je tehnički dug?',o:['Kratkoročni kompromis koji olakšava razvoj danas, ali otežava promjene sutra','Novac koji tim duguje za licence alata','Broj neispravljenih grešaka prijavljenih od korisnika','Trošak sklopovlja potrebnog za rad sustava'],a:0,e:'Tehnički dug je kratkoročni kompromis koji olakšava razvoj danas, a otežava promjene sutra. Zato su kvalitetna arhitektura, ispitivanje i dokumentacija dugoročne ekonomske odluke.',s:'P01 · Životni ciklus programske potpore'},
{id:'p1-36',t:'P1',q:'Koji je NEDOSTATAK tradicionalnog (vodopadnog) pristupa naveden na predavanju?',o:['Kasna integracija: greške se otkrivaju tek na kraju, a ispravci su skupi','Prečesta isporuka korisniku','Premalo dokumentacije','Previše povratnih informacija od korisnika'],a:0,e:'Nedostaci: nefleksibilnost, kasna integracija, nesporazumi zbog nedostatka povratne veze, odgođena vrijednost (korisnik vidi rezultat tek na kraju) i opsežna, teško razumljiva dokumentacija.',s:'P01 · Nedostaci tradicijskog postupka'},
{id:'p1-37',t:'P1',q:'Koja je tvrdnja o razvoju vođenom modelima (MDE/MDD) točna prema predavanju?',o:['To je poseban pristup u kojem modeli imaju središnju ulogu, a dio prijelaza model → kod može se automatizirati','To je sinonim za svaki moderni razvoj','U njemu se modeli ne koriste','To je drugi naziv za vodopadni model'],a:0,e:'MDE/MDD nije sinonim za moderni razvoj. U tim pristupima model je u centru procesa, a dio prijelaza prema implementaciji se automatizira. Cilj je viša razina apstrakcije, bolja komunikacija, produktivnost i održavanje.',s:'P01 · Razvoj zasnovan na modelima'},
{id:'p1-38',t:'P1',q:'Što je inženjerski model prema predavanju?',o:['Sažeta reprezentacija sustava koja naglašava značajna svojstva iz nekog pogleda na sustav','Potpun opis sustava sa svim detaljima','Izvršna verzija sustava','Dokument s popisom svih zahtjeva'],a:0,e:'Inženjerski model je sažeta reprezentacija sustava koja naglašava značajna svojstva iz nekog pogleda (B. Selic). Ne prikazuje sve odjednom.',s:'P01 · Model'},
{id:'p1-39',t:'P1',q:'Koje je od navedenog svojstvo dobrog modela prema predavanju?',o:['Predvidljivost: daje odgovor na pitanja o promatranom sustavu','Potpunost: prikazuje sve detalje implementacije','Izvršivost: može se pokrenuti kao program','Neovisnost o svrsi'],a:0,e:'Svojstva modela: apstrakcija, razumljivost, točnost, predvidljivost (daje odgovor na pitanja o sustavu) i jednostavnost.',s:'P01 · Primjer modela'},
{id:'p1-40',t:'P1',q:'Koja je tvrdnja o odnosu modela i sustava točna?',o:['Model može biti konzistentan s implementacijom, a ipak nepotpun, i sam ne dokazuje kvalitetu sustava','Model je zamjena za stvarni sustav','Dobar model prikazuje sve aspekte sustava','Modeliranje zamjenjuje programiranje'],a:0,e:'Model prikazuje odabrana svojstva za određenu svrhu. Može biti nepotpun i ne dokazuje kvalitetu, sigurnost ni uporabljivost. Modeliranje dopunjuje programiranje, ne zamjenjuje ga.',s:'P01 · Razlika modela i sustava'},
{id:'p1-41',t:'P1',q:'Koji od navedenih NIJE princip savladavanja složenosti s predavanja?',o:['Povećanje broja programera','Dekompozicija („podijeli pa vladaj”)','Apstrakcija','Ponovna uporaba (reuse)'],a:0,e:'Principi: dekompozicija, iterativno poboljšavanje, ponovna uporaba, apstrakcija (uvođenje modela) i modeliranje.',s:'P01 · Principi savladavanja problema složenosti'},
{id:'p1-42',t:'P1',q:'Koliko načela sadrži kodeks etike i profesionalnog rada programskih inženjera (IEEE-CS/ACM)?',o:['Osam','Pet','Deset','Dvanaest'],a:0,e:'Osam načela: javni interes, klijent i poslodavac, proizvod, prosudba, upravljanje, struka, kolegijalnost, odnos prema sebi.',s:'P01 · Načela etike i profesionalnog rada PI'},
{id:'p1-43',t:'P1',q:'Koja je temeljna obveza načela „Prosudba” u etičkom kodeksu?',o:['Čuvati integritet i neovisnost stručne prosudbe','Djelovati u skladu sa sigurnošću i dobrobiti javnosti','Težiti visokoj kvaliteti proizvoda','Održavati vlastitu stručnu kompetenciju'],a:0,e:'Prosudba: integritet i neovisnost stručne prosudbe. Javni interes: sigurnost i dobrobit javnosti. Proizvod: visoka kvaliteta. Odnos prema sebi: razvoj kompetencije.',s:'P01 · Načela etike i profesionalnog rada PI'},
{id:'p1-44',t:'P1',q:'Prema načelu „Klijent i poslodavac”, do koje granice inženjer zastupa interese klijenta?',o:['Dok nisu protivni javnom interesu','Bezuvjetno, jer klijent plaća razvoj','Dok ne ugrožavaju rok projekta','Dok nisu protivni interesima razvojnog tima'],a:0,e:'Načelo „Klijent i poslodavac”: zastupati njihove interese dok nisu protivni javnom interesu. Javni interes ima posebno mjesto u kodeksu.',s:'P01 · Načela etike i profesionalnog rada PI'},
{id:'p1-45',t:'P1',q:'Tim otkrije ozbiljan sigurnosni problem tik pred isporuku, a voditelj traži puštanje u rad zbog financijskog gubitka. Što je u skladu s etičkim kodeksom?',o:['Javni interes (sigurnost korisnika) ima prednost; problem treba otvoreno iznijeti i ne pustiti nesiguran sustav','Pustiti sustav jer interes klijenta uvijek ima prednost','Prešutjeti problem i ispraviti ga u sljedećoj verziji','Odluka pripada isključivo voditelju, inženjer nema odgovornost'],a:0,e:'Kodeks stavlja javni interes (sigurnost, dobrobit, privatnost) iznad interesa klijenta. Etika nadilazi samo poštivanje zakona, a inženjer je odgovoran za posljedice svojih odluka.',s:'P01 · Primjer; Profesionalna i etička odgovornost'},
{id:'p1-46',t:'P1',q:'Koja je tvrdnja o etičkim kodeksima točna?',o:['Daju mjerila etičkog i stručnog postupanja, ali sami po sebi nisu zakon','Pravno su obvezujući u svim državama','Odnose se samo na članove IEEE-a i ACM-a','Zamjenjuju ugovorne obveze'],a:0,e:'Kodeksi su etička, a ne automatski pravna norma. Pravna važnost ovisi o pravnom sustavu, ugovorima i okolnostima. Odgovornost proizlazi iz utjecaja rada, a ne iz članstva u udruzi.',s:'P01 · Značaj kodeksa'},
{id:'p1-47',t:'P1',q:'Koji su najčešći uzroci zatajenja velikih sustava prema sažetku predavanja?',o:['Pogrešna ili nepotpuna specifikacija, česte nepredviđene promjene i neusklađeni zahtjevi dionika','Spori procesori i premalo memorije','Izbor pogrešnog programskog jezika','Previše ispitivanja'],a:0,e:'Najčešći uzroci zatajenja velikih sustava odnose se na zahtjeve: pogrešna ili nepotpuna specifikacija, česte i nepredviđene promjene te suprotstavljeni zahtjevi dionika.',s:'P01 · Sažetak (razvoj programske potpore)'}
);

/* P2 – Životni ciklus programske potpore i inženjerstvo zahtjeva */
Q.push(
{id:'p2-01',t:'P2',q:'Što opisuje model životnog ciklusa programske potpore?',o:['Organizaciju faza i aktivnosti: koje se aktivnosti provode, njihove ovisnosti, redoslijed i vremenski raspored','Samo popis alata koji se koriste u razvoju','Arhitekturu konkretnog programskog sustava','Organizacijsku strukturu tvrtke'],a:0,e:'Model životnog ciklusa odgovara na tri pitanja: Što (koje aktivnosti), Kako su povezane (ovisnosti) i Kada (redoslijed). Modeli se razlikuju po organizaciji, redoslijedu i ponavljanju faza.',s:'P02 · Model životnog ciklusa'},
{id:'p2-02',t:'P2',q:'Koja je razlika između faze i aktivnosti u životnom ciklusu?',o:['Faza je vremenski ili logički omeđen dio ciklusa, a aktivnost je vrsta posla koja se može provoditi u jednoj ili više faza','Faza je vrsta posla, a aktivnost vremenski period','Faza se odnosi na ljude, a aktivnost na alate','To su sinonimi'],a:0,e:'Faza je vremenski ili logički omeđen dio životnog ciklusa. Aktivnost (npr. ispitivanje) je vrsta posla koja se može provoditi u više faza.',s:'P02 · Model životnog ciklusa'},
{id:'p2-03',t:'P2',q:'Koje su četiri generičke aktivnosti procesa programskog inženjerstva?',o:['Specifikacija; oblikovanje i implementacija; validacija i verifikacija; evolucija','Planiranje; kodiranje; prodaja; podrška','Intervju; prototip; recenzija; isporuka','Analiza; testiranje; dokumentiranje; naplata'],a:0,e:'Generičke aktivnosti: 1. specifikacija (što sustav treba činiti i ograničenja), 2. oblikovanje i implementacija, 3. validacija i verifikacija, 4. evolucija (promjene prema novim zahtjevima).',s:'P02 · Proces programskog inženjerstva'},
{id:'p2-04',t:'P2',q:'Što prema predavanju definira proces?',o:['TKO radi ŠTO, KADA i kako postići željeni cilj','Samo redoslijed pisanja koda','Popis funkcija sustava','Cijenu projekta'],a:0,e:'Proces definira tko radi što, kada i kako postići cilj. Osigurava potrebne informacije u trenutku kad su potrebne, u upotrebljivom obliku, ni previše ni premalo.',s:'P02 · Uloga procesa'},
{id:'p2-05',t:'P2',q:'Što su primarni dionici?',o:['Oni koji izravno sudjeluju u projektu ili na koje rezultati izravno utječu (npr. korisnici, razvojni tim, naručitelj)','Oni koji neizravno utječu na projekt','Samo članovi uprave tvrtke','Samo oni koji financiraju projekt'],a:0,e:'Primarni dionici izravno sudjeluju ili su izravno pogođeni. Sekundarni neizravno utječu ili osjećaju posljedice. Ključni imaju presudan utjecaj i mogu biti primarni ili sekundarni.',s:'P02 · Dionici na projektu'},
{id:'p2-06',t:'P2',q:'Koja je tvrdnja o ključnim dionicima točna?',o:['Imaju presudan utjecaj na odluke, zahtjeve ili uspjeh i mogu biti primarni ili sekundarni','Uvijek su primarni dionici','Uvijek su krajnji korisnici','To su isključivo članovi razvojnog tima'],a:0,e:'Ključni dionici imaju presudan utjecaj na odluke, zahtjeve ili uspješnost projekta i mogu biti primarni ili sekundarni. Podjela ovisi o projektu, a ne samo o nazivu uloge.',s:'P02 · Dionici na projektu'},
{id:'p2-07',t:'P2',q:'Koja uloga ima viziju ciljnog proizvoda i odgovorna je za njegov uspjeh ili neuspjeh?',o:['Vlasnik proizvoda (product owner)','Rukovoditelj projekta (project manager)','Poslovni analitičar','Inženjer osiguranja kvalitete'],a:0,e:'Vlasnik proizvoda ima viziju i odgovoran je za uspjeh proizvoda. Rukovoditelj projekta planira i prati provedbu. Poslovni analitičar istražuje poslovne prilike. QA inženjer ispitivanjem provjerava zahtjeve.',s:'P02 · Dionici na projektu unutar tvrtke'},
{id:'p2-08',t:'P2',q:'Koja uloga istražuje poslovne prilike, identificira probleme i predlaže rješenja za poboljšanje poslovnih procesa?',o:['Poslovni analitičar','Vlasnik proizvoda','Razvojni tim','Rukovoditelj projekta'],a:0,e:'Poslovni analitičar (business analyst) istražuje poslovne prilike, identificira i definira probleme te predlaže optimalna rješenja.',s:'P02 · Dionici na projektu unutar tvrtke'},
{id:'p2-09',t:'P2',q:'Koji je ispravan redoslijed faza Tuckmanova modela razvoja tima?',o:['Formiranje → previranje → normiranje → ostvarivanje ciljeva → raspuštanje','Formiranje → normiranje → previranje → ostvarivanje → raspuštanje','Previranje → formiranje → normiranje → raspuštanje → ostvarivanje','Planiranje → izvođenje → kontrola → zatvaranje → evaluacija'],a:0,e:'Tuckman: forming → storming → norming → performing → adjourning.',s:'P02 · Razvojni tim: organizacija i razvoj'},
{id:'p2-10',t:'P2',q:'Koji je osnovni tijek suradnje u timu s alatima poput Gita i GitHuba prema predavanju?',o:['Zadatak → promjena datoteka → commit → zahtjev za uključivanje promjena (PR) → pregled i spajanje','Commit → zadatak → spajanje → pregled','PR → zadatak → commit → brisanje grane','Pregled → commit → zadatak → spajanje'],a:0,e:'Osnovni tijek: zadatak → promjena datoteka → commit → pull request → pregled i spajanje promjena.',s:'P02 · Alati za timski razvoj'},
{id:'p2-11',t:'P2',q:'Što je inženjerstvo zahtjeva?',o:['Sustavan proces utvrđivanja, analize, dokumentiranja, provjeravanja i upravljanja zahtjevima sustava','Pisanje koda prema zahtjevima korisnika','Ispitivanje gotovog sustava','Izbor tehnologija za implementaciju'],a:0,e:'Inženjerstvo zahtjeva obuhvaća izlučivanje, analizu, specifikaciju, validaciju i upravljanje zahtjevima. Cilj je da proizvod odgovara potrebama i očekivanjima dionika.',s:'P02 · Inženjerstvo zahtjeva'},
{id:'p2-12',t:'P2',q:'Zašto „Svaka prijava mora biti obrađena brzo.” nije dobar zahtjev?',o:['Nejednoznačan je i neprovjerljiv: „brzo” i „obrađena” imaju više tumačenja','Opisuje tehničko rješenje umjesto potrebe','Previše je detaljan','Nije funkcijski zahtjev pa ga ne treba bilježiti'],a:0,e:'Građanin, dispečer i stožer tumače „brzo” različito. Nije jasno što znači „obrađena” ni od kada se mjeri vrijeme. Zahtjev krši jednoznačnost i provjerljivost.',s:'P02 · Što je klijent mislio pod „brzo”?'},
{id:'p2-13',t:'P2',q:'Koje su generičke aktivnosti inženjerstva zahtjeva navedene na predavanju?',o:['Studija izvedivosti, izlučivanje i analiza, specifikacija, validacija, upravljanje promjenama zahtjeva','Planiranje, implementacija, ispitivanje, isporuka','Intervju, etnografija, prototip, oluja mozgova','Formiranje, previranje, normiranje, ostvarivanje'],a:0,e:'Generičke aktivnosti IZ: studija izvedivosti, izlučivanje i analiza, specifikacija, validacija i upravljanje promjenama zahtjeva. Nema jedinstvenog procesa IZ.',s:'P02 · Procesi inženjerstva zahtjeva'},
{id:'p2-14',t:'P2',q:'Koja je karakteristika spiralnog modela procesa inženjerstva zahtjeva?',o:['Zahtjevi se razvijaju kroz cikličke iteracije od unutra prema van (poslovni → korisnički → zahtjevi sustava)','Aktivnosti slijede jedna drugu bez povratnih veza','Svi zahtjevi se definiraju odjednom na početku','Ne proizvodi dokument zahtjeva'],a:0,e:'Spiralni model: unutarnji krug (poslovni zahtjevi, studija izvedivosti), srednji (korisnički zahtjevi, prototip), vanjski (zahtjevi sustava, formalne revizije). Izravni je prethodnik iterativnog i agilnog razvoja.',s:'P02 · Spiralni model procesa inž. zahtjeva'},
{id:'p2-15',t:'P2',q:'Što se u spiralnom modelu inženjerstva zahtjeva radi u unutarnjem krugu?',o:['Poslovni zahtjevi i studija izvedivosti (isplativost)','Zahtjevi sustava i formalne revizije','Korisnički zahtjevi i izrada prototipa','Implementacija i ispitivanje'],a:0,e:'Unutarnji krug: poslovni zahtjevi → studija izvedivosti. Srednji: korisnički zahtjevi → prototip. Vanjski: zahtjevi sustava → formalne revizije.',s:'P02 · Spiralni model procesa inž. zahtjeva'},
{id:'p2-16',t:'P2',q:'Koja je tvrdnja o agilnom pristupu inženjerstvu zahtjeva točna?',o:['Agilni pristup ne znači manje zahtjevnu specifikaciju; mijenja se način i vrijeme njezine razrade','U agilnom pristupu zahtjevi se ne zapisuju','Svi zahtjevi se specificiraju prije prvog sprinta','Agilni pristup ne koristi prioritizaciju'],a:0,e:'Agilni tijek: izlučivanje i razjašnjavanje → analiza i prioritizacija (npr. MoSCoW) → specifikacija i prihvaćanje (korisničke priče s kriterijima) → validacija i ažuriranje.',s:'P02 · Agilni pristup inženjerstvu zahtjeva'},
{id:'p2-17',t:'P2',q:'Što provjerava studija izvedivosti?',o:['Doprinos sustava ciljevima organizacije, ostvarivost postojećom tehnologijom i sredstvima te integraciju s postojećim sustavima','Ispravnost koda prije isporuke','Zadovoljstvo korisnika nakon isporuke','Brzinu rada razvojnog tima'],a:0,e:'Studija izvedivosti na početku određuje isplati li se sustav. Ulaz su preliminarni zahtjevi. Provjerava doprinos ciljevima, ostvarivost i integraciju.',s:'P02 · Studija izvedivosti'},
{id:'p2-18',t:'P2',q:'Koja je glavna prednost etnografije (terenskog opažanja) kao metode izlučivanja?',o:['Pokazuje kako ljudi stvarno rade, a ne samo ono što kažu da rade','Najbrža je i najjeftinija metoda','Ne zahtijeva kontakt s korisnicima','Daje formalnu specifikaciju zahtjeva'],a:0,e:'Etnografija (shadowing) znači posjet radnom okruženju i promatranje stvarnog rada. Daje kontekstualno razumijevanje, ali je dugotrajna.',s:'P02 · Etnografija'},
{id:'p2-19',t:'P2',q:'Koje je ograničenje intervjuiranja kao metode izlučivanja?',o:['Teško otkriva prešutno znanje i specifična pravila domene','Ne daje nikakve informacije o potrebama dionika','Moguće je samo sa zatvorenim pitanjima','Zahtijeva gotov prototip sustava'],a:0,e:'Intervjuima je teško otkriti prešutna pravila: stručnjaci domene teško objašnjavaju znanje koje svakodnevno koriste. Zato intervju treba dopuniti promatranjem rada.',s:'P02 · Intervjuiranje'},
{id:'p2-20',t:'P2',q:'Koja je razlika između zatvorenog i otvorenog intervjua?',o:['U zatvorenom se odgovara na unaprijed definirana pitanja, a u otvorenom se pitanja prilagođavaju odgovorima','Zatvoreni se provodi bez korisnika, a otvoreni s korisnicima','Otvoreni intervju nema plan','Zatvoreni intervju je pisani upitnik'],a:0,e:'Zatvoreni intervju: skup prethodno definiranih pitanja. Otvoreni: fleksibilna pitanja prilagođena odgovorima sugovornika.',s:'P02 · Intervjuiranje'},
{id:'p2-21',t:'P2',q:'Koji je ispravan redoslijed procesa intervjuiranja?',o:['Planiranje i priprema → intervju → konsolidacija informacija → naknadni sastanak','Intervju → planiranje → naknadni sastanak → konsolidacija','Konsolidacija → intervju → planiranje','Naknadni sastanak → priprema → intervju'],a:0,e:'Proces intervjuiranja: planiranje i priprema, intervju, konsolidacija informacija, naknadni sastanak.',s:'P02 · Intervjuiranje'},
{id:'p2-22',t:'P2',q:'Koja je tvrdnja o prototipu namijenjenom odbacivanju točna?',o:['Ne ulazi u konačni proizvod','Postupno postaje dio konačnog sustava','Mora biti visoke vjernosti','Koristi se samo nakon isporuke'],a:0,e:'Prototip za odbacivanje ne ulazi u konačni proizvod. Evolucijski prototip se može postupno razviti u dio konačnog sustava. Prototip pomaže pri izlučivanju i validaciji.',s:'P02 · Prototipiranje'},
{id:'p2-23',t:'P2',q:'Koje je ograničenje prototipa kao metode izlučivanja prema sažetku predavanja?',o:['Niska vjernost može zavarati','Ne otkriva reakcije korisnika','Pokazuje samo terminologiju','Dugotrajan je kao etnografija'],a:0,e:'Prototip daje reakciju na ono što korisnici vide, ali niska vjernost može zavarati. Analiza postojećeg sustava ne pokazuje stvarnu uporabu, intervju ne otkriva prešutno znanje, etnografija je dugotrajna.',s:'P02 · Sažetak (metode izlučivanja)'},
{id:'p2-24',t:'P2',q:'Za što je posebno dobra analiza postojećih sustava i dokumentacije?',o:['Za brz početak i upoznavanje sa sustavom, terminologijom i dionicima','Za otkrivanje stvarne uporabe sustava','Za otkrivanje prešutnog znanja','Za validaciju gotovog sustava'],a:0,e:'Analiza postojećih sustava i čitanje dokumentacije dobri su za brz početak i upoznavanje s terminologijom, ali ne pokazuju stvarnu uporabu.',s:'P02 · Analiza postojećih sustava'},
{id:'p2-25',t:'P2',q:'Što je scenarij kao metoda izlučivanja?',o:['Opis konkretnog tijeka interakcija između aktora i sustava u određenoj situaciji','Popis svih funkcija sustava','Dijagram razreda sustava','Plan ispitivanja'],a:0,e:'Scenarij sadrži početnu situaciju, normalni tijek, što može poći krivo, paralelne aktivnosti i završno stanje. Vrste su trenutni (as-is) i vizionarski.',s:'P02 · Scenariji'},
{id:'p2-26',t:'P2',q:'U scenariju SC-01 (podnošenje prijave u LEGIS-u), što je navedeno kao moguće odstupanje?',o:['Nedostaje lokacija ili je unos nevaljan, pa sustav traži ispravak','Dispečer dodjeljuje ekipu','Voditelj stožera šalje obavijest','Građanin dobiva kod za praćenje'],a:0,e:'Odstupanja u SC-01: a) nedostaje lokacija ili je unos nevaljan (sustav traži ispravak); b) prijava nije zaprimljena (obavijest o neuspjehu). Završetak: prijava zabilježena, građanin dobiva kod.',s:'P02 · Primjer scenarija'},
{id:'p2-27',t:'P2',q:'Koji je predložak korisničke priče?',o:['„Kao <uloga> želim <mogućnost> kako bih <korist>”','„Zadano – Kada – Tada”','„Sustav mora omogućiti …”','„Ako <uvjet> onda <akcija>”'],a:0,e:'Korisnička priča: „Kao <uloga> želim <mogućnost> kako bih <korist>”. Kriterij prihvaćanja zapisuje se kao Gherkin scenarij (Zadano – Kada – Tada).',s:'P02 · Korisničke priče i kriteriji prihvaćanja'},
{id:'p2-28',t:'P2',q:'U kojem se obliku zapisuje kriterij prihvaćanja korisničke priče prema predavanju?',o:['Gherkin scenarij: Zadano – Kada – Tada (Given – When – Then)','Dijagram razreda','MoSCoW tablica','Formalna matematička specifikacija'],a:0,e:'Primjer: Zadano: postoji događaj s razinom hitnosti i dostupna ekipa. Kada: dispečer dodijeli ekipu. Tada: sustav bilježi dodjelu i prikazuje ekipu.',s:'P02 · Korisničke priče i kriteriji prihvaćanja'},
{id:'p2-29',t:'P2',q:'Koje su tri razine zahtjeva prema razini detalja?',o:['Poslovni zahtjevi, korisnički zahtjevi, zahtjevi sustava','Funkcijski, nefunkcijski, domenski','Obavezni, poželjni, mogući','Ulazni, izlazni, procesni'],a:0,e:'Prema razini detalja: poslovni (ciljevi projekta), korisnički (što korisnici trebaju postići), zahtjevi sustava (detaljne funkcije i ograničenja). Specifikacija nije zasebna razina.',s:'P02 · Klasifikacija prema razini detalja'},
{id:'p2-30',t:'P2',q:'Je li specifikacija zahtjeva zasebna razina zahtjeva uz poslovne, korisničke i zahtjeve sustava?',o:['Ne, ona dokumentira i organizira dogovorene zahtjeve','Da, to je četvrta i najdetaljnija razina','Da, to je razina iznad poslovnih zahtjeva','Ne, jer se specifikacija ne piše'],a:0,e:'Specifikacija dokumentira i organizira dogovorene zahtjeve sustava. Nije zasebna razina.',s:'P02 · Klasifikacija prema razini detalja'},
{id:'p2-31',t:'P2',q:'Koji je od navedenih zahtjeva funkcijski?',o:['Sustav mora građaninu omogućiti podnošenje prijave s vrstom događaja, lokacijom i opisom.','Sustav mora prikazati potvrdu zaprimanja unutar 2 sekunde u definiranim uvjetima opterećenja.','Osobni podaci prijavitelja dostupni su samo ovlaštenim ulogama.','Sustav mora biti dostupan 99,9 % vremena.'],a:0,e:'Funkcijski zahtjev opisuje uslugu koju sustav pruža. Vrijeme odziva i dostupnost su nefunkcijski, a pristup osobnim podacima je ograničenje (sigurnost/privatnost).',s:'P02 · Klasifikacija s obzirom na sadržaj'},
{id:'p2-32',t:'P2',q:'Kakav je zahtjev „Sustav mora prikazati potvrdu zaprimanja prijave unutar 2 sekunde u definiranim uvjetima opterećenja.”?',o:['Nefunkcijski zahtjev (performanse)','Funkcijski zahtjev','Poslovni zahtjev','Pretpostavka'],a:0,e:'Odnosi se na svojstvo kvalitete (performanse) i ima mjerljiv kriterij, pa je to nefunkcijski zahtjev.',s:'P02 · Klasifikacija s obzirom na sadržaj'},
{id:'p2-33',t:'P2',q:'Kakav je zahtjev „Razinu hitnosti događaja određuje i ekipe dodjeljuje isključivo dispečer.”?',o:['Zahtjev domene primjene','Nefunkcijski zahtjev performansi','Poslovni zahtjev','Tehnička odluka'],a:0,e:'Zahtjevi domene proizlaze iz pravila i posebnosti područja primjene i mogu biti funkcijski, nefunkcijski ili ograničenja. Ovo pravilo dolazi iz domene LEGIS-a.',s:'P02 · Klasifikacija s obzirom na sadržaj'},
{id:'p2-34',t:'P2',q:'U opisu „Podaci se pohranjuju u MongoDB, a obavijesti šalju putem Firebasea” što su MongoDB i Firebase?',o:['Predložene tehničke odluke, ne nužno zahtjevi','Funkcijski zahtjevi','Nefunkcijski zahtjevi performansi','Zahtjevi domene primjene'],a:0,e:'Zahtjev opisuje što ili koliko dobro. MongoDB i Firebase su predložene tehničke odluke. Tehničko rješenje navodi se samo kad je opravdano ograničenje.',s:'P02 · Primjer: klasifikacija zahtjeva'},
{id:'p2-35',t:'P2',q:'Koji od navedenih NIJE jedan od šest kriterija pravilno formuliranog zahtjeva?',o:['Kratkoća','Jednoznačnost','Provjerljivost','Pojedinačnost'],a:0,e:'Šest kriterija: ispravnost, nužnost, ostvarivost, jednoznačnost, provjerljivost, pojedinačnost.',s:'P02 · Kriteriji pojedinog zahtjeva'},
{id:'p2-36',t:'P2',q:'Koji kriterij krši zahtjev „Sustav zaprima prijavu, provjerava podatke, dodjeljuje kod i obavještava dispečera.”?',o:['Pojedinačnost','Ostvarivost','Nužnost','Ispravnost'],a:0,e:'Pojedinačnost: svaki zahtjev opisuje jednu funkciju, svojstvo ili ograničenje. Ovdje su četiri zahtjeva spojena u jedan.',s:'P02 · Kriteriji pojedinog zahtjeva; Zadatak: popravite zahtjeve'},
{id:'p2-37',t:'P2',q:'Koji kriterij prvenstveno krši zahtjev „Korisničko sučelje za građane mora biti jednostavno za korištenje.”?',o:['Jednoznačnost i provjerljivost','Pojedinačnost','Nužnost','Ostvarivost'],a:0,e:'„Jednostavno” je neodređena riječ. Ne može se jednoznačno protumačiti ni provjeriti bez mjerljivog kriterija.',s:'P02 · Kriteriji pojedinog zahtjeva; Zadatak: popravite zahtjeve'},
{id:'p2-38',t:'P2',q:'Što znači kriterij provjerljivosti zahtjeva?',o:['Ispunjenje zahtjeva može se provjeriti analizom, ispitivanjem ili demonstracijom','Zahtjev je odobrio naručitelj','Zahtjev je ostvariv s raspoloživim resursima','Zahtjev ima jedinstveni ID'],a:0,e:'Provjerljivost: može se provjeriti analizom, ispitivanjem ili demonstracijom. Ostvarivost se odnosi na tehnologiju, vrijeme i resurse.',s:'P02 · Kriteriji pojedinog zahtjeva'},
{id:'p2-39',t:'P2',q:'Koja je razlika između ograničenja i pretpostavke?',o:['Ograničenje moramo poštovati, a pretpostavku tek treba potvrditi','Pretpostavka je obavezna, a ograničenje opcionalno','Ograničenja se odnose samo na sklopovlje','Nema razlike'],a:0,e:'Ograničenje: uvjet koji sustav mora poštovati (npr. osobni podaci dostupni samo ovlaštenim ulogama). Pretpostavka: uvjet za koji se smatra da vrijedi, ali ga treba potvrditi (npr. sve ekipe imaju mobilni uređaj). Nevaljana pretpostavka može zahtijevati promjenu.',s:'P02 · Ograničenja i pretpostavke'},
{id:'p2-40',t:'P2',q:'„Sve terenske ekipe imaju mobilni uređaj prikladan za uporabu sustava.” je:',o:['Pretpostavka','Ograničenje','Funkcijski zahtjev','Kriterij prihvaćanja'],a:0,e:'To je uvjet za koji se smatra da vrijedi, ali ga treba potvrditi, dakle pretpostavka.',s:'P02 · Ograničenja i pretpostavke'},
{id:'p2-41',t:'P2',q:'Koju riječ prema naputku za pisanje zahtjeva treba izbjegavati?',o:['„brzo”','„mora”','„omogućiti”','„dispečer”'],a:0,e:'Treba izbjegavati nejednoznačne riječi: nekoliko, brzo, često, pogodno… Preporučuje se oblik „Sustav mora omogućiti …”.',s:'P02 · Naputak za pisanje zahtjeva'},
{id:'p2-42',t:'P2',q:'Što vrijedi za zahtjeve koje predloži UI asistent?',o:['Izlaz je nacrt; tim odgovara za sadržaj i provjerava ga po šest kriterija','Mogu se izravno unijeti u SRS bez provjere','UI uvijek piše jednoznačne zahtjeve','Može se unijeti i povjerljive podatke klijenta radi točnosti'],a:0,e:'Tipične pogreške UI-ja: izmišljeni zahtjevi, neodređene riječi, više zahtjeva u jednom. Ne unositi povjerljive ni osobne podatke.',s:'P02 · Umjetna inteligencija u pisanju zahtjeva'},
{id:'p2-43',t:'P2',q:'Koje su tri vrste nefunkcijskih zahtjeva prema izvoru ograničenja?',o:['Zahtjevi programskog proizvoda, organizacijski zahtjevi, vanjski zahtjevi','Performanse, sigurnost, pouzdanost','Poslovni, korisnički, sustavni','Obavezni, poželjni, mogući'],a:0,e:'Prema izvoru: zahtjevi proizvoda (ponašanje isporučenog sustava), organizacijski (pravila, politike, standardi organizacije), vanjski (propisi, interoperabilnost).',s:'P02 · Klasifikacija nefunkcijskih zahtjeva'},
{id:'p2-44',t:'P2',q:'Obvezna primjena propisanog procesa razvoja u tvrtki je primjer kojeg nefunkcijskog zahtjeva?',o:['Organizacijskog zahtjeva','Zahtjeva programskog proizvoda','Vanjskog zahtjeva','Funkcijskog zahtjeva'],a:0,e:'Organizacijski zahtjevi proizlaze iz pravila, politika i postupaka organizacije koja razvija ili koristi sustav.',s:'P02 · Klasifikacija nefunkcijskih zahtjeva'},
{id:'p2-45',t:'P2',q:'Što je arhitekturno značajan zahtjev (ASR)?',o:['Zahtjev koji bitno utječe na arhitekturne odluke; može biti funkcijski, nefunkcijski ili ograničenje','Isključivo nefunkcijski zahtjev performansi','Zahtjev koji opisuje izgled sučelja','Zahtjev najnižeg prioriteta'],a:0,e:'ASR bitno utječe na arhitekturne odluke. Npr. kratko vrijeme odziva može zahtijevati smanjenje komunikacije među komponentama.',s:'P02 · Klasifikacija nefunkcijskih zahtjeva'},
{id:'p2-46',t:'P2',q:'Koji su problemi zahtjeva domene primjene?',o:['Razumljivost (programeri ne razumiju domenu) i implicitnost (stručnjaci ih podrazumijevaju)','Previše su detaljni i jasni','Uvijek su nefunkcijski','Ne mogu se zapisati'],a:0,e:'Razumljivost: programeri ne razumiju domenu. Implicitnost: specijalisti domene toliko dobro poznaju primjenu da zahtjeve ne navode eksplicitno.',s:'P02 · Zahtjevi domene primjene'},
{id:'p2-47',t:'P2',q:'Koji su načini izražavanja zahtjeva sustava navedeni na predavanju?',o:['Strukturirani prirodni jezik, grafička notacija (npr. UML) te formalne notacije i matematički modeli','Samo slobodni prirodni jezik','Samo izvorni kod','Samo korisničke priče'],a:0,e:'Zahtjevi sustava izražavaju se strukturiranim prirodnim jezikom (obrasci), grafičkom notacijom (UML) i formalnim notacijama.',s:'P02 · Zahtjevi sustava i njihovo izražavanje'},
{id:'p2-48',t:'P2',q:'Koja je tvrdnja o SRS-u (Software Requirements Specification) točna?',o:['SRS je artefakt, a ne zasebna aktivnost; u agilnom razvoju može nastajati postupno','SRS je aktivnost procesa inženjerstva zahtjeva','SRS mora uvijek biti jedan monolitni dokument po strogom predlošku','SRS sadrži samo funkcijske zahtjeve'],a:0,e:'SRS objedinjuje funkcijske i nefunkcijske zahtjeve, ograničenja i sučelja. Važnije je da su zahtjevi identificirani, provjerljivi i sljedivi nego da dokument prati određeni predložak.',s:'P02 · Specifikacija zahtjeva programske potpore'},
{id:'p2-49',t:'P2',q:'Koji su elementi strukturiranog zapisa zahtjeva (npr. FR-03) u tablici s predavanja?',o:['ID, zahtjev, prioritet, izvor i kriterij prihvaćanja','Naziv razreda, atributi i operacije','Aktor, obrazac uporabe i odnos','Sprint, story bodovi i vlasnik'],a:0,e:'ID omogućuje praćenje, prioritet označava važnost, izvor objašnjava podrijetlo, a kriterij prihvaćanja omogućuje provjeru.',s:'P02 · Od formulacije zahtjeva do specifikacije'},
{id:'p2-50',t:'P2',q:'Koji je ispravan redoslijed koraka uspješnog izlučivanja zahtjeva?',o:['Priprema → izlučivanje → organiziranje i analiza → provjera s dionicima','Izlučivanje → priprema → provjera → analiza','Analiza → specifikacija → izlučivanje → priprema','Provjera → izlučivanje → priprema → analiza'],a:0,e:'Koraci: 1. priprema, 2. izlučivanje, 3. organiziranje i analiza, 4. provjera s dionicima. Početni rezultat su zabilježeni zahtjevi (stated requirements). Postupak je iterativan.',s:'P02 · Koraci uspješnog izlučivanja zahtjeva'},
{id:'p2-51',t:'P2',q:'Službenik za zaštitu podataka u sustavu LEGIS je:',o:['Dionik koji ne mora biti aktor: utječe na zahtjeve privatnosti, a ne mora izravno koristiti sustav','Aktor koji nije dionik','I dionik i aktor jer izravno koristi sustav','Ni dionik ni aktor'],a:0,e:'Dionik nije nužno aktor. Dispečer je dionik i aktor (izravno koristi sustav). Službenik za zaštitu podataka je dionik koji ne mora biti aktor (indirektna perspektiva).',s:'P02 · Perspektive pri analizi zahtjeva'},
{id:'p2-52',t:'P2',q:'Koje su vrste perspektiva pri analizi zahtjeva?',o:['Perspektiva interakcije, indirektne perspektive i perspektiva domene primjene','Logička, fizička i procesna','Statička i dinamička','Korisnička, razvojna i testna'],a:0,e:'Perspektiva interakcije: korisnici i sustavi koji izravno komuniciraju. Indirektne: dionici koji ne koriste sustav, ali utječu na zahtjeve. Domena: pravila i ograničenja domene.',s:'P02 · Perspektive pri analizi zahtjeva'},
{id:'p2-53',t:'P2',q:'Na kojoj se razini analize zahtjeva provjeravaju potpunost i konzistentnost cjeline?',o:['Na razini skupa zahtjeva','Na razini pojedinog zahtjeva','Samo na razini koda','Na razini prototipa'],a:0,e:'Pojedini zahtjev: šest kriterija. Skup zahtjeva: potpunost, konzistentnost, ostvarivost cjeline. Validacija: žele li dionici doista ovo što piše?',s:'P02 · Analiza zahtjeva'},
{id:'p2-54',t:'P2',q:'Tko je i kada predložio metodu MoSCoW?',o:['Dai Clegg, 1994.','Barry Boehm, 1988.','Winston Royce, 1970.','Fred Brooks, 1987.'],a:0,e:'MoSCoW (Must / Should / Could / Won\'t) predložio je Dai Clegg 1994.',s:'P02 · Konflikti i utvrđivanje prioriteta'},
{id:'p2-55',t:'P2',q:'Što u MoSCoW-u znači kategorija „W”?',o:['Won\'t have: izvan opsega ovog izdanja, može se razmotriti kasnije','Wish: želja korisnika koja se obavezno ostvaruje','Weak: zahtjev niske kvalitete','Waiting: zahtjev koji čeka odobrenje naručitelja'],a:0,e:'M (obavezno): bez toga projekt propada. S (poželjno): važno, ali može i bez. C (moguće): ako preostane vremena i novca. W (odgođeno): izvan opsega ovog izdanja.',s:'P02 · MoSCoW prioriteti i MVP'},
{id:'p2-56',t:'P2',q:'Po čemu se MoSCoW razlikuje od jednostavne podjele na visok, srednji i nizak prioritet?',o:['Povezuje prioritete s posljedicama izostavljanja i eksplicitno označava što nije dio trenutačne isporuke','Ima samo dvije kategorije','Koristi se samo u vodopadnom modelu','Određuje redoslijed implementacije unutar sprinta'],a:0,e:'Prioritet kaže koliko je zahtjev važan, ali ne i što se događa ako ga ne ostvarimo. MoSCoW to povezuje i označava ono što je izvan isporuke, što pomaže protiv scope creepa.',s:'P02 · Konflikti i utvrđivanje prioriteta'},
{id:'p2-57',t:'P2',q:'Što je MVP (Minimum Viable Product)?',o:['Najmanja inačica proizvoda koja korisniku već isporučuje ono važno i omogućuje rane povratne informacije','Prototip namijenjen odbacivanju','Konačna verzija sa svim funkcijama','Dokument s popisom zahtjeva'],a:0,e:'MVP sadrži samo najnužniju funkcionalnost. Daje rane povratne informacije, manji rizik i trošak, a korisnici vode sljedeće korake.',s:'P02 · MoSCoW prioriteti i MVP'},
{id:'p2-58',t:'P2',q:'Koja je razlika između verifikacije i validacije?',o:['Verifikacija: gradimo li sustav ispravno (prema specifikaciji)? Validacija: gradimo li pravi sustav (što dionici trebaju)?','Verifikacija: gradimo li pravi sustav? Validacija: gradimo li ga ispravno?','Verifikacija se radi samo ručno, a validacija automatski','Nema razlike'],a:0,e:'Verifikacija provjerava usklađenost sa specifikacijom, a validacija odgovara li sustav stvarnim potrebama dionika.',s:'P02 · Validacija zahtjeva'},
{id:'p2-59',t:'P2',q:'Koja metoda validacije zahtjeva otkriva je li zahtjev provjerljiv (npr. granične vrijednosti 2:59, 3:00, 3:01)?',o:['Ispitni slučajevi','Recenzija zahtjeva','Prototip','Etnografija'],a:0,e:'Recenzija otkriva nejasnoće i proturječja. Prototip otkriva što dionik razumije drugačije. Ispitni slučajevi otkrivaju je li zahtjev provjerljiv.',s:'P02 · Validacija zahtjeva'},
{id:'p2-60',t:'P2',q:'Što je sljedivost (traceability) zahtjeva?',o:['Mogućnost praćenja podrijetla zahtjeva i njegovih veza s drugim artefaktima','Praćenje lokacije korisnika sustava','Broj promjena zahtjeva u sprintu','Mjerenje performansi sustava'],a:0,e:'Sadržajna sljedivost: zahtjev → obrazac uporabe → arhitekturna realizacija → ispitni slučaj. Praćenje provedbe: zahtjev → zadatak → commit/PR. Kod promjene se odmah vidi što treba izmijeniti.',s:'P02 · Sljedivost zahtjeva u projektu'},
{id:'p2-61',t:'P2',q:'Koji je ispravan redoslijed upravljanja promjenama zahtjeva?',o:['Zabilježiti prijedlog → analizirati utjecaj → dogovoriti i odlučiti → provesti i pratiti','Provesti promjenu → zabilježiti → analizirati','Odabrati CASE alat → zabilježiti → provesti','Dogovoriti → provesti → zabilježiti → analizirati'],a:0,e:'1. zabilježiti prijedlog (što i zašto), 2. analizirati utjecaj, 3. dogovoriti i odlučiti, 4. provesti i pratiti. Odabir CASE alata nije korak procesa.',s:'P02 · Upravljanje procesom promjena'},
{id:'p2-62',t:'P2',q:'Koje su vrste promjena zahtjeva navedene uz upravljanje zahtjevima?',o:['Okolinom promijenjeni, novonastali, posljedični i zahtjevi kompatibilnosti','Funkcijski, nefunkcijski, domenski','Hitni, normalni, odgođeni','Must, Should, Could, Won\'t'],a:0,e:'Vrste promjena: zahtjevi promijenjeni okolinom, novonastali, posljedični i zahtjevi kompatibilnosti.',s:'P02 · Upravljanje zahtjevima'},
{id:'p2-63',t:'P2',q:'Koja je preporuka za pogrešku „zanemarivanje nefunkcijskih zahtjeva”?',o:['Aktivno pitati o kvaliteti sustava i definirati mjerljive kriterije (npr. odziv ispod 2 s)','Ostaviti nefunkcijske zahtjeve za fazu održavanja','Zamijeniti ih funkcijskim zahtjevima','Prepustiti ih UI asistentu'],a:0,e:'Zanemarivanje NFR-ova daje tehnički ispravan, ali neupotrebljiv proizvod. Treba aktivno postavljati pitanja o kvaliteti i definirati mjerljive kriterije.',s:'P02 · Česte pogreške'},
{id:'p2-64',t:'P2',q:'Koje su četiri glavne skupine procesa norme ISO/IEC/IEEE 12207?',o:['Procesi ugovaranja, organizacijski procesi za potporu, procesi tehničkog upravljanja, tehnički procesi','Planiranje, analiza, izrada, ispitivanje','Zahtjevi, arhitektura, implementacija, održavanje','Inicijacija, elaboracija, konstrukcija, tranzicija'],a:0,e:'ISO 12207: ugovaranje (nabava, isporuka), organizacijski (portfelj, ljudski resursi, kvaliteta), tehničko upravljanje (planiranje, rizik, konfiguracija), tehnički procesi (zahtjevi, arhitektura, ispitivanje, održavanje).',s:'P02 · ISO/IEC/IEEE 12207:2026'},
{id:'p2-65',t:'P2',q:'Što definira norma ISO/IEC/IEEE 29148:2018?',o:['Procese inženjerstva zahtjeva i povezane informacijske artefakte','Model kvalitete proizvoda s devet značajki','Procese životnog ciklusa programske potpore','Opis arhitekture sustava'],a:0,e:'29148 je norma za inženjerstvo zahtjeva. 12207 opisuje procese životnog ciklusa. 25010:2023 je model kvalitete proizvoda s devet značajki. 42010 se odnosi na opis arhitekture.',s:'P02 · Normiranje zahtjeva i model kvalitete'},
{id:'p2-66',t:'P2',q:'Koja je tvrdnja o zahtjevima u životnom ciklusu točna?',o:['Zahtjevi se utvrđuju, provjeravaju i mijenjaju tijekom cijelog razvoja, a ne samo na početku','Zahtjevi se definiraju jednom na početku i više se ne mijenjaju','Zahtjevi su važni samo u fazi ispitivanja','Zahtjevi se ne povezuju s ispitivanjem'],a:0,e:'Zahtjevi povezuju potrebe dionika s oblikovanjem, implementacijom i ispitivanjem, a njihovo utvrđivanje i provjera nastavljaju se tijekom razvoja.',s:'P02 · Životni ciklus: uloga zahtjeva'}
);

/* P3 – Modeli razvoja programske potpore */
Q.push(
{id:'p3-01',t:'P3',q:'Po čemu se modeli razvoja programske potpore prvenstveno razlikuju?',o:['Po organizaciji temeljnih aktivnosti: redoslijedu, ponavljanju, povratnim informacijama, upravljanju rizicima i učestalosti isporuka','Po tome koje temeljne aktivnosti uopće sadrže','Po programskom jeziku koji propisuju','Po broju članova tima'],a:0,e:'Iste temeljne aktivnosti (specifikacija, oblikovanje i implementacija, V&V, evolucija) postoje u svakom procesu. Modeli se razlikuju po njihovoj organizaciji.',s:'P03 · Kriteriji razlikovanja modela razvoja'},
{id:'p3-02',t:'P3',q:'Koje su tri temeljne funkcije specifikacije?',o:['Podloga za oblikovanje, smjernica za implementaciju i osnova za provjeru','Ugovor, račun i jamstvo','Plan, budžet i raspored','Kod, ispitni slučajevi i dokumentacija'],a:0,e:'Specifikacija je podloga za oblikovanje (zahtjevi i ograničenja), smjernica za implementaciju (ponašanje i pravila) i osnova za provjeru. Moderna specifikacija može biti živi dokument.',s:'P03 · Specifikacija'},
{id:'p3-03',t:'P3',q:'Što je fokus oblikovanja, a što implementacije?',o:['Oblikovanje: kako će sustav ostvariti zahtjeve (arhitektura, sučelja). Implementacija: kako ostvariti projektirano rješenje u kodu.','Oblikovanje: pisanje koda. Implementacija: crtanje dijagrama.','Oblikovanje: ispitivanje. Implementacija: isporuka.','Nema razlike; granica je čvrsta i jasna'],a:0,e:'Oblikovanje daje arhitekturne odluke, modele i specifikacije. Implementacija daje provjerene komponente. Granica nije čvrsta jer se odluke donose i tijekom implementacije.',s:'P03 · Oblikovanje i implementacija'},
{id:'p3-04',t:'P3',q:'Koje su metode verifikacije navedene na predavanju?',o:['Pregled koda, statička analiza, jedinično i integracijsko ispitivanje','Korisničko ispitivanje prihvaćanja (UAT) i evaluacija prototipova','Ankete o zadovoljstvu korisnika','Brainstorming i etnografija'],a:0,e:'Verifikacija (u skladu sa specifikacijom?): pregled koda, statička analiza, jedinično i integracijsko ispitivanje. Validacija (stvarne potrebe?): UAT, evaluacija prototipova, povratne informacije.',s:'P03 · Verifikacija i validacija'},
{id:'p3-05',t:'P3',q:'Korisničko ispitivanje prihvaćanja (UAT) je metoda:',o:['Validacije','Verifikacije','Statičke analize','Integracije'],a:0,e:'UAT provjerava zadovoljava li sustav stvarne potrebe korisnika, pa je to validacija.',s:'P03 · Verifikacija i validacija'},
{id:'p3-06',t:'P3',q:'Zašto se ne provodi iscrpno ispitivanje svih ulaza?',o:['Najčešće je nepraktično i vremenski neizvedivo, pa se bira reprezentativan podskup (klase ekvivalencije, granične vrijednosti)','Zato što je zabranjeno normom ISO 12207','Zato što ispitivanje nije potrebno ako postoji specifikacija','Zato što statička analiza otkriva sve greške'],a:0,e:'Iscrpno ispitivanje je nepraktično čak i uz konačan broj ulaza. Bira se reprezentativan podskup koji maksimizira vjerojatnost pronalaska pogreške.',s:'P03 · Ispitivanje programske potpore'},
{id:'p3-07',t:'P3',q:'Što kaže Lehmanov zakon kontinuirane promjene?',o:['Sustavi u promjenjivom okruženju moraju se prilagođavati da bi zadržali uporabnu vrijednost','Složenost sustava uvijek pada tijekom evolucije','Dodavanje ljudi projektu koji kasni ga usporava','Struktura sustava odražava strukturu organizacije'],a:0,e:'Lehman (1996.): zakon kontinuirane promjene i zakon rastuće složenosti (složenost raste ako se ne ograničava, npr. refaktoriranjem).',s:'P03 · Evolucija programskog proizvoda'},
{id:'p3-08',t:'P3',q:'Što kaže Lehmanov zakon rastuće složenosti?',o:['Složenost tijekom evolucije raste ako se ne poduzimaju aktivnosti njezina ograničavanja (refaktoriranje)','Složenost je konstantna tijekom života sustava','Složenost se smanjuje dodavanjem funkcionalnosti','Složenost ovisi samo o broju korisnika'],a:0,e:'Bez aktivnog ograničavanja (refaktoriranje) složenost raste. Zato tehnički dug treba plansko vraćanje.',s:'P03 · Evolucija programskog proizvoda'},
{id:'p3-09',t:'P3',q:'Što je karakteristično za ad hoc pristup razvoju?',o:['Nema razrade zahtjeva ni oblikovanja; razmatra se samo za male projekte','Strogo definirane faze s ključnim točkama','Rizikom vođene petlje','Sprintovi fiksne duljine'],a:0,e:'U ad hoc pristupu tim mijenja program dok ne zadovolji korisnika. Struktura se pogoršava, napredak se ne može ocijeniti, a trošak razvoja i održavanja je vrlo visok.',s:'P03 · Ad hoc pristup razvoju'},
{id:'p3-10',t:'P3',q:'Tko je 1970. opisao model koji je kasnije nazvan vodopadnim i što je preporučio?',o:['W. W. Royce; prikazao ga je kao rizičan i preporučio iteracije','Barry Boehm; preporučio je analizu rizika','Kent Beck; preporučio je TDD','Fred Brooks; preporučio je veće timove'],a:0,e:'Royce je u radu „Managing the development of large software systems” (1970.) prikazao sekvencijski model kao rizičan i preporučio iteracije. Naziv „vodopadni” uveden je kasnije.',s:'P03 · Vodopadni model razvoja'},
{id:'p3-11',t:'P3',q:'U kojim je uvjetima vodopadni model preporučljiv?',o:['Kada su zahtjevi i opseg dobro poznati i stabilni, a tehnologija poznata i provjerena','Kada se zahtjevi često mijenjaju','Kada je tehnologija nova i neprovjerena','Kada korisnik želi vidjeti sustav što ranije'],a:0,e:'Npr. nova verzija postojećeg proizvoda uz ograničene promjene ili prijenos na novu platformu uz poznate rizike. Manje je prikladan za projekte s čestim promjenama.',s:'P03 · Pretpostavke vodopadnog modela'},
{id:'p3-12',t:'P3',q:'Koji je NEDOSTATAK vodopadnog modela?',o:['Može dati lažan dojam napretka jer dovršen dokument nije provjeren rad sustava','Teško ga je razumjeti','Ne pruža strukturu neiskusnom timu','Nema jasno definiranih ključnih točaka'],a:0,e:'Nedostaci: idealiziran je, promjene se teško ugrađuju, svi zahtjevi moraju biti poznati unaprijed, integracija se odgađa (big bang), klijent kasno vidi sustav, teško je integrirati upravljanje rizicima. Prednosti su jednostavnost i struktura.',s:'P03 · Prednosti i ograničenja vodopadnog modela'},
{id:'p3-13',t:'P3',q:'Što je karakteristično za V-model?',o:['Svaka razina razvoja ima pripadnu razinu ispitivanja, a ispitni slučajevi planiraju se uz specifikaciju','Nema faze ispitivanja','Razvoj se odvija u sprintovima','Svaka petlja počinje analizom rizika'],a:0,e:'Zahtjevi ↔ ispitivanje prihvaćanja (validacija), oblikovanje sustava ↔ sustavno ispitivanje, arhitektura ↔ integracijsko, modul ↔ jedinično. Tipično u reguliranim i sigurnosno kritičnim domenama.',s:'P03 · V-model: odnos razvoja i ispitivanja'},
{id:'p3-14',t:'P3',q:'U V-modelu, koja razina ispitivanja odgovara oblikovanju modula?',o:['Jedinično ispitivanje','Ispitivanje prihvaćanja','Sustavno ispitivanje','Integracijsko ispitivanje'],a:0,e:'Oblikovanje modula ↔ jedinično ispitivanje. Oblikovanje arhitekture ↔ integracijsko. Oblikovanje sustava ↔ sustavno. Zahtjevi ↔ ispitivanje prihvaćanja.',s:'P03 · V-model: odnos razvoja i ispitivanja'},
{id:'p3-15',t:'P3',q:'Gdje se V-model tipično koristi?',o:['U reguliranim i sigurnosno kritičnim domenama (medicina, zrakoplovstvo, automobilska industrija)','U startupima koji traže brz MVP','U projektima bez dokumentacije','Isključivo u igrama'],a:0,e:'V-model se koristi gdje su sljedivost i dokaz provjere obvezni.',s:'P03 · V-model: odnos razvoja i ispitivanja'},
{id:'p3-16',t:'P3',q:'Koja je razlika između iteracije i inkrementa?',o:['Iteracija ponavlja aktivnosti radi poboljšanja istog dijela; inkrement dodaje novu uporabljivu funkcionalnost','Iteracija dodaje novu funkcionalnost; inkrement ponavlja postojeću','To su sinonimi','Inkrement se koristi samo u vodopadnom modelu'],a:0,e:'Iterativno: cijeli proizvod, svaki put bolji. Inkrementalno: proizvod raste dio po dio. U praksi se kombiniraju; inkrement se često razvija kroz više iteracija.',s:'P03 · Iterativni i inkrementalni razvoj'},
{id:'p3-17',t:'P3',q:'Što je karakteristično za inkrementalni pristup?',o:['Zahtjevi se svrstaju u prioritetne cjeline, a dijelovi višeg prioriteta isporučuju se u ranim inkrementima','Sustav se isporučuje korisniku samo u cjelini na kraju','Zahtjevi svih inkremenata zamrzavaju se na početku','Svaki inkrement počinje analizom rizika'],a:0,e:'Na početku inkrementa njegovi se zahtjevi privremeno stabiliziraju, a zahtjevi kasnijih inkremenata nastavljaju evoluirati.',s:'P03 · Inkrementalni pristup'},
{id:'p3-18',t:'P3',q:'Koja je prednost inkrementalnog razvoja?',o:['Rani inkrementi služe kao prototipovi za izlučivanje zahtjeva kasnijih inkremenata','Svi zahtjevi moraju biti poznati unaprijed','Kupac vidi sustav tek na kraju','Nema potrebe za ispitivanjem'],a:0,e:'Prednosti: kupac dobiva poboljšanje sa svakim inkrementom, funkcionalnost je rano dostupna, rani inkrementi služe kao prototipovi, manji je rizik, a prioritetne usluge se detaljnije ispituju.',s:'P03 · Prednosti inkrementalnog razvoja'},
{id:'p3-19',t:'P3',q:'Koja je razlika između odbacivog i evolucijskog prototipa?',o:['Odbacivi se izrađuje radi razjašnjavanja zahtjeva ili rizika pa se odbacuje; evolucijski se nadograđuje i može prerasti u proizvod','Odbacivi postaje proizvod, a evolucijski se odbacuje','Oba ulaze u konačni proizvod','Evolucijski prototip ne zahtijeva brigu o arhitekturi'],a:0,e:'Razlika je u dugoročnoj namjeni. Odbacivi (npr. spike, Figma prototip) se odbacuje. Evolucijski (npr. MVP) prerasta u proizvod, pa su arhitektura i kvaliteta koda važne.',s:'P03 · Evolucijski model razvoja; Svrhe prototipiranja'},
{id:'p3-20',t:'P3',q:'Istraživački zadatak (spike) u Scrumu je primjer:',o:['Odbacivog prototipa','Evolucijskog prototipa','MVP-a','Inkrementa'],a:0,e:'Spike služi za brzo razjašnjavanje nepoznatog ili eksperimentalnu provjeru izvedivosti. Kod se piše bez težnje za kvalitetom i odbacuje se nakon odluke.',s:'P03 · Svrhe prototipiranja'},
{id:'p3-21',t:'P3',q:'Koji je problem evolucijskog razvoja naveden na predavanju?',o:['Sustavi su često loše strukturirani, a korisnik prototip može smatrati dovršenim sustavom','Nemoguće je dobiti povratne informacije korisnika','Zahtijeva da svi zahtjevi budu poznati unaprijed','Prikladan je samo za vrlo velike sustave'],a:0,e:'Problemi: proces nije jasno vidljiv, sustavi su loše strukturirani, potrebne su posebne vještine, korisnik može prototip smatrati gotovim. Primjenjiv je za male i srednje interaktivne sustave i dijelove velikih sustava (npr. UI).',s:'P03 · Evolucijski razvoj: ograničenja i primjena'},
{id:'p3-22',t:'P3',q:'Tko je i kada predložio spiralni model?',o:['Barry Boehm, 1988.','W. W. Royce, 1970.','Kent Beck, 1999.','Ken Schwaber, 2001.'],a:0,e:'Spiralni model: Barry Boehm, „A Spiral Model of Software Development and Enhancement” (1988.).',s:'P03 · Spiralni model razvoja'},
{id:'p3-23',t:'P3',q:'Što je ključni naglasak spiralnog modela?',o:['Analiza rizika: svaka petlja određuje ciljeve i aktivnosti prema rizicima','Fiksne faze bez povratnih veza','Rad u paru','Ograničenje rada u tijeku'],a:0,e:'Spiralni model je rizicima vođen pristup bez fiksnih faza. Svaka petlja ima četiri kvadranta: postavljanje ciljeva, procjena i smanjenje rizika, razvoj i provjera, planiranje sljedećeg kruga.',s:'P03 · Spiralni model razvoja'},
{id:'p3-24',t:'P3',q:'Koji je ispravan redoslijed kvadranata jedne petlje spiralnog modela?',o:['Postavljanje ciljeva → procjena i smanjenje rizika → razvoj i provjera → planiranje sljedećeg kruga','Razvoj → ispitivanje → isporuka → održavanje','Procjena rizika → razvoj → postavljanje ciljeva → planiranje','Planiranje → kodiranje → izgradnja → nadzor'],a:0,e:'1. postavljanje ciljeva, 2. procjena i smanjenje rizika, 3. razvoj i provjera, 4. planiranje sljedećeg kruga. Radijus spirale predstavlja kumulativni trošak i napredak.',s:'P03 · Spiralni model razvoja'},
{id:'p3-25',t:'P3',q:'Što predstavlja radijus spirale u spiralnom modelu?',o:['Kumulativni trošak i napredak','Broj članova tima','Broj grešaka','Razinu rizika u trenutnoj petlji'],a:0,e:'Radijus spirale je kumulativni trošak i napredak. Svaka petlja obuhvaća sva četiri kvadranta.',s:'P03 · Spiralni model razvoja'},
{id:'p3-26',t:'P3',q:'Koji je nedostatak spiralnog modela?',o:['Složen je, ima veliko administrativno opterećenje i skup je za male projekte','Ne uzima u obzir rizike','Ne dopušta prototipove','Ne dopušta iteracije'],a:0,e:'Nedostaci: složenost, administrativno opterećenje, potrebno poznavanje analize rizika, skup za male projekte.',s:'P03 · Prednosti i ograničenja spiralnog modela'},
{id:'p3-27',t:'P3',q:'Kako se razlikuju inkrementalni i spiralni model u pogledu rizika?',o:['U spiralnom je eksplicitna analiza rizika obvezna u svakoj petlji; u inkrementalnom se rizik smanjuje ranom isporukom','Inkrementalni ima obveznu analizu rizika, a spiralni nema','Ni jedan ne razmatra rizik','Oba identično upravljaju rizikom'],a:0,e:'Inkrementalni: sustav raste dio po dio, analiza rizika nije obvezna. Spiralni: redoslijed rada određuju najveći rizici i svaka petlja ih eksplicitno analizira.',s:'P03 · Usporedba inkrementalnog i spiralnog modela'},
