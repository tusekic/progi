{id:'p5-25',t:'P5',q:'Koji je prvi korak metode ADD 3.0?',o:['Pregled ulaza: zahtjevi, ograničenja, kontekst i postojeće odluke','Konkretizacija elemenata','Analiza i provjera','Skiciranje pogleda'],a:0,e:'ADD 3.0: 1. pregled ulaza, 2. cilj iteracije, 3. elementi za razradu, 4. koncepti oblikovanja, 5. konkretizacija, 6. pogledi i odluke, 7. analiza i provjera.',s:'P05 · Metoda ADD 3.0: sedam koraka'},
{id:'p5-26',t:'P5',q:'U kojem se koraku ADD 3.0 razmatraju obrasci i stilovi koji odgovaraju pokretačima?',o:['4. Koncepti oblikovanja','2. Cilj iteracije','5. Konkretizacija','7. Analiza i provjera'],a:0,e:'Korak 4: razmotriti obrasce, stilove i druge koncepte. Korak 5: odrediti elemente, odgovornosti, odnose i sučelja.',s:'P05 · Metoda ADD 3.0: sedam koraka'},
{id:'p5-27',t:'P5',q:'Koja je prednost modularnog monolita u odnosu na mikroservise?',o:['Jednostavniji početni razvoj i lakše transakcije nad podacima','Neovisno skaliranje svake usluge','Odvojene isporuke svakog dijela','Izolacija kvarova po uslugama'],a:0,e:'Modularni monolit: jedna aplikacija, manje rada, lakše transakcije. Mikroservisi: neovisno skaliranje i isporuke, ali više infrastrukture, mrežni kvarovi i teža dosljednost.',s:'P05 · Monolit i mikroservisi: kompromisi'},
{id:'p5-28',t:'P5',q:'Koja je tvrdnja o skaliranju točna prema predavanju?',o:['Modularni monolit može se skalirati horizontalno; mikroservisi su zasebna odluka koju treba opravdati','Samo mikroservisi se mogu skalirati','Postoji obvezan put monolit → mikroservisi','Skaliranje proizlazi automatski iz stila klijent–poslužitelj'],a:0,e:'Više instanci istog backenda uz uravnoteživač opterećenja je skaliranje bez mikroservisa. Nema obveznog puta monolit → mikroservisi.',s:'P05 · Skaliranje web-aplikacije'},
{id:'p5-29',t:'P5',q:'Koji je nedostatak debelog klijenta (fat client)?',o:['Veći zahtjevi za klijentski uređaj i složenije održavanje klijentskih inačica','Veća ovisnost o mreži','Veće opterećenje poslužitelja obradom','Ne može imati bogate lokalne interakcije'],a:0,e:'Debeli klijent obrađuje lokalno (bogatije interakcije, moguć rad bez mreže), ali ima veće zahtjeve za uređaj. Tanki klijent ima centralizirano održavanje, ali veću ovisnost o mreži i opterećenje poslužitelja.',s:'P05 · Primjer analize kompromisa'},
{id:'p5-30',t:'P5',q:'Koju metodu vrednovanja arhitekture koristimo za ekonomsko vrednovanje odnosa troška i koristi?',o:['CBAM','ATAM','SAAM','ADD'],a:0,e:'ATAM: kompromisi i rizici kvalitativnih svojstava. SAAM: promjenjivost. CBAM: trošak/korist. ADD je metoda oblikovanja, a ne vrednovanja.',s:'P05 · Pristupi vrednovanju arhitekture'},
{id:'p5-31',t:'P5',q:'Koja metoda vrednovanja procjenjuje promjenjivost (učinak promjena prema scenarijima)?',o:['SAAM','CBAM','ATAM','PoC'],a:0,e:'SAAM procjenjuje promjenjivost. ATAM analizira kompromise i rizike kvalitete. CBAM procjenjuje trošak i korist.',s:'P05 · Pristupi vrednovanju arhitekture'},
{id:'p5-32',t:'P5',q:'Što je točka kompromisa (tradeoff point) u ATAM-u?',o:['Odluka ili svojstvo koje utječe na više atributa kvalitete, pa njihove učinke treba usporediti','Odluka koja posebno utječe na jedan atribut kvalitete','Pretpostavka koju tek treba razjasniti','Odluka bez rizika'],a:0,e:'Točka osjetljivosti utječe na jedan atribut. Točka kompromisa utječe na više njih. Npr. ponovni pokušaj slanja pri slaboj mreži utječe na pouzdanost, odziv i rizik dupliciranja.',s:'P05 · ATAM: rizici i kompromisi'},
{id:'p5-33',t:'P5',q:'Što je ADR (Architecture Decision Record)?',o:['Kratak zapis važne odluke, alternativa i posljedica; nije metoda vrednovanja','Metoda vrednovanja arhitekture','Obvezni UML dijagram','Norma za opis arhitekture'],a:0,e:'Elementi ADR-a: naslov i status (nacrt / prihvaćeno / zamijenjeno), kontekst, alternative, odluka, posljedice. Status „nacrt” ne znači da je izbor prihvaćen.',s:'P05 · Dokumentiranje odluka – ADR'},
{id:'p5-34',t:'P5',q:'Koji element NIJE dio ADR-a prema predavanju?',o:['Dijagram razreda cijelog sustava','Kontekst','Alternative','Posljedice'],a:0,e:'ADR sadrži naslov i status, kontekst, alternative, odluku i posljedice.',s:'P05 · Dokumentiranje odluka – ADR'},
{id:'p5-35',t:'P5',q:'Koji arhitektonski stil pripada kategoriji „prikaz i upravljanje” (odvajanje prikaza i logike)?',o:['MVC, MVP, MVVM','Cjevovod i filteri','Publish–Subscribe','Repozitorij'],a:0,e:'Struktura: slojeviti, cjevovod i filteri. Raspodijeljenost: klijent–poslužitelj, P2P, SOA. Prikaz: MVC/MVP/MVVM. Podaci: repozitorij, crna ploča. Događaji: event-driven, pub-sub. Modularnost: mikroservisi, plug-in.',s:'P05 · Arhitektonski stilovi i obrasci'},
{id:'p5-36',t:'P5',q:'Za koju je primjenu tipično koristan stil cjevovod i filteri (pipes and filters)?',o:['ETL i obrada signala','Web-aplikacije s bogatim sučeljem','Upravljanje narudžbama u mikroservisima','Peer-to-peer dijeljenje datoteka'],a:0,e:'Cjevovod i filteri: filter obrađuje podatke, cijev ih prenosi. Dobra je modularnost, uz ograničenja toka.',s:'P05 · Stil: komponente i funkcionalnost; Arhitektonski pristupi i kompromisi'},
{id:'p5-37',t:'P5',q:'Koji je nedostatak arhitekture klijent–poslužitelj?',o:['Poslužitelj može biti jedinstvena točka kvara i usko grlo','Nema centraliziranog upravljanja','Klijent mora unaprijed poznavati sve druge klijente','Ne može se koristiti za web'],a:0,e:'Prednosti: centralizirano upravljanje, mogućnost skaliranja, jasna podjela odgovornosti. Nedostaci: jedinstvena točka kvara i preopterećenje poslužitelja.',s:'P05 · Komunikacija u arh. klijent-poslužitelj'},
{id:'p5-38',t:'P5',q:'U arhitekturi klijent–poslužitelj, tko inicira komunikaciju?',o:['Klijent aktivno traži usluge; poslužitelj pasivno čeka zahtjeve','Poslužitelj šalje zahtjeve klijentima','Oba istovremeno','Treća strana (posrednik)'],a:0,e:'Klijent inicira zahtjev, a poslužitelj vraća odgovor. Poslužitelj ne mora unaprijed poznavati klijente.',s:'P05 · Arhitektonski stil klijent–poslužitelj'},
{id:'p5-39',t:'P5',q:'Koja je razlika između logičkog sloja (layer) i fizičke razine (tier)?',o:['Sloj je logička organizacija odgovornosti i ovisnosti; razina je organizacija u izvršavanju; slojevi ne moraju biti na zasebnim poslužiteljima','Sloj i razina su isti pojam','Razina je logička, a sloj fizička organizacija','Svaki sloj mora biti na zasebnom poslužitelju'],a:0,e:'Odvajanje slojeva na fizičke poslužitelje je druga arhitektonska odluka. Slojevi se mogu izvršavati u istoj aplikaciji.',s:'P05 · Slojevita arhitektura'},
{id:'p5-40',t:'P5',q:'Što je stroga slojevitost?',o:['Sloj koristi samo neposredno niži sloj','Svaki sloj može koristiti bilo koji drugi sloj','Sloj koristi samo viši sloj','Zabranjena je svaka međuslojna komunikacija'],a:0,e:'Stroga: samo neposredno niži sloj. Opuštena: dopušta kontrolirane, opravdane preskoke.',s:'P05 · Slojevita arhitektura'},
{id:'p5-41',t:'P5',q:'Koji sloj sadrži repozitorije, DAO i ORM alate?',o:['Sloj pristupa podacima','Prezentacijski sloj','Domenski (poslovni) sloj','Sigurnosni sloj'],a:0,e:'Sloj pristupa podacima upravlja podacima i izolira poslovni sloj od detalja baze. Koristi ga poslovni sloj.',s:'P05 · Slojevi aplikacije'},
{id:'p5-42',t:'P5',q:'Koja je tvrdnja o slojevitoj arhitekturi točna?',o:['Slojevitost sama po sebi ne jamči skalabilnost, brzinu ni neovisni razmještaj','Više slojeva uvijek povećava performanse','Slojevitost automatski znači mikroservise','MVC je sinonim za svaku višeslojnu arhitekturu'],a:0,e:'Prednosti su jasne odgovornosti, izolirano ispitivanje i razumljivost. Previše slojeva uvodi posrednike i složenost. MVC nije sinonim za slojevitost.',s:'P05 · Prednosti višeslojne arhitekture'},
{id:'p5-43',t:'P5',q:'Koje su odgovornosti u obrascu MVC?',o:['Model: podaci, stanje i logika domene; Pogled: prikaz; Upravljač: obrada interakcija','Model: prikaz; Pogled: baza; Upravljač: mreža','Model: HTTP; Pogled: CSS; Upravljač: SQL','Model, pogled i upravljač su zasebni mrežni poslužitelji'],a:0,e:'MVC je obrazac raspodjele odgovornosti. Upravljač, pogled i model nisu mrežni poslužitelji.',s:'P05 · Arhitektonski obrazac Model–Pogled–Upravljač; MVC: Struktura i odgovornosti'},
{id:'p5-44',t:'P5',q:'U poslužiteljskom web MVC-u, što radi upravljač?',o:['Prima zahtjev, poziva model ili domenske usluge i odabire predložak za odgovor','Izvršava se u pregledniku i crta komponente','Sprema podatke izravno u bazu bez modela','Prikazuje HTML korisniku'],a:0,e:'U web MVC-u (Spring MVC, Rails) upravljač je na poslužitelju i bira predložak za HTTP odgovor. U React SPA + REST API pogled nastaje u pregledniku.',s:'P05 · MVC u web-aplikacijama; Primjer: tijek zahtjeva u web MVC-u'},
{id:'p5-45',t:'P5',q:'Koja inačica obrasca koristi ViewModel koji povezuje stanje s pogledom (npr. WPF)?',o:['MVVM','MVP','Klasični MVC','Web MVC'],a:0,e:'MVP: Presenter upravlja pogledom kroz sučelje (npr. WinForms). MVVM: ViewModel, povezivanje stanja (WPF, .NET MAUI). React nije automatski MVVM.',s:'P05 · MVC inačice'},
{id:'p5-46',t:'P5',q:'Jedan upravljač provjerava token, domenska pravila, upisuje SQL i šalje Firebase poruku. Što je ispravna preporuka?',o:['Razdvojiti odgovornosti: sigurnosni sloj, upravljač (HTTP/DTO), servis (pravila), repozitorij (pohrana), adapter za poruke','Ostaviti tako jer je jednostavnije','Premjestiti sve u bazu podataka','Premjestiti sve u preglednik'],a:0,e:'Razdvajanje omogućuje ispitivanje bez stvarnog Firebasea i Rendera. Izdvajanje treba opravdati odgovornostima i očekivanim promjenama.',s:'P05 · Razdvajanje odgovornosti: primjer'},
{id:'p5-47',t:'P5',q:'Koja je razlika između autentikacije i autorizacije?',o:['Autentikacija: tko je korisnik? Autorizacija: što smije učiniti?','Autentikacija: što smije učiniti? Autorizacija: tko je korisnik?','To su sinonimi','Autorizacija se radi samo u pregledniku'],a:0,e:'OIDC daje podatke o identitetu (autentikacija), a API provjerava smije li korisnik izvršiti operaciju (autorizacija). Za SPA se koristi Authorization Code + PKCE.',s:'P05 · Vanjska autentikacija'},
{id:'p5-48',t:'P5',q:'Što treba napraviti ako tajni ključ procuri u Git repozitorij?',o:['Opozvati i zamijeniti ključ (novi ključ i ponovni razmještaj), a ne samo obrisati ga iz povijesti','Samo obrisati commit','Ništa, ako je repozitorij privatan','Promijeniti ime varijable'],a:0,e:'Tajne nisu dio koda, nego varijable okruženja. U repozitorij ide samo .env.example s imenima.',s:'P05 · Tajne i konfiguracija'},
{id:'p5-49',t:'P5',q:'Što je visoka kohezija modula?',o:['Modul grupira snažno povezane elemente koji služe jedinstvenoj, jasno definiranoj svrsi','Modul ima mnogo ovisnosti o drugim modulima','Modul sadrži sve funkcije sustava','Modul ne ovisi ni o čemu'],a:0,e:'„Radi jednu stvar i radi je dobro.” Izravno je vezana uz SRP. Olakšava razumijevanje, održavanje i ponovnu uporabu.',s:'P05 · 2. Povećaj koheziju'},
{id:'p5-50',t:'P5',q:'Koja je vrsta kohezije najpoželjnija?',o:['Funkcijska','Slučajna','Logička','Vremenska'],a:0,e:'Od najbolje prema najlošijoj: funkcijska, sekvencijska, komunikacijska, proceduralna, vremenska, logička, slučajna.',s:'P05 · Vrste kohezije'},
{id:'p5-51',t:'P5',q:'Elementi modula izvršavaju se u istoj fazi (npr. pokretanje sustava). Koja je to kohezija?',o:['Vremenska','Sekvencijska','Funkcijska','Komunikacijska'],a:0,e:'Vremenska: izvršavaju se u istoj fazi ili vremenu. Sekvencijska: izlaz jednog koraka je ulaz drugom. Komunikacijska: rade nad istim podacima.',s:'P05 · Vrste kohezije'},
{id:'p5-52',t:'P5',q:'Koraci „čitaj → obradi → spremi”, gdje je izlaz jednog ulaz drugom, čine koju koheziju?',o:['Sekvencijsku','Proceduralnu','Logičku','Slučajnu'],a:0,e:'Sekvencijska: izlaz jednog koraka je ulaz drugom. Proceduralna: povezuje ih samo potreban redoslijed izvršenja.',s:'P05 · Vrste kohezije'},
{id:'p5-53',t:'P5',q:'Koja je vrsta međuovisnosti (coupling) najlošija?',o:['Sadržajna (izravna izmjena tuđeg stanja, oslanjanje na unutarnje detalje)','Podatkovna','Porukovna','Strukturna (stamp)'],a:0,e:'Od slabije prema jačoj: porukovna, podatkovna, strukturna, upravljačka, vanjska, zajednička, sadržajna.',s:'P05 · Klasifikacija međuovisnosti'},
{id:'p5-54',t:'P5',q:'Metodi se predaje zastavica „promijeniPonašanje=true” kojom pozivatelj upravlja njezinim radom. Koja je to međuovisnost?',o:['Upravljačka','Podatkovna','Zajednička','Porukovna'],a:0,e:'Upravljačka međuovisnost: pozivatelj upravlja radom druge komponente. Zajednička: globalna promjenjiva varijabla. Strukturna: cijeli DTO zbog jednog polja.',s:'P05 · Klasifikacija međuovisnosti'},
{id:'p5-55',t:'P5',q:'Prosljeđivanje cijelog DTO-a metodi koja koristi samo jedno polje primjer je koje međuovisnosti?',o:['Strukturne (stamp)','Podatkovne','Sadržajne','Vanjske'],a:0,e:'Strukturna (stamp) međuovisnost znači da se prosljeđuje veća struktura nego što je potrebno. Podatkovna znači da se predaju samo potrebni podaci.',s:'P05 · Klasifikacija međuovisnosti'},
{id:'p5-56',t:'P5',q:'Dva modula dijele globalnu promjenjivu varijablu. Koja je to međuovisnost?',o:['Zajednička','Podatkovna','Upravljačka','Porukovna'],a:0,e:'Zajednička međuovisnost: zajedničko promjenjivo stanje (npr. globalna varijabla).',s:'P05 · Klasifikacija međuovisnosti'},
{id:'p5-57',t:'P5',q:'Koliko načela oblikovanja navode Lethbridge i Laganière i koje je prvo?',o:['12; podijeli pa vladaj','9; povećaj koheziju','5; jedna odgovornost','7; uklanjanje rasipanja'],a:0,e:'12 načela: podijeli pa vladaj, povećaj koheziju, smanji međuovisnost, zadrži razinu apstrakcije, povećaj ponovnu uporabivost, povećaj uporabu postojećeg, oblikuj za fleksibilnost, planiraj zastaru, prenosivost, ispitivanje, oblikuj konzervativno, oblikuj po ugovoru.',s:'P05 · Principi: Lethbridge & Laganière'},
{id:'p5-58',t:'P5',q:'Prema načelu „Povećaj uporabu postojećeg”, je li kopiranje i umetanje koda ponovna uporaba?',o:['Ne; kloniranje nije ponovna uporaba, a treba paziti i na intelektualno vlasništvo','Da, to je najbolji oblik ponovne uporabe','Da, ako se kopira iz Stack Overflowa','Ne, jer je ponovna uporaba zabranjena'],a:0,e:'Aktivna ponovna uporaba komponenti smanjuje trošak i povećava stabilnost, ali copy-paste (kloniranje) nije ponovna uporaba.',s:'P05 · Principi L&L: 4–8'},
{id:'p5-59',t:'P5',q:'Što u oblikovanju po ugovoru (design by contract) pripada odgovornosti pozivatelja?',o:['Preduvjeti','Završni uvjeti','Invarijante','Iznimke'],a:0,e:'Preduvjeti su odgovornost pozivatelja, a završni uvjeti i invarijante odgovornost pozvane metode.',s:'P05 · Principi L&L: 9–12'},
{id:'p5-60',t:'P5',q:'Načelo „Oblikuj za fleksibilnost” savjetuje:',o:['Ne umetati podatke ni konfiguraciju izravno u kod (hard code); smanjiti međuovisnost, povećati koheziju','Izbjegavati sve nove tehnologije','Pisati sav kod u jednom modulu','Provjeravati sve moguće ulaze na svakom mjestu'],a:0,e:'Oblikuj za fleksibilnost: aktivno predvidjeti promjene, stvarati apstrakcije i ne hardkodirati.',s:'P05 · Principi L&L: 4–8'},
{id:'p5-61',t:'P5',q:'Što je „dokumentacija kao kod” (Documentation as Code)?',o:['Dokumentacija (npr. Markdown) se pohranjuje uz izvorni kod u Gitu i ažurira kao dio redovnog razvoja','Komentari u kodu zamjenjuju svu dokumentaciju','Dokumentacija se automatski generira iz binarnih datoteka','Dokumentacija se piše tek nakon isporuke'],a:0,e:'Dijagrami kao kod (PlantUML, Mermaid) imaju povijest u Gitu, pregledavaju se kao kod i lakše se ažuriraju, ali i dalje moraju odgovarati stvarnom sustavu.',s:'P05 · Principi moderne arhitektonske dokumentacije; Dijagrami kao kod'},
{id:'p5-62',t:'P5',q:'Koji je cilj arhitektonske dokumentacije?',o:['Odgovoriti što sustav sadrži, kako dijelovi surađuju i zašto je rješenje odabrano','Prepisati programski kod u dijagrame','Proizvesti što više dijagrama','Zamijeniti ispitivanje'],a:0,e:'Ključni sadržaj: kontekst, važni pogledi, ASR-ovi, odluke, provjera i otvorena pitanja. Dokumentacija mora biti dosljedna implementaciji i održavati se.',s:'P05 · Uloga arhitektonske dokumentacije'},
{id:'p5-63',t:'P5',q:'Što je konektor u pogledu komponenata i konektora?',o:['Opis komunikacije i interakcije: poziv, protokol, poruka ili događaj','Fizički kabel između poslužitelja','Razred s javnim metodama','Baza podataka'],a:0,e:'Komponente su izvršne jedinice ili spremnici podataka (proces, servis, baza). Konektori opisuju komunikaciju. Port i uloga određuju mjesta i pravila interakcije.',s:'P05 · Model pogleda: komponente i konektori'},
{id:'p5-64',t:'P5',q:'Jesu li Node.js i Spring Boot arhitektonski stilovi?',o:['Ne, to su tehnologije za implementaciju','Da, to su slojeviti stilovi','Da, Node.js je mikroservisni stil','Spring Boot je MVC stil, a Node.js nije'],a:0,e:'Node.js i Spring Boot su tehnologije. Express ne nameće MVC; podjelu odgovornosti tim mora svjesno oblikovati.',s:'P05 · Struktura web-aplikacije; Slojevi u Expressu i Spring Bootu'}
);

/* P6 – Objektno usmjerena analiza i oblikovanje, dijagram razreda, GRASP, SOLID */
Q.push(
{id:'p6-01',t:'P6',q:'Koje je temeljno pitanje objektno usmjerene analize (OOA)?',o:['Koje pojmove, pravila i ponašanja problemske domene treba razumjeti?','Kako raspodijeliti odgovornosti i oblikovati rješenje?','Kako ostvariti rješenje u izvornom kodu?','Koji programski jezik odabrati?'],a:0,e:'OOA: domena i zahtjevi, a rezultat je model domene. OOD: razredi, suradnje, ugovori. OOP: izvorni kod. Aktivnosti se mogu ponavljati i preklapati.',s:'P06 · Objektno usmjerena analiza i oblikovanje'},
{id:'p6-02',t:'P6',q:'Zašto u LEGIS-u Prijava i Događaj NE bi trebali biti isti razred?',o:['Prijava je pojedinačan sljediv zapis opažanja, a Događaj stvarna pojava o kojoj može postojati više prijava','Zato što UML zabranjuje razrede sa sličnim atributima','Zato što Događaj nema atribute','Zato što su to akteri, a ne razredi'],a:0,e:'Prijava ima vlastiti kod za praćenje. Događaj je stvarna pojava (0..* prijava). Intervencija je angažman ekipe, a Ekipa izvršitelj. Pojmove ne treba spajati.',s:'P06 · LEGIS: četiri različita domenska pojma'},
{id:'p6-03',t:'P6',q:'Koja je tvrdnja o Abbottovoj tehnici točna?',o:['Imenice su kandidati za razrede, a glagoli moguće odgovornosti; potrebna je semantička provjera, nije automatizam','Svaka imenica postaje razred','Svaki glagol postaje pridruživanje','„Ima” uvijek znači agregaciju'],a:0,e:'„Imenica = razred” i „ima = agregacija” nisu normativna ni pouzdana pravila. Kandidate prihvaćamo tek uz domensko opravdanje.',s:'P06 · Strategije identifikacije OO elemenata; OO analiza'},
{id:'p6-04',t:'P6',q:'Jesu li „dispečer” i „operater” iz obrazaca uporabe automatski domenski razredi?',o:['Ne; to su uloge (akteri), a domenski razred korisnika zahtijeva zasebno opravdanje','Da, svaki akter je razred','Da, ali samo ako imaju atribute','Ne, akteri se nikada ne modeliraju'],a:0,e:'Akteri se pojavljuju u sekvencijskom dijagramu, ali nisu automatski razredi domene. Isto vrijedi za „bazu podataka” i „pisač”.',s:'P06 · LEGIS: od scenarija do kandidata za razrede'},
{id:'p6-05',t:'P6',q:'Je li MongoDB domenski entitet u modelu LEGIS-a?',o:['Ne, to je tehnologija, a ne domenski pojam','Da, jer pohranjuje prijave','Da, ako se nalazi u zahtjevima','Samo na implementacijskoj razini'],a:0,e:'Prijava i Događaj su domenski pojmovi, a baza podataka i web-stranica nisu.',s:'P06 · LEGIS: od scenarija do kandidata za razrede; Utvrđivanje razreda'},
{id:'p6-06',t:'P6',q:'Što sadrži CRC kartica?',o:['Razred, odgovornosti (što zna i radi) i suradnike','Razred, atribute s tipovima i operacije s potpisima','Aktora, obrazac uporabe i odnos','Sprint, zadatak i procjenu'],a:0,e:'CRC (Class–Responsibility–Collaborator) je interaktivna tehnika modeliranja odgovornosti i suradnje. Nije dio UML-a i nije gotov UML model.',s:'P06 · CRC: Razred, odgovornosti i suradnici'},
{id:'p6-07',t:'P6',q:'Koja je tvrdnja o CRC karticama točna?',o:['Previše odgovornosti signalizira nisku koheziju, a previše suradnika visoku međuovisnost','Linije između kartica dokazuju UML asocijacije','CRC je dio UML standarda','Na CRC karticu pišu se potpisi svih metoda'],a:0,e:'Linije između kartica samo predlažu suradnje koje tek treba provjeriti. Fokus je na koherentnim odgovornostima.',s:'P06 · Modeliranje zasnovano na odgovornostima'},
{id:'p6-08',t:'P6',q:'Koje su tri razine detalja dijagrama razreda?',o:['Konceptualna, specifikacijska i implementacijska','Logička, fizička i procesna','Kontekst, kontejneri i komponente','Analitička, testna i produkcijska'],a:0,e:'Konceptualna: što postoji u problemu. Specifikacijska: što razred nudi (tipovi, operacije, sučelja). Implementacijska: kako je ostvareno (jezik, biblioteke).',s:'P06 · Tri razine detalja dijagrama razreda'},
{id:'p6-09',t:'P6',q:'Na kojoj razini dijagrama razreda prikazujemo atribute s tipovima, operacije s parametrima i povratnim tipom te vidljivost i sučelja?',o:['Specifikacijskoj','Konceptualnoj','Implementacijskoj, isključivo','Ni na jednoj'],a:0,e:'Specifikacijska razina oblikuje ugovore za programere. Implementacijska dodaje jezične detalje (npr. ArrayList umjesto List) i pomoćne operacije.',s:'P06 · Tri razine detalja dijagrama razreda'},
{id:'p6-10',t:'P6',q:'Jesu li operacije zabranjene na konceptualnoj razini dijagrama razreda?',o:['Ne; izbor detalja ovisi o svrsi modela','Da, konceptualna razina smije imati samo nazive razreda','Da, i atributi su zabranjeni','Ne, ali moraju imati tipove parametara'],a:0,e:'Operacije i tipovi nisu zabranjeni na konceptualnoj razini, a ni implementacijska razina ne mora prikazati sve.',s:'P06 · Tri razine detalja dijagrama razreda'},
{id:'p6-11',t:'P6',q:'Kako se u UML-u označava apstraktni razred?',o:['Nazivom u kurzivu ili oznakom {abstract}','Podcrtanim nazivom','Stereotipom «entity»','Dvostrukim okvirom'],a:0,e:'Apstraktni razred i apstraktna operacija označavaju se kurzivom ili oznakom {abstract}. Podcrtano ime označava objekt, a podcrtani atribut statički član.',s:'P06 · UML razred'},
{id:'p6-12',t:'P6',q:'Koja oznaka vidljivosti u UML-u znači „protected” (dostupno unutar razreda i izvedenih razreda)?',o:['#','~','-','+'],a:0,e:'+ public, - private, # protected, ~ package.',s:'P06 · Atributi'},
{id:'p6-13',t:'P6',q:'Koja oznaka vidljivosti znači „package” (dostupno unutar istog paketa)?',o:['~','#','+','/'],a:0,e:'~ package. Kosa crta / ne označava vidljivost, nego izvedeni atribut.',s:'P06 · Atributi'},
{id:'p6-14',t:'P6',q:'Što označava atribut „/ brojPrijava: int {readOnly}”?',o:['Izvedeni atribut, čija se vrijednost određuje iz drugih podataka, i koji je samo za čitanje','Privatni atribut','Statički atribut','Atribut s paketnom vidljivošću'],a:0,e:'Kosa crta / označava izvedeni (derived) atribut. Oznaka ne propisuje način implementacije. {readOnly} je svojstvo atributa.',s:'P06 · Atributi'},
{id:'p6-15',t:'P6',q:'Koji je ispravan redoslijed elemenata u sintaksi UML atributa?',o:['[vidljivost] [/] naziv [: tip] [brojnost] [= početna vrijednost] {svojstva}','naziv : vidljivost = tip','tip naziv [vidljivost]','[brojnost] naziv : tip {vidljivost}'],a:0,e:'Npr. „- kodZaPracenje: String [0..1]” ili „- status: String = "PRIMLJENA"”.',s:'P06 · Atributi'},
{id:'p6-16',t:'P6',q:'Koja je razlika između operacije i metode?',o:['Operacija je specifikacija usluge (naziv, parametri, povratni tip); metoda je njezino ostvarenje','Metoda je specifikacija, a operacija implementacija','To su sinonimi','Operacija postoji samo u sučeljima'],a:0,e:'Odgovornost je obveza razreda da nešto zna ili učini. Operacija specificira uslugu, a metoda je ostvaruje. Dijagram razreda prikazuje specifikaciju operacija.',s:'P06 · Odgovornost, operacija, metoda'},
{id:'p6-17',t:'P6',q:'Kojem razredu treba dodijeliti novu odgovornost prema predavanju?',o:['Onome koji ima potrebne informacije; ako ga nema, razmotriti novi razred','Uvijek razredu s najviše atributa','Uvijek kontroleru','Razredu koji je prvi nacrtan'],a:0,e:'To je GRASP Information Expert. Ako razred skuplja nepovezane odgovornosti, razmotriti podjelu (SRP).',s:'P06 · Određivanje odgovornosti'},
{id:'p6-18',t:'P6',q:'Što znači brojnost „1..*” na kraju pridruživanja?',o:['Jedan ili više (neograničeno) objekata','Točno jedan objekt','Nula ili jedan objekt','Bilo koliko, uključujući nulu'],a:0,e:'1 = točno jedan (podrazumijevano), n1..n2 = između n1 i n2, n1..* = n1 ili više, 0..* ili * = bilo koliko.',s:'P06 · Svojstva pridruživanja'},
{id:'p6-19',t:'P6',q:'Ako na kraju pridruživanja nema brojnosti, što se podrazumijeva prema predavanju?',o:['1 (točno jedan)','0..*','0..1','*'],a:0,e:'Prema predavanju, 1 je podrazumijevana vrijednost brojnosti.',s:'P06 · Svojstva pridruživanja'},
{id:'p6-20',t:'P6',q:'Znači li izostanak strelice na pridruživanju nužno obostranu navigabilnost?',o:['Ne nužno','Da, uvijek','Ne, znači da navigacija nije moguća','Da, ali samo za kompoziciju'],a:0,e:'Smjer označava mogućnost pristupa povezanim objektima. Izostanak strelice ne znači nužno obostranu navigabilnost.',s:'P06 · Svojstva pridruživanja'},
{id:'p6-21',t:'P6',q:'Što je naziv uloge (role name) na kraju pridruživanja?',o:['Imenica koja opisuje ulogu objekata na tom kraju veze; preciznija je od imena asocijacije','Glagol koji opisuje značenje veze','Brojnost veze','Ime razreda na drugom kraju'],a:0,e:'Ime asocijacije je kratki glagol ili fraza (npr. „odnosi se na”). Naziv uloge je imenica na kraju linije (npr. „događaj”).',s:'P06 · Svojstva pridruživanja'},
{id:'p6-22',t:'P6',q:'Što je refleksivno pridruživanje?',o:['Pridruživanje razreda sa samim sobom, pri čemu krajevi imaju različite uloge','Pridruživanje dva sučelja','Generalizacija razreda u samog sebe','Ovisnost razreda o paketu'],a:0,e:'Koristi se za hijerarhijske i rekurzivne strukture objekata istog tipa (npr. „je dio”, „je uzrok za”).',s:'P06 · Refleksivno pridruživanje'},
{id:'p6-23',t:'P6',q:'Kada je bolje umjesto pridruženog razreda (association class) koristiti običan razred (npr. Intervencija)?',o:['Kada ponovljeni ili vremenski različiti angažmani imaju vlastiti identitet i životni ciklus','Kada veza nema nikakvih atributa','Kada su oba razreda apstraktna','Nikada, pridruženi razred je uvijek bolji'],a:0,e:'Pridruženi razred opisuje svojstva same veze. Ako ista dva objekta mogu biti povezana više puta s vlastitim identitetom, koristi se običan povezni razred.',s:'P06 · Pridruženi razredi'},
{id:'p6-24',t:'P6',q:'Koja je razlika između dijeljene agregacije i kompozicije?',o:['Kompozicija (puni romb): dio pripada najviše jednoj cjelini i ovisi o njezinu životnom vijeku. Agregacija (prazni romb) nema tako strogu semantiku.','Agregacija je puni romb, kompozicija prazni','Kompozicija dopušta da dio pripada više cjelina istodobno','Nema razlike u semantici'],a:0,e:'Kod kompozicije dio se prije uklanjanja cjeline može izdvojiti. Kod agregacije UML ne određuje strogu semantiku vlasništva ni životnog vijeka.',s:'P06 · Agregacija i kompozicija'},
{id:'p6-25',t:'P6',q:'Je li postojanje reference ili liste u Java kodu dovoljan dokaz UML agregacije?',o:['Ne; ključna je semantika odnosa cjelina–dio','Da, svaka lista je agregacija','Da, svaka referenca je kompozicija','Ne, jer Java ne podržava agregaciju'],a:0,e:'Java pokazuje jedno ostvarenje modela. Iz samih referenci ne zaključujemo UML agregaciju.',s:'P06 · Agregacija — primjer u Javi'},
{id:'p6-26',t:'P6',q:'Kada razred obično ovisi (dependency) o drugom razredu?',o:['Kada je drugi razred tip parametra, povratni tip ili lokalno stvoren objekt u metodi','Kada je drugi razred njegov nadrazred','Kada ga trajno sadrži kao atribut','Kada realizira njegovo sučelje'],a:0,e:'Ovisnost je najopćenitiji odnos: promjena isporučitelja može utjecati na klijenta. Strelica ide prema isporučitelju. Stereotipovi: «use», «call», «create», «modifies».',s:'P06 · Ovisnost'},
{id:'p6-27',t:'P6',q:'Kako se crta generalizacija u UML-u?',o:['Puna linija s velikim praznim trokutom prema nadrazredu','Isprekidana linija s praznim trokutom prema nadrazredu','Puna linija s punim rombom','Isprekidana linija s otvorenom strelicom'],a:0,e:'Generalizacija je puna linija s praznim trokutom. Realizacija sučelja je isprekidana linija s praznim trokutom. Ovisnost je isprekidana linija s otvorenom strelicom.',s:'P06 · Generalizacija; Generalizacija razreda i realizacija sučelja'},
{id:'p6-28',t:'P6',q:'Koju vezu izražava generalizacija?',o:['„JE” (IS-A): podrazred je specifičniji oblik nadrazreda','„IMA” (HAS-A)','„KORISTI” (USES)','„STVARA” (CREATES)'],a:0,e:'Objekt podrazreda ujedno je instanca nadtipa (ne nastaju dva objekta). Ponovna uporaba nije razlog za generalizaciju ako ne vrijedi odnos „je”.',s:'P06 · Generalizacija; Generalizacija i ponovna uporaba'},
{id:'p6-29',t:'P6',q:'Može li podrazred izravno pristupiti privatnim (-) članovima nadrazreda?',o:['Ne; oni postoje u podrazredu, ali im se ne može izravno pristupiti. Protected (#) to dopušta.','Da, uvijek','Da, ako je podrazred u istom paketu','Privatni članovi ne postoje u podrazredu'],a:0,e:'Privatni članovi postoje u podrazredu, ali im se ne može izravno pristupiti. Vidljivost protected omogućava pristup podrazredu.',s:'P06 · Generalizacija'},
{id:'p6-30',t:'P6',q:'Operater tijekom rada postaje Dispečer. Što predavanje preporučuje umjesto nasljeđivanja uloga?',o:['Razdvojiti uloge u različite razrede ili koristiti State/Role obrazac s delegiranjem','Višestruko nasljeđivanje','Kopirati objekt u novi razred','Ukloniti oba razreda iz modela'],a:0,e:'Neodgovarajuće nasljeđivanje uloga može narušiti zamjenjivost. Objekti trebaju delegirati ponašanje specifičnoj ulozi.',s:'P06 · Promjena uloge objekta — ograničenja nasljeđivanja'},
{id:'p6-31',t:'P6',q:'Kada je bolje koristiti sučelje umjesto nadrazreda?',o:['Kada su razredi vrlo različiti osim nekoliko zajedničkih operacija ili već imaju svoj nadrazred','Kada razredi dijele većinu atributa','Kada je potreban odnos „je”','Nikada'],a:0,e:'Sučelje se bira i kad želimo ograničiti operacije na one iz ugovora. U većini jezika razred ima jedan nadrazred, ali može realizirati više sučelja.',s:'P06 · Identificiranje generalizacija i sučelja'},
{id:'p6-32',t:'P6',q:'Što je zglobna veza (ball-and-socket)?',o:['Prikaz ponuđenog sučelja (krug) i potrebnog sučelja (utičnica)','Oznaka kompozicije','Oznaka refleksivnog pridruživanja','Oznaka višestrukog nasljeđivanja'],a:0,e:'Razred koji pruža sučelje povezan je s malim krugom, a razred koji ga zahtijeva s utičnicom. Taj prikaz nije istovjetan relaciji realizacije.',s:'P06 · Primjer: Ponuđena i potrebna sučelja'},
{id:'p6-33',t:'P6',q:'Što je nabrajanje (enumeration) u UML-u?',o:['Klasifikator s konačnim skupom imenovanih literala, oznake «enumeration»','Razred s neograničenim brojem objekata','Parametrizirani razred','Vrsta pridruživanja'],a:0,e:'Nabrajanje daje tipsku sigurnost i čitljivost (npr. status ograničen na dopuštene literale).',s:'P06 · Nabrajanje'},
{id:'p6-34',t:'P6',q:'Što je vezivanje predloška (template binding)?',o:['Dodjeljivanje vrijednosti parametrima parametriziranog razreda, čime se generira novi element modela','Povezivanje sučelja s razredom','Spajanje dva paketa','Pretvaranje agregacije u kompoziciju'],a:0,e:'Parametrizirani razred je predložak za generički tip (npr. Java Generics). Vezivanje predloška dodjeljuje stvarne vrijednosti parametrima.',s:'P06 · Parametrizirani razred'},
{id:'p6-35',t:'P6',q:'Koji GRASP obrazac kaže da odgovornost treba dodijeliti razredu koji ima potrebne informacije?',o:['Information Expert','Creator','Controller','Pure Fabrication'],a:0,e:'Information Expert: tko zna? Creator: tko stvara? Controller: tko koordinira zahtjev sustava i delegira?',s:'P06 · GRASP: načela raspodjele odgovornosti'},
{id:'p6-36',t:'P6',q:'Koliko obrazaca ima GRASP?',o:['Devet','Pet','Sedam','Dvanaest'],a:0,e:'GRASP: Information Expert, Creator, Controller, Low Coupling, High Cohesion, Polymorphism, Pure Fabrication, Indirection, Protected Variations.',s:'P06 · GRASP: načela raspodjele odgovornosti'},
{id:'p6-37',t:'P6',q:'Repozitorij preuzima pohranu umjesto domenskog razreda Prijava. Koji je to GRASP obrazac?',o:['Pure Fabrication','Information Expert','Creator','Polymorphism'],a:0,e:'Pure Fabrication: razred koji nije domenski pojam, uveden kada tehnička odgovornost ne pripada domenskom razredu.',s:'P06 · GRASP: preostala četiri obrasca'},
{id:'p6-38',t:'P6',q:'Adapter obavještavanja odvaja koordinatora od vanjskog SMS API-ja. Koji je to GRASP obrazac?',o:['Indirection','Creator','High Cohesion','Information Expert'],a:0,e:'Indirection: posrednik smanjuje izravne ovisnosti. Protected Variations: stabilno sučelje (npr. ISpremistePrijava) izolira izvor promjena.',s:'P06 · GRASP: preostala četiri obrasca'},
{id:'p6-39',t:'P6',q:'Je li GRASP Controller isto što i kontroler u obrascu MVC?',o:['Ne; GRASP Controller je razred koji prima zahtjev sustava i delegira suradnicima','Da, to je isti pojam','Da, ali samo u web-aplikacijama','GRASP nema obrazac Controller'],a:0,e:'GRASP Controller (npr. KoordinatorDodjele) koordinira zahtjev, poziva provjere suradnika i ne preuzima svu poslovnu logiku. Nije isto što i MVC kontroler.',s:'P06 · GRASP: kome dodijeliti odgovornost?'},
{id:'p6-40',t:'P6',q:'Što kaže načelo jedinstvene odgovornosti (SRP)?',o:['Razred ima koherentan skup odgovornosti i povezanih razloga za promjenu','Razred smije imati samo jednu metodu','Razred ne smije ovisiti ni o jednom drugom razredu','Podtip mora poštovati ugovor nadtipa'],a:0,e:'Koherentan razlog za promjenu ne znači samo jednu metodu. Npr. Prijava ne bi trebala sama upravljati SQL-om i slati SMS.',s:'P06 · SRP — načelo jedinstvene odgovornosti'},
{id:'p6-41',t:'P6',q:'Što kaže načelo otvorenosti/zatvorenosti (OCP)?',o:['Predviđene varijacije proširujemo uz ograničene promjene stabilnog koda','Postojeći kod se nikada ne smije mijenjati','Svi atributi moraju biti privatni','Svaki razred mora imati sučelje'],a:0,e:'OCP ne znači da se postojeći kod nikada ne smije mijenjati. Treba podržati očekivane promjene bez preuranjenih apstrakcija.',s:'P06 · OCP — načelo otvorenosti/zatvorenosti'},
{id:'p6-42',t:'P6',q:'Podrazred baca iznimku za operaciju koju klijent opravdano očekuje od nadtipa. Koje SOLID načelo je narušeno?',o:['LSP (Liskovljeva zamjena)','SRP','ISP','DIP'],a:0,e:'LSP: podtip mora očuvati ugovor nadtipa (preduvjete, završne uvjete) i mora se moći koristiti na mjestu nadtipa bez narušavanja ponašanja.',s:'P06 · LSP — načelo Liskovljeve zamjene'},
{id:'p6-43',t:'P6',q:'Preveliko sučelje nameće razredima metode koje ne koriste. Koje SOLID načelo je narušeno?',o:['ISP (razdvajanje sučelja)','OCP','LSP','SRP'],a:0,e:'ISP: klijent ne treba ovisiti o operacijama koje mu nisu potrebne. Sučelje ne treba ni mehanički dijeliti na što više manjih.',s:'P06 · ISP — načelo razdvajanja sučelja'},
{id:'p6-44',t:'P6',q:'Je li DIP (inverzija ovisnosti) isto što i injektiranje ovisnosti (DI)?',o:['Ne; DIP traži da važna logika ovisi o stabilnom ugovoru, a DI je tehnika predaje ovisnosti','Da, to su sinonimi','Da, ali samo u Springu','DIP je dio GRASP-a, a ne SOLID-a'],a:0,e:'DIP: KoordinatorDodjele ne bi trebao izravno pozivati konkretni SMS HTTP API, nego ovisiti o ugovoru obavještavanja.',s:'P06 · DIP — načelo inverzije ovisnosti'},
{id:'p6-45',t:'P6',q:'Koja je tvrdnja o SOLID načelima u skladu s predavanjem?',o:['To su smjernice za prosudbu, a ne apsolutne zabrane; svaka nova apstrakcija ima cijenu','To su strogo obvezna pravila bez iznimke','SOLID određuje arhitektonski stil i broj servisa','SOLID se primjenjuje samo na baze podataka'],a:0,e:'Primjena: prepoznati stvarni problem, objasniti posljedice, predložiti i opravdati poboljšanje uključujući cijenu apstrakcije. SOLID ne određuje stil ni razmještaj.',s:'P06 · SOLID: kriteriji stručne primjene'},
{id:'p6-46',t:'P6',q:'Je li svaka radnja iz scenarija (npr. „dispečer dodjeljuje ekipu”) strukturno pridruživanje?',o:['Ne; radnja može biti operacija, događaj ili suradnja; pridruživanje traži zasebno opravdan strukturni odnos','Da, svaki glagol je pridruživanje','Da, ako se pojavljuje u sekvencijskom dijagramu','Ne, radnje se nikad ne modeliraju'],a:0,e:'Ako „dodjela ekipe” ima vlastiti identitet, vrijeme ili pravila, razmotriti zaseban razred Intervencija.',s:'P06 · Radnja nije pridruživanje'},
{id:'p6-47',t:'P6',q:'Koji su stereotipi razreda prema ulozi u analizi navedeni na predavanju?',o:['«entity», «boundary», «control»','«include», «extend», «actor»','«use», «call», «create»','«alt», «opt», «loop»'],a:0,e:'U primjeru GRASP-a: «boundary» PrikazDispečera, «control» KoordinatorDodjele, «entity» Intervencija. «use»/«call»/«create» su stereotipi ovisnosti.',s:'P06 · UML razred; GRASP: kome dodijeliti odgovornost?'},
{id:'p6-48',t:'P6',q:'Koja je razlika između upita (query) i naredbe (command) kao operacija?',o:['Upit daje podatke bez namjerne promjene stanja; naredba može promijeniti stanje i mora čuvati invarijante','Upit mijenja stanje, a naredba ne','Obje uvijek mijenjaju stanje','Naredbe su uvijek privatne'],a:0,e:'Ne uvoditi automatski getter i setter za svaki atribut. Konstruktori osiguravaju valjano početno stanje.',s:'P06 · Od odgovornosti do operacija'},

{id:'p6-d01',t:'P6',q:'Što prikazuje ovaj dijagram razreda?',dg:{type:'cls',c:[{id:'e',n:'Ekipa',ab:1,at:['# oznaka: String'],op:['+ jeRaspoloziva(): Boolean {abstract}'],x:0.5,y:0},{id:'v',n:'VatrogasnaEkipa',at:['- brojVozila: int'],op:['+ jeRaspoloziva(): Boolean'],x:0,y:1},{id:'k',n:'KomunalnaEkipa',at:[],op:['+ jeRaspoloziva(): Boolean'],x:1,y:1}],r:[{f:'v',t:'e',k:'ge'},{f:'k',t:'e',k:'ge'}],cw:250,w:520},o:['Apstraktni razred Ekipa s dva podrazreda koji redefiniraju apstraktnu operaciju jeRaspoloziva()','Sučelje Ekipa koje realiziraju dva razreda','Kompoziciju: Ekipa se sastoji od dvije vrste ekipa','Dva razreda ovise o razredu Ekipa'],a:0,e:'Kurziv u nazivu i operaciji označava apstraktni razred i apstraktnu operaciju. Puna linija s praznim trokutom je generalizacija. Podrazredi redefiniraju (override) jeRaspoloziva() (polimorfizam).',s:'P06 · Generalizacija – primjer; Generalizacija i ponovna uporaba'},

{id:'p6-d03',t:'P6',q:'Koji je odnos prikazan između Prijava i Fotografija?',dg:{type:'cls',c:[{id:'p',n:'Prijava',noComp:1,x:0,y:0},{id:'f',n:'Fotografija',noComp:1,x:1,y:0}],r:[{f:'f',t:'p',k:'co',m1:'0..*',m2:'1'}],cw:260},o:['Kompozicija: fotografija pripada jednoj prijavi i ovisi o njezinu životnom vijeku','Dijeljena agregacija: fotografija može postojati bez prijave','Generalizacija: Fotografija je vrsta Prijave','Ovisnost: Prijava koristi Fotografiju kao parametar'],a:0,e:'Puni romb na strani cjeline (Prijava) označava kompoziciju. Dio pripada najviše jednoj cjelini u danom trenutku i ovisi o njezinu životnom vijeku.',s:'P06 · Odnosi među razredima; Agregacija i kompozicija'},
{id:'p6-d04',t:'P6',q:'Koji je odnos prikazan između Ekipa i Sposobnost?',dg:{type:'cls',c:[{id:'e',n:'Ekipa',noComp:1,x:0,y:0},{id:'s',n:'Sposobnost',noComp:1,x:1,y:0}],r:[{f:'s',t:'e',k:'ag',m1:'0..*'}],cw:260},o:['Dijeljena agregacija: ekipa ima sposobnosti, a sposobnost može postojati i bez te ekipe','Kompozicija: sposobnost se briše s ekipom','Realizacija sučelja','Refleksivno pridruživanje'],a:0,e:'Prazni romb uz cjelinu (Ekipa) označava dijeljenu agregaciju. UML joj ne određuje strogu semantiku vlasništva ni životnog vijeka.',s:'P06 · Odnosi među razredima; Agregacija — primjer u Javi'},
{id:'p6-d05',t:'P6',q:'Što prikazuje isprekidana linija s praznim trokutom?',dg:{type:'cls',c:[{id:'i',n:'IObavjestavanje',st:'«interface»',at:[],op:['+ posalji(poruka: Poruka): void'],noComp:0,x:0.5,y:0},{id:'s',n:'SmsAdapter',noComp:1,x:0,y:1},{id:'f',n:'FcmAdapter',noComp:1,x:1,y:1}],r:[{f:'s',t:'i',k:'re'},{f:'f',t:'i',k:'re'}],cw:250,w:520},o:['Realizaciju sučelja: oba adaptera ostvaruju ugovor IObavjestavanje','Generalizaciju: adapteri nasljeđuju razred IObavjestavanje','Ovisnost: adapteri koriste sučelje kao parametar','Kompoziciju adaptera u sučelje'],a:0,e:'Realizacija sučelja crta se isprekidanom linijom s praznim trokutom prema sučelju. Više razreda može realizirati isto sučelje, što omogućuje polimorfizam i zamjenjivost.',s:'P06 · Generalizacija razreda i realizacija sučelja; Sučelje'},
{id:'p6-d06',t:'P6',q:'Zašto je KoordinatorDodjele povezan s razredom Ekipa isprekidanom strelicom?',dg:{type:'cls',c:[{id:'k',n:'KoordinatorDodjele',at:['+ oznaka: String'],op:['+ dodijeli(d: Događaj, e: Ekipa): Intervencija'],x:0,y:0},{id:'e',n:'Ekipa',at:['+ oznaka: String','- status: String'],op:['+ postaviStatus(status: String): void'],x:1,y:0}],r:[{f:'k',t:'e',k:'de',l:'«use»'}],cw:330,w:680},o:['Ovisnost: Ekipa se pojavljuje kao tip parametra operacije dodijeli()','Kompozicija: koordinator sadrži ekipe','Generalizacija: Ekipa je vrsta koordinatora','Realizacija: koordinator ostvaruje sučelje Ekipa'],a:0,e:'Ovisnost (isprekidana linija s otvorenom strelicom prema isporučitelju) nastaje kad je razred tip parametra, povratni tip ili lokalno stvoren. Ne podrazumijeva trajnu strukturnu vezu.',s:'P06 · Ovisnost — UML i tekstualni prikaz'},
{id:'p6-d07',t:'P6',q:'Koji je problem ovog modela s gledišta SOLID-a?',dg:{type:'cls',c:[{id:'p',n:'Prijava',at:['- kod: String','- opis: String'],op:['+ potvrdi(): void','+ spremiUBazu(sql: String): void','+ posaljiSms(broj: String): void','+ generirajHtml(): String'],x:0,y:0}],cw:320,w:340},o:['Narušava SRP: miješa domensko stanje s pohranom, slanjem SMS-a i prikazom','Narušava LSP jer nema nadrazred','Narušava ISP jer nema sučelje','Model je ispravan'],a:0,e:'Razred ima previše razloga za promjenu (SQL shema, SMS pružatelj, HTML). Rješenje je da Prijava zadrži domensko stanje, a pohrana i obavijesti se izdvoje iza sučelja (repozitorij, IObavještavanje).',s:'P06 · SRP — loše oblikovanje'},
{id:'p6-d08',t:'P6',q:'Što prikazuje razred Angažman povezan isprekidanom linijom s pridruživanjem Događaj–Ekipa?',dg:{type:'cls',c:[{id:'d',n:'Događaj',noComp:1,x:0,y:0},{id:'e',n:'Ekipa',noComp:1,x:1,y:0},{id:'a',n:'Angažman',at:['- status: Status','- vrijeme: DateTime'],op:[],x:0.5,y:1}],r:[{f:'d',t:'e',k:'as',m1:'0..*',m2:'1..*'},{f:'a',k:'acl',mid:['d','e']}],cw:260,w:540},o:['Pridruženi razred (association class) koji opisuje svojstva veze Događaj–Ekipa','Nadrazred razreda Događaj i Ekipa','Kompoziciju Događaja i Ekipe','Sučelje koje ostvaruju Događaj i Ekipa'],a:0,e:'Pridruženi razred omogućuje da samo pridruživanje ima vlastita svojstva (status, vrijeme). Ako angažmani imaju vlastiti identitet i životni ciklus, bolji je običan razred Intervencija.',s:'P06 · Pridruženi razredi'},
{id:'p6-d09',t:'P6',q:'Koja je vidljivost atributa „kodZaPracenje” i što znači [0..1]?',dg:{type:'cls',c:[{id:'p',n:'Prijava',at:['- vrsta: VrstaDogadaja','- lokacija: Lokacija','- opis: String','- kodZaPracenje: String [0..1]','# vrijemePrijema: DatumVrijeme'],op:['+ potvrdi(): Potvrda'],x:0,y:0}],cw:300,w:320},o:['Privatna; atribut može imati nijednu ili jednu vrijednost (kod nastaje tek nakon prihvata)','Javna; atribut je polje s točno jednim elementom','Zaštićena; atribut je obavezan','Paketna; atribut je izveden'],a:0,e:'„-” znači private. Brojnost [0..1] znači da vrijednost može izostati, jer kod za praćenje dobiva tek uspješno prihvaćena prijava. „#” uz vrijemePrijema znači protected.',s:'P06 · Atributi; LEGIS: specifikacijski dijagram razreda'},
{id:'p6-d10',t:'P6',q:'Koji GRASP obrazac ilustrira sučelje ISpremistePrijava između koordinatora i konkretne pohrane?',dg:{type:'cls',c:[{id:'k',n:'KoordinatorPrijava',at:[],op:['+ podnesi(podaci: PodaciPrijave): RezultatPrijave'],x:0,y:0},{id:'i',n:'ISpremistePrijava',st:'«interface»',at:[],op:['+ spremi(p: Prijava): RezultatPohrane'],x:1,y:0},{id:'r',n:'MongoSpremistePrijava',noComp:1,x:1,y:1}],r:[{f:'k',t:'i',k:'de',l:'koristi'},{f:'r',t:'i',k:'re'}],cw:330,w:680},o:['Protected Variations: stabilno sučelje izolira koordinatora od promjena tehnologije pohrane','Creator','Information Expert','High Cohesion bez sučelja'],a:0,e:'Protected Variations izolira očekivani izvor promjena stabilnim sučeljem. To je i primjer DIP-a: koordinator ovisi o ugovoru, a ne o konkretnoj bazi.',s:'P06 · GRASP: preostala četiri obrasca; LEGIS: specifikacijski dijagram razreda'},
{id:'p6-d11',t:'P6',q:'Kako se zove prikazana veza razreda Događaj sa samim sobom?',dg:{type:'cls',c:[{id:'d',n:'Događaj',at:['- opis: String'],op:[],x:0,y:0}],r:[{f:'d',t:'d',k:'as',l:'je uzrok za',r1:'uzrok',r2:'posljedica'}],cw:240,w:400},o:['Refleksivno pridruživanje: razred je povezan sam sa sobom, a krajevi imaju različite uloge','Generalizacija razreda u samog sebe','Kompozicija','Rekurzivna ovisnost «call»'],a:0,e:'Refleksivno pridruživanje služi za hijerarhijske i rekurzivne strukture objekata istog tipa. Uloge na krajevima (uzrok, posljedica) razlikuju strane iste veze.',s:'P06 · Refleksivno pridruživanje'},
{id:'p6-d12',t:'P6',q:'Koji je odnos ispravno nacrtan za tvrdnju „VatrogasnaEkipa JE Ekipa”?',dg:{type:'cls',c:[{id:'e',n:'Ekipa',noComp:1,x:0,y:0},{id:'v',n:'VatrogasnaEkipa',noComp:1,x:1,y:0}],r:[{f:'v',t:'e',k:'ge'}],cw:260},o:['Generalizacija (puna linija, prazan trokut prema nadrazredu Ekipa)','Agregacija','Ovisnost','Realizacija sučelja'],a:0,e:'Odnos „je” (IS-A) modelira se generalizacijom. Strelica ide od podrazreda prema nadrazredu.',s:'P06 · Odnosi među razredima; Generalizacija'},
{id:'p6-d13',t:'P6',q:'Koja je pogreška u ovom modelu?',dg:{type:'cls',c:[{id:'g',n:'Građanin',noComp:1,x:0,y:0},{id:'b',n:'BazaPodataka',noComp:1,x:1,y:0},{id:'p',n:'Prijava',at:['- opis: String'],op:[],x:0.5,y:1}],r:[{f:'p',t:'g',k:'as',m1:'0..*',m2:'1'},{f:'p',t:'b',k:'co',m1:'0..*',m2:'1'}],cw:260,w:540},o:['BazaPodataka nije domenski pojam pa ne pripada konceptualnom modelu domene; Građanin je uloga koja traži opravdanje','Prijava mora biti apstraktna','Nedostaje generalizacija Građanin → Prijava','Kompozicija se ne smije crtati prema dolje'],a:0,e:'Baza podataka je tehnologija ili infrastruktura, a ne domenski entitet. Akteri iz obrazaca uporabe nisu automatski domenski razredi.',s:'P06 · Utvrđivanje razreda; LEGIS: od scenarija do kandidata za razrede'},
{id:'p6-d14',t:'P6',q:'Na kojoj je razini detalja ovaj dijagram razreda?',dg:{type:'cls',c:[{id:'p',n:'Prijava',at:['kod','lokacija','opis'],op:[],x:0,y:0},{id:'d',n:'Događaj',at:['status'],op:[],x:1,y:0}],r:[{f:'p',t:'d',k:'as',m1:'0..*',m2:'0..1'}],cw:260},o:['Konceptualnoj: ključni pojmovi, veze i brojnosti, atributi bez tipova','Specifikacijskoj: s tipovima i potpisima operacija','Implementacijskoj: s jezičnim detaljima','To nije dijagram razreda'],a:0,e:'Konceptualna razina prikazuje ključne pojmove i veze, brojnosti i uloge, a atribute bez tipova. Služi za razumijevanje domene i razgovor s dionicima.',s:'P06 · Tri razine detalja dijagrama razreda'}

const UC_CHECK = ['Sustav je prikazan granicom (pravokutnikom) s nazivom.', 'Aktori su izvan granice; vanjski sustavi su sekundarni aktori.', 'Nazivi obrazaca uporabe su glagolske fraze koje opisuju cilj aktora.', '«include» (obavezno) ide od osnovnog prema uključenom obrascu.', '«extend» (uvjetno/opcionalno) ide od proširujućeg prema osnovnom obrascu.', 'Generalizacija aktora: puna linija s praznim trokutom prema općenitijem aktoru.'];

{id:'t-legis',title:'LEGIS – prijava izvanrednih događaja',short:'Nastavni primjer s predavanja: prijave, događaji, dodjela ekipa i obavijesti.',
text:`Grad Legen želi razviti sustav **LEGIS** za prijavu izvanrednih događaja i koordinaciju intervencija.

**Građanin** prijavljuje događaj putem mobilne web-stranice: unosi vrstu događaja, lokaciju, opis i neobveznu fotografiju. Sustav provjerava lokaciju pomoću vanjske **usluge karata**. Uspješno prihvaćena prijava dobiva jedinstveni kod za praćenje, kojim građanin kasnije može pratiti status prijave. **Operater** može unijeti prijavu zaprimljenu telefonom.

**Dispečer** pregledava pristigle prijave i povezuje prijave koje se odnose na isti događaj. Dispečer određuje razinu hitnosti događaja (niska, srednja, visoka) i dodjeljuje mu jednu ili više ekipa. Pri dodjeli sustav provjerava je li ekipa raspoloživa. Za događaj visoke hitnosti barem jedna ekipa mora biti dodijeljena u roku od 3 minute od potvrde razine hitnosti.

**Ekipa** na terenu mijenja status svoje intervencije. **Voditelj stožera** šalje obavijest stanovništvu za odabrano područje; obavijesti se šalju putem vanjske **SMS usluge**. Osobni podaci prijavitelja dostupni su samo ovlaštenim ulogama.`,
ask:['Izlučite funkcijske i nefunkcijske zahtjeve te pravila domene.','Nacrtajte UML dijagram obrazaca uporabe.','Nacrtajte sekvencijski dijagram za dodjelu ekipe događaju (uključite slučaj kada ekipa nije raspoloživa).','Nacrtajte dijagram razreda domene na specifikacijskoj razini.'],
parts:[

sol:`<table class="t"><tr><th>ID</th><th>Zahtjev</th></tr>

<tr><td>FR-02</td><td>Sustav mora svakoj prihvaćenoj prijavi dodijeliti jedinstveni kod za praćenje.</td></tr>
<tr><td>FR-03</td><td>Sustav mora građaninu omogućiti praćenje statusa prijave pomoću koda.</td></tr>
<tr><td>FR-04</td><td>Sustav mora operateru omogućiti unos telefonske prijave.</td></tr>
<tr><td>FR-05</td><td>Sustav mora dispečeru omogućiti povezivanje prijava koje se odnose na isti događaj.</td></tr>
<tr><td>FR-06</td><td>Sustav mora dispečeru omogućiti određivanje razine hitnosti događaja.</td></tr>

<tr><td>FR-09</td><td>Sustav mora voditelju stožera omogućiti slanje obavijesti za odabrano područje.</td></tr>
<tr><td>NFR-01</td><td>Za događaj visoke hitnosti barem jedna ekipa mora biti dodijeljena u roku od 3 minute od potvrde razine hitnosti (provjera: razlika vremenskih žigova ≤ 3 min u ispitnom scenariju).</td></tr>

/* ================= RENT-A-CAR ================= */
{id:'t-rent',title:'Rent-a-car tvrtka',short:'Prema zadatku 10.4 iz priručnika: rezervacije, izdavanje i povrat vozila.',
text:`Potrebno je oblikovati web-aplikaciju koja služi kao podrška radu rent-a-car tvrtke.

**Korisnici** koji iznajmljuju automobile mogu putem interneta napraviti ili otkazati rezervaciju vozila. Pri stvaranju rezervacije korisnici mogu rezervirati i dodatke: GPS uređaj, dječju sjedalicu, krovne nosače za bicikle ili skije i prikolicu.

Kada korisnik dođe u poslovnicu u kojoj treba preuzeti vozilo, **zaposlenik** u aplikaciji provjerava postoji li rezervacija za tog korisnika. Ako rezervacija ne postoji, zaposlenik je izrađuje. Nakon što je rezervacija napravljena (ili je postojala od prije), može se pristupiti izdavanju vozila.

Pri izdavanju vozila zaposlenik ispisuje obrazac o preuzimanju vozila, koji korisnik potpisuje. Za ispis se aplikacija povezuje s **upravljačkim programom za ispis**. Potpisani obrazac skenira se i unosi u računalo, za što se aplikacija povezuje s **upravljačkim programom za skeniranje**.

Pri povratku automobila zaposlenik izdaje račun, što uključuje naplatu terećenjem kreditne kartice korisnika, koja se provodi spajanjem na **bankovni poslužitelj**.`,

/* ================= E-TRGOVINA ================= */
{id:'t-shop',title:'E-trgovina',short:'Prema zadatku 10.5 iz priručnika: košarica, narudžba i plaćanje.',
text:`Potrebno je oblikovati sustav e-trgovine.

U e-trgovini mogu kupovati **registrirani i neregistrirani korisnici**. Svi korisnici mogu pregledati proizvode u ponudi i dodati ih u košaricu. Za dodavanje proizvoda u košaricu korisnik mora zadati količinu. Korisnik u svakom trenutku može pregledati sadržaj košarice i ukupni iznos te ima opciju uklanjanja proizvoda iz košarice ili promjene njegove količine.

Kada završi s dodavanjem proizvoda, korisnik može napraviti narudžbu, što uključuje i proces naplate. Platiti se može bankovnom karticom ili u gotovini (pouzećem). Pri plaćanju karticom korisnik mora unijeti podatke o kartici, a nakon potvrde narudžbe plaćanje se provodi transakcijom putem **vanjskog servisa za plaćanje**.

Završene narudžbe registriranih korisnika pohranjuju se i mogu se ponoviti u budućnosti. Neregistrirani korisnici mogu se registrirati.`,

{h:'1. Izlučivanje zahtjeva',hint:'Što mogu svi korisnici, a što samo registrirani?',
sol:`<table class="t"><tr><th>ID</th><th>Zahtjev</th></tr>
<tr><td>FR-01</td><td>Sustav mora svim korisnicima omogućiti pregled proizvoda u ponudi.</td></tr>

<tr><td>FR-04</td><td>Sustav mora korisniku omogućiti uklanjanje proizvoda iz košarice.</td></tr>

/* ================= PAMETNA KUĆA ================= */
{id:'t-home',title:'Pametna kuća',short:'Prema zadatku 10.7 iz priručnika: lokacije, povezivanje i upravljanje uređajima.',
text:`Mobilna aplikacija **„Pametna kuća”** omogućuje korisnicima upravljanje na daljinu pametnim uređajima u vlastitom domu.

Pri registraciji **korisnik** mora odmah unijeti barem jednu lokaciju na kojoj će biti pametni uređaji. Lokacija se može zadati korištenjem GPS-a ili ručno. Korisnik naknadno može dodati još lokacija te urediti ili obrisati postojeće.

Nakon uspješne registracije i prijave korisnik može povezati pametne uređaje. Za povezivanje korisnik odabire lokaciju te unosi jedinstveni kod (koji dobiva kupnjom uređaja). Aplikacija šalje taj kod vanjskoj usluzi za registraciju pametnih uređaja **SmartDeviceRegService**, od koje dobiva podatke za spajanje na uređaj, te se zatim spaja na pametni uređaj. Pri povezivanju korisnik može unijeti novu lokaciju ako ne želi koristiti nijednu postojeću.

Aplikacija razlikuje dvije vrste pametnih uređaja: **mjerače** i **kućanske aparate**. Kućanskim aparatima moguće je upravljati na daljinu, a za mjerače je moguće pregledati potrošnju energije. Korisnik može obrisati povezane uređaje. Sve podatke o korisniku, lokacijama i uređajima aplikacija pohranjuje na poslužitelju **BackendServer**.`,

text:`Gosti hotela mogu putem interneta pretražiti hotelsku ponudu i napraviti rezervaciju sobe. Prilikom rezervacije sobe gosti mogu opcionalno rezervirati parkirno mjesto te dokupiti neke od sljedećih opcija: doručak, polupansion ili puni pansion. **Recepcionar** hotela može izdati sobu i napraviti naplatu. Kod izdavanja sobe recepcionar obavezno provjerava rezervaciju i programira ključ (karticu) za otvaranje sobe. Prilikom naplate recepcionar izdaje račun. **Administrator** sustava upravlja raspoloživim sobama, unosi parkirna mjesta te uređuje cjenik hotela. Upravljanje raspoloživim sobama podrazumijeva dodavanje novih soba, brisanje postojećih te unos podataka o sobi (broj ležaja, dodatni sadržaj itd.).

**Upravljanje sobama (2.1):** sekvenca počinje tako što administrator odabere opciju upravljanja sobama, na što mu sustav za upravljanje hotelom prikazuje sučelje za upravljanje. Administrator tada izvodi jednu od sljedećih aktivnosti: dodavanje nove sobe, uređivanje ili brisanje postojeće sobe. Za uređivanje ili brisanje administrator treba najprije zatražiti pregled svih postojećih soba.

**Rezervacija sobe (2.2):** postupak započinje tako što gost pretražuje ponudu hotela postavljanjem upita za vremenski period u kojem želi rezervaciju i broj osoba. Sustav mu zatim ispisuje jednu ili više ponuda. Postupak se ponavlja sve dok gost ne pronađe odgovarajuću ponudu. Nakon toga gost odabire opciju rezervacije sobe, a sustav mu prikazuje ponudu dodatnih mogućnosti: rezervacija parkirnog mjesta i dokup opcija. Ako želi, gost može odabrati rezervaciju parkirnog mjesta. Također, ako želi, može dokupiti jednu od opcija: doručak, polupansion ili puni pansion. Konačno, gost potvrđuje rezervaciju i sustav ju pohranjuje.`,

/* ================= AUTOBUSNE KARTE ================= */
{id:'z-bus',title:'Prodaja autobusnih karata',short:ZB+', zadaci 1.2 i 2.3: generalizacija obrazaca i plaćanje gotovinom ili karticom.',
text:`Aplikaciju za prodaju karata na autobusnom kolodvoru koriste **blagajnici** i **putnici**. Blagajnik može na blagajni rezervirati mjesto ili prodati kartu putniku. Prodaja karte uključuje odabir relacije i naplatu. Naplata se može izvršiti u gotovini ili putem kartice. U slučaju da se naplata vrši putem kartice, u naplati sudjeluje putnik utipkavanjem PIN-a. Opcionalno kod prodaje karte blagajnik može izdati račun R1 ako putnik to zatraži. Osim na blagajni, rezervaciju mjesta može napraviti i putnik samostalno preko **telefonskog automata**.

**Prodaja karte (2.3):** blagajnik najprije unosi u aplikaciju podatke o relaciji i broju putnika za koje će prodati kartu. Aplikacija zatim ispisuje cijenu. Potrebno je modelirati oba načina plaćanja, gotovinom i karticom, kao i mogućnost izdavanja računa R1. Kod gotovinskog plaćanja putnik predaje novčanice blagajniku, a on potvrđuje u aplikaciji da je karta plaćena, aplikacija pohranjuje podatke te ispisuje kartu i račun. Kod kartičnog plaćanja blagajnik pokreće u aplikaciji naredbu naplate karticom, a putnik zatim provlači karticu i unosi PIN. Za provedbu naplate aplikacija se spaja na **bankovni poslužitelj**. Nakon uspješnog završetka transakcije aplikacija pohranjuje podatke i ispisuju se karta i račun. Pretpostavite da putnik uvijek unosi točan PIN i da transakcija uvijek uspijeva. Zanemarite mogućnost da putnik odustaje od kupnje zbog neprihvatljive cijene.`,

/* ================= GROZD ================= */
{id:'z-grozd',title:'Grozd računala',short:ZB+', zadatak 1.3: generalizacija aktora i obrazaca (CRUD kao specijalizacija „Upravljanja”).',
text:`Modelirajte pomoću dijagrama obrazaca uporabe načine korištenja grozda računala akademske zajednice.

**Korisnici** grozda su članovi akademske zajednice. Korisnici na grozdu mogu dodavati nove poslove za obradu, brisati postojeće poslove te mijenjati parametre postojećih poslova. Izmjena parametara postojećih poslova uključuje brisanje postojećeg posla i stvaranje novog posla. Također korisnici mogu slati podatke na grozd računala, kopirati podatke i učitavati podatke s grozda računala.

**Administratori** grozda zaduženi su za dodavanje novih korisnika, promjenu podataka korisnika, brisanje postojećih korisnika te za konfiguraciju sustava. Konfiguracija sustava podrazumijeva podešavanje postavki raspoređivača poslova i izradu sigurnosne kopije podataka. Izrada sigurnosne kopije podataka je posebna vrsta kopiranja podataka. Administratori također mogu upravljati poslovima i podacima na grozdu.`,
ask:['Nacrtajte dijagram obrazaca uporabe.'],

{h:'1. Dijagram obrazaca uporabe',hint:'„Administratori također mogu upravljati poslovima i podacima” znači da administrator nasljeđuje korisnika (generalizacija aktora). „Posebna vrsta kopiranja” je generalizacija obrazaca. „Uključuje” je «include».',

/* ================= RENT-A-CAR (zbirka) ================= */
{id:'z-rent',title:'Rent-a-car kompanija (zbirka)',short:ZB+', zadaci 1.4 i 2.4: provjera rezervacije, ispis i skeniranje obrasca.',
text:`Potrebno je izraditi dijagram obrazaca uporabe sustava koji služi kao podrška radu rent-a-car kompanije, a u žarištu sustava je kontrola flote rent-a-car vozila i rad s kupcima.

**Korisnici** koji iznajmljuju automobile mogu preko interneta napraviti i otkazati rezervaciju vozila. Kod stvaranja rezervacije korisnici moraju unijeti broj kreditne kartice. Korisnici mogu napraviti rezervaciju vozila samo u slučaju da u sustavu za zatraženi vremenski period postoje slobodna vozila. Kod stvaranja rezervacije korisnici mogu prema želji i raspoloživim resursima napraviti i rezervaciju za dodatak: GPS uređaj, dječju sjedalicu, krovne nosače za bicikle ili skije i prikolicu.

Kada korisnici dođu u poslovnicu u kojoj trebaju preuzeti vozilo, **zaposlenik** provjerava postoji li rezervacija vozila za određenog korisnika. Ako rezervacija ne postoji, zaposlenik izrađuje rezervaciju za korisnika. Nakon što je rezervacija napravljena (ili je postojala od ranije), može se pristupiti izdavanju vozila. Pri izdavanju vozila zaposlenik ispisuje obrazac o preuzimanju vozila koji korisnik potpisuje. Potpisani obrazac se skenira i unosi u računalo. Nakon toga zaposlenik odvodi klijenta do automobila i predaje mu ključeve, prometnu dozvolu i obrazac. Kod povratka automobila korisnik predaje obrazac, prometnu dozvolu i ključeve. Zaposlenik provjerava stanje automobila i preostalu količinu goriva, a nakon povratka u poslovnicu generira račun i provodi terećenje kreditne kartice korisnika. Sustav također treba omogućiti zaposleniku nabavku i rashodovanje vozila te praćenje njihova korištenja kroz vrijeme.

**Provjera rezervacije i izdavanje vozila (2.4):** zaposlenik najprije provjerava rezervaciju i, ako rezervacija ne postoji, stvara novu. Za stvaranje rezervacije najprije unosi vremenski period, na što mu sustav prikazuje popis dostupnih automobila. Zaposlenik odabire automobil i unosi korisnikove podatke te se rezervacija pohranjuje. U ovom koraku moguće je opcionalno rezervirati dodatke ako to klijent želi. Nakon toga zaposlenik daje sustavu naredbu za ispis obrasca za preuzimanje, a sustav šalje obrazac **upravljačkom programu za pisač**. Nakon što je obrazac ispisan i potpisan, zaposlenik daje naredbu za skeniranje obrasca, a sustav se spaja s **upravljačkim programom za skener**, dohvaća sken obrasca i pohranjuje ga lokalno. Upravljački programi za pisač i skener dio su operacijskog sustava računala, tj. nisu dio programskog sustava rent-a-car.`,

/* ================= PORTAL ZA OGLAŠAVANJE ================= */
{id:'z-portal',title:'Portal za oglašavanje',short:ZB+', zadaci 1.5, 2.5 i 3.5: sva tri dijagrama za isti sustav.',
text:`Oglašavati se mogu pokretnine, nekretnine i usluge. Oglasi su podijeljeni u kategorije: Nekretnine, Auto-moto, Roba i Usluge. Svaki oglas sadržava naslov, opis, cijenu usluge, naziv oglašivača i kontakt te može sadržavati slike i kratke video materijale, dok ostali podaci mogu varirati od kategorije do kategorije, npr. za nekretnine treba navesti površinu. Svi oglasi su dostupni javno bez potrebe za registracijom. Oglasi u pojedinim kategorijama sortiraju se prema datumu objave. Portal ima i tražilicu koja mora omogućiti pretraživanje oglasa minimalno prema kategoriji oglasa i riječima iz naslova. Prilikom pregledavanja oglasa treba omogućiti opciju pregleda svih oglasa nekog oglašivača.

Kako bi objavili svoj oglas, potencijalni oglašivači se moraju registrirati na portalu koristeći online formu. Registrirati se mogu sve pravne i punoljetne fizičke osobe. Potrebni podaci za fizičku osobu su: OIB, ime, prezime, adresa, e-mail i kontakt telefon. Poslovni subjekt također mora navesti svoj OIB te još naziv tvrtke, sjedište tvrtke te e-mail i kontakt telefon. Registracija je besplatna, no moguće je plaćati mjesečnu članarinu za dodatne usluge poput bolje pozicije oglasa. Predviđene su tri kategorije članarine: Standard, Optimum i Premium. Oglašavanje u svim kategorijama osim Auto-moto i Nekretnine je besplatno. Za oglašavanje u tim kategorijama korisnik mora mjesečno plaćati barem članarinu Standard. Uplata članarine obavlja se putem aplikacije, a za provedbu transakcije aplikacija se spaja na **vanjski servis za plaćanje**. Uplatu korisnik može obaviti na svom profilu ili prilikom objave oglasa ako se oglašava u kategoriji za koju je nužno imati plaćenu članarinu.

Registrirani korisnici i **administratori** mogu se prijaviti u sustav pomoću korisničkog imena i lozinke. Korisnici imaju pravo upravljati svojim profilom, što podrazumijeva uređivanje i brisanje profila. Također imaju pravo upravljati svojim oglasima: objavljivati nove oglase te uređivati i brisati postojeće. Administratori mogu pregledati sve korisnike i pritom ukloniti korisnika te ukloniti oglas.

**Objava oglasa za koji je nužna članarina (2.5):** oglašivač odabere opciju stvaranja novog oglasa i prikaže mu se forma za unos. Oglašivač popunjava podatke, a sustav provjerava jesu li uneseni svi nužni podaci; dok nisu, sustav ga vraća na formu. Kad su podaci potpuni i korisnik odabere objavu, sustav provjerava status članstva. Ako oglašivač ima uplaćenu članarinu, oglas se pohranjuje. Inače se prikazuje forma za plaćanje. Oglašivač tada može odustati i poništiti oglas ili unijeti podatke za plaćanje. Ako su uneseni podaci za plaćanje, naplata se provodi preko vanjskog servisa za naplatu i zatim se oglas pohranjuje. Transakcija naplate ne bi trebala trajati više od 20 sekundi, a sveukupno od unosa podataka za plaćanje do potvrde o pohrani oglasa ne bi trebalo proći više od 30 sekundi. Pretpostavite da je transakcija uvijek uspješna.`,

/* ================= WEB TRGOVINA ================= */
{id:'z-web',title:'Web trgovina (zbirka)',short:ZB+', zadatak 3.1: košarica, stavke, narudžba, apstraktno plaćanje i enumeracija statusa.',
text:`Modelirajte pomoću dijagrama razreda sustav narudžbe i plaćanja u web trgovini zadan sljedećim opisom.

U web trgovini mogu kupovati registrirani i neregistrirani korisnici. Korisnici najprije ubacuju željene artikle u košaricu tako što odabiru artikl i količinu, čime u košarici nastaje stavka. Za svaki artikl naveden je naziv, opis i cijena po jediničnoj količini. Moguće je ubačeni artikl izbaciti ili mu promijeniti količinu. U svakom trenutku moguće je vidjeti ukupnu cijenu svih artikala u košarici. Kada je korisnik gotov s ubacivanjem artikala, stvara narudžbu. Pri izradi narudžbe izračunava se ukupan iznos za plaćanje te zapisuje datum i vrijeme, adresa isporuke, kontakt telefon i adresa e-pošte. Prilikom stvaranja narudžbe odabire se način plaćanja: bankovnom karticom ili gotovinom (pouzećem). Kod plaćanja karticom potrebno je upisati podatke o kartici, a plaćanje se nakon potvrde narudžbe izvršava putem vanjskog servisa za plaćanje.

Za narudžbu se prati status, koji može biti: „u tijeku” (prije potvrde narudžbe), „poslana” (nakon potvrde do isporuke) i „isporučena” (nakon uspješne isporuke). Za registrirane korisnike u sustavu već postoje podaci o kontakt telefonu, adresi e-pošte i adresi isporuke, te ih je prilikom stvaranja narudžbe potrebno unaprijed dohvatiti i ostaviti korisniku mogućnost da ih ispravi. Za registrirane korisnike pamte se sve ostvarene narudžbe i oni ih po želji mogu ponoviti. Narudžba se prije potvrde može i izbrisati, tj. korisnik može odustati od narudžbe, ali artikli i dalje ostaju u košarici.`,

/* ================= SERVIS ================= */
{id:'z-servis',title:'Tvrtka za popravak informatičke opreme',short:ZB+', zadatak 3.2: radni nalozi, kompozicija, refleksivna veza i ovisnost.',
text:`Modelirajte pomoću dijagrama razreda aplikaciju koja tvrtki za popravak informatičke opreme pomaže u praćenju popravaka.

U tvrtki je zaposleno više servisera i jedan voditelj. Oni su djelatnici tvrtke čiji se podaci brišu njezinim zatvaranjem. Za svakog djelatnika zapisani su ime, prezime i OIB. Voditelj otvara radne naloge, a na svakom radnom nalogu radi najmanje jedan serviser. Nakon otvaranja radnog naloga voditelj inicijalno procjenjuje trajanje radnog naloga i upisuje taj podatak u radni nalog. Jednom radnom nalogu pridružena je jedna stranka u čije ime je radni nalog otvoren. Za svaku stranku evidentira se ime, prezime i broj telefona.

Jedan radni nalog može se sastojati od jednog ili više dodatnih radnih naloga, ovisno o složenosti popravaka. Status radnog naloga može biti: „zaprimljen”, „u obradi”, „završen – uspješno” i „završen – neuspješno”. Svaki radni nalog sadržava barem jednu servisnu akciju. Za svaku servisnu akciju evidentira se broj utrošenih čovjek-sati i cijena čovjek-sata, te se prema tome izračunava cijena popravka za radni nalog. Akcije se dijele na dijagnostiku, podešavanje i ugradnju. Ugradnja sadržava barem jednu računalnu komponentu koja se ugrađuje tijekom akcije. Svaka komponenta ima svoju cijenu.`,
ask:['Nacrtajte dijagram razreda.'],
parts:[
{h:'1. Dijagram razreda',hint:'„Podaci se brišu zatvaranjem tvrtke” znači kompoziciju (tvrtka je cjelina). „Sastoji se od dodatnih radnih naloga” je refleksivna veza. Voditelj stvara radni nalog, ali ga ne sadrži, što je ovisnost.',

<p>Servis je u kompoziciji s djelatnicima (podaci se brišu zatvaranjem tvrtke). Radni nalog je u refleksivnoj kompoziciji sam sa sobom (nalog se sastoji od dodatnih naloga, brojnost *), a servisne akcije su u kompoziciji s radnim nalogom (1..*). Ugradnja agregira barem jednu računalnu komponentu.</p>`,check:CLS_CHECK}

/* ================= CRTANJE ================= */
{id:'z-crtanje',title:'Program za crtanje',short:ZB+', zadatak 3.3: apstraktni razred, sučelja i ovisnost.',
text:`Modelirajte elemente jednostavnog programa za crtanje prema sljedećem opisu.

Osnovni element programa za crtanje je radna površina. Na radnoj površini mogu se crtati različiti oblici: linije, poligoni i elipsoidi. Za svaki oblik definirana je RGB boja (boja koja se sastoji od R, G i B komponente). Linija je definirana svojom početnom i završnom točkom. Poligon je definiran skupom linija (barem tri) koje predstavljaju njegove stranice. Elipsoid je definiran skupom točaka koje omeđuju njegovu površinu. Točke su definirane koordinatama x i y. Za sve oblike moguće su operacije transformacije: rotacija, translacija, smanjenje i povećanje. Elipsoide i poligone moguće je animirati. Animacija se definira dinamički, a moguće je odabrati između dvije vrste: FadeIn i FadeOut. Obje vrste animacije rade na isti način i za elipsoide i za poligone.`,
ask:['Nacrtajte dijagram razreda.'],
parts:[
{h:'1. Dijagram razreda',hint:'Operacije koje vrijede za sve oblike, a svaki ih izvodi na svoj način, izdvoji u sučelje. Animacija koja radi jednako za više razreda postaje sučelje s dvije izvedbe (FadeIn, FadeOut) koje oblici koriste (ovisnost).',

{id:'tr',n:'Transformacija',st:'«interface»',at:[],op:['+ smanji(): void {abstract}','+ povecaj(): void {abstract}','+ rotiraj(): void {abstract}','+ translatiraj(): void {abstract}'],x:3,y:1},
{id:'el',n:'Elipsoid',at:[],op:['+ animiraj(animator: Animacija): void'],x:0,y:1},{id:'pol',n:'Poligon',at:[],op:['+ animiraj(animator: Animacija): void'],x:1,y:1},{id:'li',n:'Linija',at:['- pocetnaTocka: Tocka','- zavrsnaTocka: Tocka'],op:[],x:2,y:1},
{id:'to',n:'Tocka',at:['- koordX: int','- koordY: int'],op:[],x:0,y:2},{id:'an',n:'Animacija',st:'«interface»',at:[],op:['+ animiraj(): void {abstract}'],x:1.5,y:2},
{id:'fi',n:'FadeIn',at:[],op:[],x:1,y:3},{id:'fo',n:'FadeOut',at:[],op:[],x:2,y:3}],
r:[{f:'ob',t:'rp',k:'co',m1:'1..*'},{f:'ob',t:'rgb',k:'nav'},{f:'ob',t:'tr',k:'re'},{f:'el',t:'ob',k:'ge'},{f:'pol',t:'ob',k:'ge'},{f:'li',t:'ob',k:'ge'},
{f:'li',t:'pol',k:'co',m1:'3..*',r1:'stranice'},{f:'to',t:'el',k:'co',m1:'1..*',l:'skupTocaka'},{f:'li',t:'to',k:'nav',m2:'*'},
{f:'el',t:'an',k:'de'},{f:'pol',t:'an',k:'de'},{f:'fi',t:'an',k:'re'},{f:'fo',t:'an',k:'re'}]},
sol:`<p><b>Komentar iz zbirke:</b> budući da je za sve oblike zadano da se nad njima moraju moći izvesti operacije transformacije (rotacija, translacija, smanjenje i povećanje), te su operacije izdvojene u <b>sučelje Transformacija</b>, a svaki konkretni razred koji nasljeđuje Oblik implementira način primjene tih operacija nad sobom.</p>
<p>Zadane su dvije vrste animacije koje rade na isti način i za elipsoide i za poligone, pa je konkretna animacija implementirana u razredima FadeIn i FadeOut, a razredi Elipsoid i Poligon koriste tu implementaciju pozivajući metodu animiraj iz sučelja Animacija. Zato su sa sučeljem Animacija povezani <b>vezom ovisnosti</b>.</p>`,check:CLS_CHECK}
]},

/* ================= LICENCIRANJE ================= */
{id:'z-licenca',title:'Programska potpora za licenciranje',short:ZB+', zadatak 3.4: proizvodi, linije, licence, ključevi i kupci.',
text:`Programska potpora za licenciranje omogućava prodavaču licenciranje pojedinačnog programskog proizvoda, dijelova proizvoda i cijele linije proizvoda. Programski proizvod sastoji se od jednog ili više dijelova (npr. prevoditelji za programske jezike, programski moduli za neku funkcionalnost i sl.). Linija proizvoda obuhvaća skup proizvoda srodnih funkcionalnosti i sve njihove dijelove. Proizvodi mogu pripadati samo jednoj liniji, a dijelovi proizvoda mogu istovremeno biti dio više linija. Proizvodi iz iste linije mogu imati neke iste dijelove. Za svaku liniju proizvoda definiran je osnovni proizvod za koji kupac obavezno mora imati licencu ako želi koristiti bilo što iz te linije. Kupac može kupiti licencu za proizvode i dijelove proizvoda, a istu licencu ima samo jedan kupac. Licenca sadrži ključ koji dobiva kupac i koji može biti alfanumerički kod ili fizički USB ključ. Na osnovu vrste ključa prilikom kupnje licence generira se alfanumerički kod ili se programira USB ključ.

Kupci se dijele na privatne i poslovne te svaki kupac ima svoj identifikacijski broj. Za privatne osobe pamte se ime, prezime, adresa e-pošte i kontakt telefon. Za poslovne osobe pamte se naziv tvrtke, adresa e-pošte i kontakt telefon. Za svakog kupca definira se adresa isporuke robe i adresa isporuke računa, koje sadrže naziv ulice i kućni broj, poštanski broj, grad i državu.`,

/* PROGI – aplikacija za učenje */
const TOPICS = {
  P1: 'Uvod u programsko inženjerstvo',
  P2: 'Životni ciklus i inženjerstvo zahtjeva',
  P3: 'Modeli razvoja programske potpore',
  P4: 'UML: obrasci uporabe i sekvencijski dijagrami',
  P5: 'Arhitektura programa',
  P6: 'OOAD i dijagram razreda'
};
const EXAM_PLAN = { P1: 3, P2: 4, P3: 4, P4: 4, P5: 4, P6: 3 };
const LS = 'progi_ucenje_v1';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const KEYS = ['A', 'B', 'C', 'D', 'E'];

let S = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.st) return s; } catch (e) { }
  return { st: {}, exams: [], notes: {}, set: { timer: 45, mode: 'smart' }, session: { ok: 0, n: 0 } };
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { } }

function record(q, correct) {
  const r = S.st[q.id] || { n: 0, ok: 0, bad: 0, streak: 0, last: null };
  r.n++; if (correct) { r.ok++; r.streak++; r.last = 1; } else { r.bad++; r.streak = 0; r.last = 0; }
  r.at = Date.now(); S.st[q.id] = r; save();
}
function weight(q) {
  const r = S.st[q.id];
  if (!r) return 2.5;
  if (r.last === 0) return 6 + Math.min(r.bad, 4);
  if (r.streak >= 3) return 0.2;
  if (r.streak === 2) return 0.45;
  return 0.9;
}
let recent = [];
function pick() {
  let pool = Q.filter(q => !recent.includes(q.id));
  if (S.set.mode === 'missed') {
    const m = pool.filter(q => S.st[q.id] && S.st[q.id].last === 0);
    if (m.length) pool = m; else return null;
  }
  const tot = pool.reduce((s, q) => s + weight(q), 0);
  let x = Math.random() * tot;
  for (const q of pool) { x -= weight(q); if (x <= 0) return q; }
  return pool[pool.length - 1];
}

/* ---------- routing ---------- */
const views = { vjezba: viewPractice, ispit: viewExamStart, zadaci: viewTasks, napredak: viewProgress };
let current = 'vjezba';
let examTimer = null;
function go(v, arg) {
  if (examTimer && v !== 'ispit-run') { clearInterval(examTimer); examTimer = null; }
  current = v;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v.split('-')[0]));
  const main = $('#main'); main.innerHTML = '';
  (views[v] || window['view_' + v])(main, arg);
  window.scrollTo(0, 0);
}

/* ---------- shared question rendering ---------- */
function diagramHtml(q) {
  if (!q.dg) return '';
  return `<div class="dg${q.dgWide ? ' wide' : ''}">${UML.render(q.dg)}</div>`;
}
function srcLine(q) { return `<div class="src">Izvor: ${esc(q.s || TOPICS[q.t])}</div>`; }

let curQ = null, curOrder = null, answered = false;
function viewPractice(main) {
  const seen = Object.keys(S.st).length;
  const missed = Q.filter(q => S.st[q.id] && S.st[q.id].last === 0).length;
  main.innerHTML = `
  <div class="row" style="margin-top:18px">
    <div class="seg" role="group" aria-label="Način vježbe">
      <button data-m="smart" class="${S.set.mode === 'smart' ? 'on' : ''}">Sva pitanja</button>

    <span class="muted" style="font-size:.9rem">Ova sesija: <b>${S.session.ok}</b> / ${S.session.n} točno · viđeno ${seen} od ${Q.length}</span>
  </div>
  <div id="qcard"></div>`;
  main.querySelectorAll('.seg button').forEach(b => b.onclick = () => { S.set.mode = b.dataset.m; save(); recent = []; curQ = null; go('vjezba'); });
  nextQuestion();
}
function nextQuestion() {
  const q = pick();
  const box = $('#qcard');
  if (!q) { box.innerHTML = `<div class="card"><h2>Nema promašenih pitanja 🎉</h2><p class="muted">Sva pitanja koja si promašio u međuvremenu si i točno riješio. Prebaci se na „Sva pitanja”.</p></div>`; return; }
  curQ = q; answered = false;
  recent.push(q.id); if (recent.length > 25) recent.shift();
  curOrder = shuffle(q.o.map((_, i) => i));
  const r = S.st[q.id];
  const hist = r ? `<span class="chip gray">${r.ok}/${r.n} točno</span>` : `<span class="chip gray">novo</span>`;
  box.innerHTML = `<div class="card">
    <div class="row"><span class="chip">${q.t} · ${esc(TOPICS[q.t])}</span>${hist}</div>
    <div class="qtext">${rich(q.q)}</div>
    ${diagramHtml(q)}
    <div class="opts">${curOrder.map((oi, k) => `<button class="opt" data-k="${k}"><span class="k">${KEYS[k]}</span><span>${rich(q.o[oi])}</span></button>`).join('')}</div>
    <div id="fb"></div>
    <div class="row" style="margin-top:14px"><span class="kbd">Tipke: 1–4 odabir · Enter sljedeće</span><span class="spacer"></span><button class="btn" id="skip">Preskoči</button></div>
  </div>`;
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  $('#skip').onclick = nextQuestion;
}
function answer(k) {
  if (answered || !curQ) return; answered = true;
  const q = curQ; const chosen = curOrder[k]; const ok = chosen === q.a;
  record(q, ok); S.session.n++; if (ok) S.session.ok++; save();
  document.querySelectorAll('#qcard .opt').forEach((b, i) => {
    b.disabled = true;
    if (curOrder[i] === q.a) b.classList.add('ok'); else if (i === k) b.classList.add('bad');
  });
  $('#fb').innerHTML = `<div class="expl ${ok ? 'ok' : 'bad'}"><div class="t">${ok ? 'Točno!' : 'Netočno.'} ${ok ? '' : 'Točan odgovor: ' + KEYS[curOrder.indexOf(q.a)]}</div>${rich(q.e)}${srcLine(q)}</div>`;
  const sk = $('#skip'); sk.textContent = 'Sljedeće pitanje →'; sk.classList.add('pri'); sk.focus();
}
document.addEventListener('keydown', e => {
  if (current !== 'vjezba' || e.target.tagName === 'TEXTAREA') return;
  if (/^[1-5]$/.test(e.key) && !answered) { const k = +e.key - 1; if (curOrder && k < curOrder.length) answer(k); }
  else if ((e.key === 'Enter' || e.key === ' ') && answered) { e.preventDefault(); nextQuestion(); }
});

let EX = null;

  const upd = () => { $('#cnt').textContent = `${EX.qs.filter(x => x.ans !== null).length} / 22 odgovoreno`; };
  const submitAsk = () => {

const mmss = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function finishExam(timeout) {

  $('#again').onclick = () => go('ispit-run');
  $('#toprac').onclick = () => { S.set.mode = 'missed'; save(); recent = []; go('vjezba'); };

  <div class="card">${ex.length ? `<table class="t"><tr><th>Datum</th><th>Bodovi</th><th>T / N / prazno</th><th>Trajanje</th></tr>${ex.map(e => `<tr><td>${new Date(e.at).toLocaleString('hr-HR')}</td><td><b>${fmt(e.score)}</b> / 11</td><td>${e.ok} / ${e.bad} / ${e.blank}</td><td>${mmss(e.dur)}</td></tr>`).join('')}</table>` : '<p class="muted">Još nisi riješio nijednu simulaciju.</p>'}</div>
  <h2>Trenutno promašena pitanja</h2>
  <div class="card">${missed.length ? `<ol>${missed.map(q => `<li>${rich(q.q.split('\n')[0])} <span class="chip gray">${q.t}</span></li>`).join('')}</ol><button class="btn pri" id="pm">Vježbaj samo ova pitanja</button>` : '<p class="muted">Nema promašenih pitanja.</p>'}</div>
  <h2>Postavke</h2>
  <div class="card"><div class="row"><span>Brisanje cijelog napretka (statistike, ispita i bilješki)</span><span class="spacer"></span><button class="btn small" id="rst">Obriši napredak</button></div></div>`;
  const pm = $('#pm'); if (pm) pm.onclick = () => { S.set.mode = 'missed'; save(); recent = []; go('vjezba'); };
  $('#rst').onclick = e => {
    const b = e.target; if (!b.dataset.c) { b.dataset.c = 1; b.textContent = 'Sigurno? Klikni ponovno'; return; }
    S = { st: {}, exams: [], notes: {}, set: S.set, session: { ok: 0, n: 0 } }; recent = []; save(); go('napredak');
  };
}

/* ---------- theme & init ---------- */
function setTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; S.set.theme = t; save(); }
document.addEventListener('DOMContentLoaded', () => {
  if (S.set.theme) document.documentElement.dataset.theme = S.set.theme;
  S.session = { ok: 0, n: 0 };
  document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => go(b.dataset.v));
  $('#theme').onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(dark ? 'light' : 'dark');
  };
  $('#qcount').textContent = Q.length + ' pitanja';
  go('vjezba');
});

</script>
</body>
</html>
