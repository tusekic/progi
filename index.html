{id:'p3-28',t:'P3',q:'Kojim su redom faze Unificiranog procesa (UP)?',o:['Početak (Inception) → razrada (Elaboration) → izgradnja (Construction) → prijelaz (Transition)','Zahtjevi → oblikovanje → implementacija → ispitivanje','Razrada → početak → prijelaz → izgradnja','Planiranje → sprint → pregled → retrospektiva'],a:0,e:'Faze UP-a: početak, razrada, izgradnja, prijelaz. Faza određuje prevladavajući cilj, ali ne isključuje ostale aktivnosti.',s:'P03 · Faze i ključne točke unificiranog procesa'},
{id:'p3-29',t:'P3',q:'Koja ključna točka (milestone) završava fazu razrade (Elaboration) u UP-u?',o:['LCA (Life-Cycle Architecture)','LCO (Life-Cycle Objectives)','IOC (Initial Operational Capability)','Izdavanje proizvoda (Release)'],a:0,e:'Početak → LCO (ciljevi životnog ciklusa), razrada → LCA (arhitektura životnog ciklusa), izgradnja → IOC (početna operativna sposobnost), prijelaz → izdavanje proizvoda.',s:'P03 · Faze i ključne točke unificiranog procesa'},
{id:'p3-30',t:'P3',q:'Što je prevladavajući cilj faze početka (Inception) u UP-u?',o:['Utvrditi opseg, poslovnu opravdanost i glavne rizike','Razviti i integrirati svu funkcionalnost','Uvesti sustav u stvarnu uporabu','Provesti korisničku obuku'],a:0,e:'Početak: opseg, poslovna opravdanost, glavni rizici (LCO). Razrada: provjera arhitekturne osnove i glavnih rizika. Izgradnja: razvoj i integracija. Prijelaz: uvođenje u uporabu.',s:'P03 · Faze i ključne točke unificiranog procesa'},
{id:'p3-31',t:'P3',q:'Koja je tvrdnja o odnosu faza, iteracija i disciplina u UP-u točna?',o:['Faza nije disciplina; u razradi se također implementira i ispituje kada se time provjerava arhitekturni rizik','Svaka disciplina izvodi se samo u jednoj fazi','Iteracija uvijek započinje novu fazu','Ispitivanje se izvodi samo u fazi prijelaza'],a:0,e:'Faze su strateški ciljevi, iteracije ponavljani ciklusi, a discipline vrste posla različitog intenziteta kroz faze. Faza nije disciplina, a iteracija ne podrazumijeva novu fazu.',s:'P03 · Odnos faza, iteracija i disciplina'},
{id:'p3-32',t:'P3',q:'Što je artefakt u Unificiranom procesu?',o:['Rezultat rada, npr. model, izvorni kod ili ispitni slučaj; nije nužno opsežan dokument','Isključivo opsežan pisani dokument','Uloga u timu','Faza procesa'],a:0,e:'Artefakt je provjerljiv proizvod aktivnosti. Uloga je skup odgovornosti (jedna osoba može imati više uloga). Radni tijek povezuje aktivnosti u smislen rezultat.',s:'P03 · Struktura unificiranog procesa'},
{id:'p3-33',t:'P3',q:'Kako se u UP-u postupa s arhitekturom?',o:['Razrađuje se dovoljno rano da se provjere ključne odluke, ne da se unaprijed detaljno oblikuje cijeli sustav','Potpuno se oblikuje prije prve linije koda','Ne razmatra se do faze prijelaza','Zamjenjuje se obrascima uporabe'],a:0,e:'Rizik se smanjuje odgovarajućim provjerama (prototip, izvršiva arhitekturna osnova), a ne tvrdnjom da arhitektura postoji.',s:'P03 · Arhitektura i upravljanje rizicima u UP-u'},
{id:'p3-34',t:'P3',q:'Koja je godina nastanka Agilnog manifesta i koliko vrijednosti i načela ima?',o:['2001.; četiri vrijednosti i dvanaest načela','1999.; pet vrijednosti i deset načela','2010.; tri vrijednosti i sedam načela','1988.; četiri vrijednosti i osam načela'],a:0,e:'Agilni manifest (2001.) ima četiri vrijednosti i dvanaest načela.',s:'P03 · Vrijednosti agilnog razvoja'},
{id:'p3-35',t:'P3',q:'Koja od navedenih JE vrijednost Agilnog manifesta?',o:['Radna programska potpora važnija je od opsežne dokumentacije','Procesi i alati važniji su od pojedinaca i interakcija','Pregovaranje o ugovoru važnije je od suradnje s korisnikom','Strogo pridržavanje plana važnije je od prilagodbe promjenama'],a:0,e:'Četiri vrijednosti: pojedinci i interakcije > procesi i alati; radna programska potpora > opsežna dokumentacija; suradnja s korisnikom > pregovaranje o ugovoru; prilagodba promjenama > pridržavanje plana. Desne stavke također imaju vrijednost.',s:'P03 · Vrijednosti agilnog razvoja'},
{id:'p3-36',t:'P3',q:'Znači li agilni razvoj rad bez dokumentacije i procesa?',o:['Ne. Desne stavke manifesta također imaju vrijednost, a agilnost ne isključuje arhitekturu, dokumentaciju ni planiranje.','Da, dokumentacija je u agilnom razvoju zabranjena','Da, ali samo u Scrumu','Ne, ali arhitektura se u agilnom razvoju nikad ne razmatra'],a:0,e:'Agilnost ne isključuje arhitekturu, dokumentaciju, kvalitetu ni planiranje. Razlika je u tome kako se struktura prilagođava neizvjesnosti.',s:'P03 · Razlozi primjene agilnih pristupa'},
{id:'p3-37',t:'P3',q:'Kakvu uspješnost agilnih i vodopadnih projekata (svi projekti) navodi CHAOS 2015?',o:['Agilni 39 % uspješnih, vodopadni 11 %','Agilni 11 %, vodopadni 39 %','Oba po 31 %','Agilni 58 %, vodopadni 3 %'],a:0,e:'CHAOS 2015: agilno 39 % uspješnih (52 % upitnih, 9 % neuspješnih), vodopad 11 % (60 %, 29 %). Razlika je veća kod srednjih i velikih projekata. To je indikativno, a ne dokaz uzročnosti.',s:'P03 · Uspješnost projekata prema razvojnom pristupu'},
{id:'p3-38',t:'P3',q:'Koja je od navedenih klasična praksa ekstremnog programiranja (XP)?',o:['Programiranje u paru','Sprint planiranje u trajanju 8 h','Ograničenje rada u tijeku (WIP)','Ključna točka LCA'],a:0,e:'Klasične XP prakse: igra planiranja, mala izdanja, kupac u timu, jednostavno oblikovanje, refaktoriranje, standardi kodiranja, metafora, programiranje u paru, kolektivno vlasništvo, TDD, kontinuirana integracija, 40-satni tjedan.',s:'P03 · XP: prakse, prednosti i ograničenja'},
{id:'p3-39',t:'P3',q:'Tko su autori ekstremnog programiranja (XP) i kada je nastalo?',o:['Beck, Cunningham, Jeffries; 1999.','Schwaber i Beedle; 2001.','Poppendieck; 2003.','Anderson; 2010.'],a:0,e:'XP: 1999., Beck, Cunningham, Jeffries. Scrum: 2001., Schwaber i Beedle. Lean: 2003., Poppendieck. Kanban: 2010., Anderson.',s:'P03 · Primjeri pristupa agilnom razvoju'},
{id:'p3-40',t:'P3',q:'Koje je ograničenje XP-a navedeno na predavanju?',o:['Veliki i raspodijeljeni timovi traže dodatnu koordinaciju, a programiranje u paru ima trošak','Ne podržava automatizirano ispitivanje','Ne dopušta refaktoriranje','Zahtijeva vodopadni plan'],a:0,e:'Ograničenja XP-a: veliki i raspodijeljeni timovi, potrebno iskustvo članova, trošak rada u paru, dobri ispitni scenariji traže vještine.',s:'P03 · XP: prakse, prednosti i ograničenja'},
{id:'p3-41',t:'P3',q:'Na kojim se empirijskim načelima temelji Scrum?',o:['Transparentnost, inspekcija, prilagodba','Predanost, hrabrost, poštovanje','Planiranje, izvođenje, kontrola','Opseg, vrijeme, trošak'],a:0,e:'Tri empirijska stupa Scruma: transparentnost, inspekcija i prilagodba. Predanost, usredotočenost, otvorenost, poštovanje i hrabrost su Scrum vrijednosti.',s:'P03 · Scrum; Empirijska načela Scruma'},
{id:'p3-42',t:'P3',q:'Koje su Scrum vrijednosti?',o:['Predanost, usredotočenost, otvorenost, poštovanje i hrabrost','Transparentnost, inspekcija i prilagodba','Jednostavnost, komunikacija i povratna informacija','Brzina, kvaliteta i cijena'],a:0,e:'Pet Scrum vrijednosti: predanost, usredotočenost, otvorenost, poštovanje, hrabrost.',s:'P03 · Scrum'},
{id:'p3-43',t:'P3',q:'Koje su tri odgovornosti u Scrum timu?',o:['Vlasnik proizvoda, voditelj Scruma (Scrum Master) i razvojni članovi (Developers)','Voditelj projekta, arhitekt i tester','Kupac, korisnik i programer','Analitičar, dizajner i administrator'],a:0,e:'Scrum ne definira hijerarhijski odvojeni podtim. Vlasnik proizvoda maksimizira vrijednost, voditelj Scruma brine o učinkovitosti tima, a razvojni članovi stvaraju inkrement. Uobičajeno je 10 ili manje članova.',s:'P03 · Odgovornosti u Scrum timu'},
{id:'p3-44',t:'P3',q:'Tko je u Scrumu odgovoran za maksimiziranje vrijednosti proizvoda i upravljanje popisom poslova proizvoda?',o:['Vlasnik proizvoda (Product Owner)','Voditelj Scruma (Scrum Master)','Razvojni članovi','Dionici'],a:0,e:'Vlasnik proizvoda upravlja popisom poslova proizvoda, ali ne mora sam napisati sve stavke.',s:'P03 · Odgovornosti u Scrum timu'},
{id:'p3-45',t:'P3',q:'Koja je uloga voditelja Scruma (Scrum Master)?',o:['Uspostavlja Scrum, brine o učinkovitosti tima i pomaže uklanjati prepreke','Dodjeljuje zadatke razvojnim članovima kao voditelj projekta','Odlučuje o prioritetima popisa poslova proizvoda','Piše sav kod'],a:0,e:'Voditelj Scruma podupire proces i uklanja prepreke. Kad se ponaša kao voditelj projekta, podriva samoorganizaciju tima, što je česta pogreška.',s:'P03 · Odgovornosti u Scrum timu; Česte pogreške u Scrumu'},
{id:'p3-46',t:'P3',q:'Koliko najdulje traje sprint?',o:['Najviše mjesec dana','Najviše tjedan dana','Točno dva tjedna','Najviše tri mjeseca'],a:0,e:'Sprint je iteracija određenog trajanja, najviše mjesec dana. Novi sprint počinje odmah nakon prethodnog, a sprintovi su obično jednakog trajanja (u studentskom projektu npr. dva tjedna).',s:'P03 · Sprint'},
{id:'p3-47',t:'P3',q:'Tko smije otkazati sprint?',o:['Samo vlasnik proizvoda, ako cilj sprinta zastari','Voditelj Scruma kad tim kasni','Bilo koji razvojni član','Naručitelj u bilo kojem trenutku'],a:0,e:'Otkazivanje sprinta je rijetko i smije ga napraviti samo vlasnik proizvoda, kad cilj sprinta zastari.',s:'P03 · Sprint'},
{id:'p3-48',t:'P3',q:'Koliko najdulje traje planiranje sprinta za sprint od mjesec dana?',o:['8 sati','15 minuta','4 sata','3 sata'],a:0,e:'Za sprint od mjesec dana: planiranje najviše 8 h, dnevni Scrum 15 min, pregled sprinta najviše 4 h, retrospektiva najviše 3 h. Kraći sprint ima kraće događaje.',s:'P03 · Događaji Scruma'},
{id:'p3-49',t:'P3',q:'Koliko najdulje traje retrospektiva za sprint od mjesec dana?',o:['3 sata','4 sata','8 sati','15 minuta'],a:0,e:'Retrospektiva: najviše 3 h. Pregled sprinta: najviše 4 h.',s:'P03 · Događaji Scruma'},
{id:'p3-50',t:'P3',q:'Koja je svrha dnevnog Scruma?',o:['Provjera napretka prema cilju sprinta i prilagodba plana za sljedeći dan; namijenjen je razvojnim članovima','Izvještavanje voditelju Scruma o učinku svakog člana','Demonstracija proizvoda dionicima','Poboljšanje procesa i alata'],a:0,e:'Dnevni Scrum traje 15 min i nije izvještavanje voditelju Scruma. Scrum vodič 2020. ne propisuje strukturu, a često se koriste tri pitanja.',s:'P03 · Dnevni Scrum'},
{id:'p3-51',t:'P3',q:'Koja je razlika između pregleda sprinta i retrospektive?',o:['Pregled se bavi proizvodom (s dionicima), a retrospektiva procesom (samo Scrum tim)','Pregled se bavi procesom, a retrospektiva proizvodom','Oba se bave samo kodom','Retrospektiva uključuje dionike, a pregled ne'],a:0,e:'Pregled: što je isporučeno, ishod je prilagođen popis poslova proizvoda. Retrospektiva: kako radimo, ishod su dogovorena poboljšanja procesa.',s:'P03 · Pregled sprinta i retrospektiva'},
{id:'p3-52',t:'P3',q:'Koja je obveza (commitment) pridružena artefaktu inkrement?',o:['Definicija dovršenosti (Definition of Done, DoD)','Cilj sprinta','Cilj proizvoda','Definicija spremnosti (DoR)'],a:0,e:'Popis poslova proizvoda → cilj proizvoda; popis poslova sprinta → cilj sprinta; inkrement → definicija dovršenosti.',s:'P03 · Artefakti i obveze u Scrumu'},
{id:'p3-53',t:'P3',q:'Koja obveza je pridružena popisu poslova proizvoda (Product Backlog)?',o:['Cilj proizvoda (Product Goal)','Cilj sprinta','Definicija dovršenosti','Kriteriji prihvaćanja'],a:0,e:'Popis poslova proizvoda je uređeni popis potrebnih poboljšanja. Cilj proizvoda opisuje dugoročnije željeno stanje.',s:'P03 · Artefakti i obveze u Scrumu'},
{id:'p3-54',t:'P3',q:'Koja je razlika između kriterija prihvaćanja i definicije dovršenosti (DoD)?',o:['Kriteriji prihvaćanja odnose se na pojedinu stavku, a DoD na kvalitetu cijelog inkrementa','DoD se odnosi na pojedinu stavku, a kriteriji na inkrement','To su sinonimi','DoD je opcionalan timski dogovor, a kriteriji su obvezni dio Scruma'],a:0,e:'Zadovoljeni kriteriji jedne priče ne znače da inkrement zadovoljava DoD. DoD je sastavni dio Scruma, a DoR (definicija spremnosti) je mogući timski dogovor.',s:'P03 · Spremnost stavki i dovršenost inkrementa'},
{id:'p3-55',t:'P3',q:'Je li Definicija spremnosti (DoR) obvezni dio Scrum okvira?',o:['Ne, DoR je mogući timski dogovor, dok je DoD sastavni dio Scruma','Da, DoR i DoD su oba obvezna','Da, DoR je obvezan, a DoD nije','Ni DoR ni DoD ne postoje u Scrumu'],a:0,e:'DoD je sastavni dio Scrum okvira, a DoR (je li stavka dovoljno razjašnjena za rad) mogući je timski dogovor.',s:'P03 · Spremnost stavki i dovršenost inkrementa'},
{id:'p3-56',t:'P3',q:'Inkrement zadovoljava DoD. Znači li to da je pušten korisnicima?',o:['Ne, on je potencijalno isporučiv; puštanje u uporabu je zasebna poslovna ili operativna odluka','Da, DoD automatski znači puštanje u produkciju','Da, ali samo u Kanbanu','Ne, inkrement se nikad ne pušta'],a:0,e:'Isporučivo ≠ isporučeno. Odluka o puštanju zasebna je poslovna odnosno operativna odluka.',s:'P03 · Spremnost stavki i dovršenost inkrementa'},
{id:'p3-57',t:'P3',q:'Što znači slovo „N” u akronimu INVEST?',o:['Negotiable (otvorena za dogovor)','Necessary (nužna)','New (nova)','Numbered (numerirana)'],a:0,e:'INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable. To je heuristika za razradu priča, a ne obvezno pravilo Scrum vodiča.',s:'P03 · INVEST: kvaliteta korisničke priče'},
{id:'p3-58',t:'P3',q:'Priču „cijeli modul obavještavanja” treba podijeliti na prijavu, obradu i obavještavanje. Koje INVEST svojstvo time postižemo?',o:['S – Small (mala, može se dovršiti unutar sprinta)','I – Independent','V – Valuable','T – Testable'],a:0,e:'Small: može li se priča dovršiti unutar sprinta? Velike priče (npr. PB-5 s 21 bodom) treba razraditi i podijeliti.',s:'P03 · INVEST: kvaliteta korisničke priče'},
{id:'p3-59',t:'P3',q:'Što prikazuje grafikon izgaranja (burndown chart) i što znači stvarna linija iznad idealne?',o:['Preostali rad kroz sprint; linija iznad idealne znači zaostajanje','Broj grešaka po danu; linija iznad znači manje grešaka','Brzinu pojedinca; linija iznad znači da je pojedinac brži','Utrošeni budžet; linija iznad znači uštedu'],a:0,e:'Grafikon izgaranja prikazuje preostali rad. U primjeru LEGIS na 5. danu preostaje 29 h, a idealno oko 24 h, što znači zaostajanje.',s:'P03 · Praćenje preostalog rada: grafikon izgaranja'},
{id:'p3-60',t:'P3',q:'Što je brzina (velocity) tima u Scrumu?',o:['Zbroj bodova dovršenih stavki po sprintu; pomaže planiranju, a nije mjera učinka pojedinca','Broj linija koda po danu','Broj commitova po članu','Vrijeme od prihvaćanja stavke do isporuke'],a:0,e:'Velocity pomaže planiranju, ali nije mjera učinka pojedinca. Vrijeme od prihvaćanja do isporuke je lead time (Kanban).',s:'P03 · Praćenje preostalog rada: grafikon izgaranja'},
{id:'p3-61',t:'P3',q:'Što je ispravno ako tim „ne stigne” dovršiti sve u sprintu?',o:['Zadržati duljinu sprinta i smanjiti opseg uz dogovor s vlasnikom proizvoda','Produljiti sprint dok se sve ne dovrši','Smanjiti kvalitetu da bi se stiglo','Preskočiti retrospektivu'],a:0,e:'Produljenje sprinta je česta pogreška jer se gubi ritam i povratna informacija. Tijekom sprinta kvaliteta se ne smanjuje, a opseg se po potrebi ponovno dogovara s vlasnikom proizvoda.',s:'P03 · Česte pogreške u Scrumu; Sprint'},
{id:'p3-62',t:'P3',q:'Koje je prvo načelo vitkog (Lean) razvoja programske potpore?',o:['Uklanjanje rasipanja (eliminate waste)','Ograničenje WIP-a','Rad u paru','Dnevni sastanak'],a:0,e:'Sedam Lean načela (Poppendieck, 2003.): uklanjanje rasipanja, pojačano učenje, kasno odlučivanje, što brža isporuka, osnaživanje tima, ugradnja cjelovitosti, sagledavanje cjeline.',s:'P03 · Vitki razvoj programske potpore'},
{id:'p3-63',t:'P3',q:'Što znači Lean načelo „kasno odlučivanje” (decide as late as possible)?',o:['Očuvati mogućnosti dok se ne prikupe činjenice potrebne za odluku','Odgađati sve odluke do kraja projekta','Donositi odluke tek nakon isporuke','Prepustiti odluke kupcu'],a:0,e:'Kasno odlučivanje: zadržati mogućnosti otvorenima dok nisu prikupljene činjenice potrebne za odluku.',s:'P03 · Vitki razvoj programske potpore'},
{id:'p3-64',t:'P3',q:'Što je ograničenje rada u tijeku (WIP) u Kanbanu?',o:['Količina nedovršenog rada ograničena je kapacitetom; novi zadatak se povlači tek kad ima mjesta','Ograničenje trajanja sprinta','Ograničenje broja članova tima','Maksimalan broj commitova dnevno'],a:0,e:'WIP ograničenje: novi zadatak se ne gura, već se povlači (pull) kad postoji slobodno mjesto. Nakupljanje kartica u stupcu pokazuje usko grlo.',s:'P03 · Kanban'},
{id:'p3-65',t:'P3',q:'Što mjeri vrijeme izvedbe (lead time) u Kanbanu?',o:['Vrijeme od prihvaćanja stavke do isporuke','Broj isporučenih stavki u jedinici vremena','Zbroj story bodova po sprintu','Vrijeme trajanja dnevnog sastanka'],a:0,e:'Lead time: od prihvaćanja do isporuke. Propusnost (throughput): broj dovršenih stavki u vremenu. Obje mjere otkrivaju uska grla.',s:'P03 · Kanban'},
{id:'p3-66',t:'P3',q:'Koja je razlika između Scruma i Kanbana?',o:['Scrum ima sprintove fiksne duljine i propisane uloge; Kanban ima kontinuirani tok i ne propisuje uloge','Kanban ima sprintove, a Scrum kontinuirani tok','Scrum koristi WIP ograničenja, a Kanban cilj sprinta','Nema razlike'],a:0,e:'Scrum: sprintovi, uloge, cilj sprinta. Kanban: kontinuirani tok, eksplicitna WIP ograničenja, praćenje lead timea i propusnosti. Scrumban kombinira oba.',s:'P03 · Scrum i Kanban: usporedba'},
{id:'p3-67',t:'P3',q:'Što je Scrumban?',o:['Kombinacija ritma Scruma s vizualizacijom i WIP ograničenjima Kanbana','Skalirani Scrum za velike organizacije','Scrum bez vlasnika proizvoda','Kanban sa sprintovima od jednog dana'],a:0,e:'Scrumban kombinira ritam Scruma s vizualizacijom i WIP ograničenjima Kanbana. Skalirani Scrum su LeSS i SAFe.',s:'P03 · Scrum i Kanban: usporedba'},
{id:'p3-68',t:'P3',q:'Što je kontinuirana integracija (CI)?',o:['Česta integracija malih promjena u zajedničku bazu uz automatiziranu izgradnju i ispitivanje','Automatsko postavljanje svake promjene u produkciju','Ručno spajanje grana jednom mjesečno','Pisanje ispitnih slučajeva prije koda'],a:0,e:'CI: male i česte promjene, automatizirana izgradnja i ispitivanje rano otkrivaju dio integracijskih problema. Zelena CI oznaka potvrđuje samo izvedene provjere.',s:'P03 · CI/CD: integracija, isporuka i postavljanje'},
{id:'p3-69',t:'P3',q:'Koja je razlika između kontinuirane isporuke (continuous delivery) i kontinuiranog postavljanja (continuous deployment)?',o:['Kod isporuke su promjene spremne za produkciju, ali puštanje može tražiti odluku; kod postavljanja se automatski postavljaju bez ručnog odobrenja','Kod isporuke se promjene automatski postavljaju, a kod postavljanja ne','To su sinonimi','Kontinuirana isporuka ne uključuje ispitivanje'],a:0,e:'Kratica CD koristi se za oba postupka. Delivery: spremno, ali puštanje može tražiti odobrenje. Deployment: automatski u produkciju ako se zadovolje uvjeti.',s:'P03 · CI/CD: integracija, isporuka i postavljanje'},
{id:'p3-70',t:'P3',q:'Što je razvoj na glavnoj grani (trunk-based development)?',o:['Česta integracija malih promjena; kompatibilan je s vrlo kratkim tematskim granama','Razvoj svake funkcionalnosti na dugotrajnoj zasebnoj grani','Zabrana grananja u Gitu','Spajanje svih grana jednom na kraju projekta'],a:0,e:'Trunk-based: česta integracija malih promjena. Dugotrajno izdvojene grane povećavaju integracijske rizike.',s:'P03 · Strategije grananja i integracije koda'},
{id:'p3-71',t:'P3',q:'Koji je ispravan redoslijed automatiziranog dijela CI cjevovoda u primjeru LEGIS?',o:['Izgradnja → statičke provjere → jedinično i integracijsko ispitivanje → verzionirani artefakt','Postavljanje u produkciju → izgradnja → ispitivanje','Ispitivanje → commit → izgradnja → statičke provjere','Verzionirani artefakt → izgradnja → ispitivanje'],a:0,e:'Commit/PR pokreće: izgradnju → statičke provjere → jedinično i integracijsko ispitivanje → verzionirani artefakt → pripremno okruženje. Neuspjeh važnog koraka zaustavlja daljnje korake.',s:'P03 · LEGIS: CI/CD cjevovod'},
{id:'p3-72',t:'P3',q:'Što je DevOps?',o:['Skup praksi i kulture koji povezuje razvoj i operativni rad radi češće i sigurnije isporuke','Nova uloga u timu','Poseban alat za CI','Zaseban model procesa koji zamjenjuje Scrum'],a:0,e:'DevOps nije uloga, alat ni zaseban model procesa. Razvojni i operativni timovi dijele odgovornost, uz automatizaciju i brzu povratnu informaciju.',s:'P03 · DevOps'},
{id:'p3-73',t:'P3',q:'Što je SAST u DevSecOpsu?',o:['Statičko sigurnosno ispitivanje aplikacije koje u kodu traži sigurnosno relevantne obrasce','Dinamičko ispitivanje performansi','Alat za orkestraciju kontejnera','Metoda izlučivanja zahtjeva'],a:0,e:'SAST = static application security testing. Nalaze (lažno pozitivne i negativne) treba stručno protumačiti, a automatske provjere ne zamjenjuju pregled koda i procjenu rizika.',s:'P03 · DevSecOps: sigurnosne provjere'},
{id:'p3-74',t:'P3',q:'Koja je razlika između virtualnog stroja i kontejnera?',o:['VM pokreće zaseban gostujući OS; kontejner je procesna izolacija uz dijeljenu jezgru OS-a i obično je lakši','Kontejner pokreće zaseban OS, a VM dijeli jezgru','Nema razlike','VM se ne može prenositi'],a:0,e:'VM: gostujući OS iznad hipervizora, više resursa, sporije pokretanje. Kontejner: dijeljena jezgra, lakši i brži.',s:'P03 · Virtualni strojevi i kontejneri'},
{id:'p3-75',t:'P3',q:'Što je slika kontejnera?',o:['Predložak s aplikacijom i ovisnostima iz kojeg se stvaraju instance kontejnera; nije pokrenuta instanca','Pokrenuta instanca kontejnera','Snimka zaslona aplikacije','Usluga platforme kao usluge (PaaS)'],a:0,e:'Slika je predložak, a kontejner pokrenuta instanca. Docker je platforma za izgradnju i pokretanje kontejnera, a ne PaaS.',s:'P03 · Virtualizacija i kontejneri'},
{id:'p3-76',t:'P3',q:'Koja je uloga UI-ja u životnom ciklusu razvoja prema predavanju?',o:['Potpora postojećim aktivnostima; prijedlog prolazi stručnu provjeru tima koji odgovara za rezultat','Zaseban model razvojnog procesa','Zamjena za pregled koda','Konačna odgovornost za sigurnost'],a:0,e:'Prijedlog UI-ja → stručna provjera tima → prihvaćanje ili odbacivanje. Sintaktički ispravan kod i osnovne provjere nisu dokaz ispravne autorizacije.',s:'P03 · UI u životnom ciklusu razvoja; LEGIS: provjera prijedloga UI-ja'},
{id:'p3-77',t:'P3',q:'Zahtjevi su nestabilni i očekuju se česte promjene. Koji pristup je prema kriterijima odabira prikladniji?',o:['Iterativni / agilni','Sekvencijski (vodopadni)','Ad hoc','Kodiraj i popravljaj'],a:0,e:'Kriteriji odabira: stabilni zahtjevi → sekvencijski, promjenjivi → iterativni ili agilni. Veliki tehnički rizici → prototip, spirala, rana arhitektura. Česte isporuke → inkrementi uz CI/CD.',s:'P03 · Kriteriji odabira razvojnog procesa'},
{id:'p3-78',t:'P3',q:'Projekt ima velike tehničke rizike i nejasnu tehnologiju. Što predavanje preporučuje?',o:['Prototip, spiralni model ili ranu razradu arhitekture','Čisti vodopadni model','Ad hoc razvoj','Odgoditi sve odluke do isporuke'],a:0,e:'Za velike tehničke rizike treba rano istraživati prototipom ili arhitekturnim analizama (spirala, UP razrada).',s:'P03 · Kriteriji odabira razvojnog procesa'}
);

/* P4 – UML u inženjerstvu zahtjeva: obrasci uporabe i sekvencijski dijagrami */
Q.push(
{id:'p4-01',t:'P4',q:'Tko održava UML i koja je inačica navedena na predavanju?',o:['OMG; UML 2.5.1 (prosinac 2017.)','ISO; UML 3.0 (2021.)','IEEE; UML 2.0 (2005.)','W3C; UML 1.1 (1997.)'],a:0,e:'UML je općenamjenski vizualni jezik za modeliranje koji održava OMG (Object Management Group). Aktualna inačica na predavanju je UML 2.5.1 iz prosinca 2017. UML 1.1 OMG je prihvatio 1997., a UML 2.0 izašao je 2005.',s:'P04 · UML: svrha, opseg i ograničenja; Dodatak: podrijetlo i standardizacija'},
{id:'p4-02',t:'P4',q:'Koja je tvrdnja o UML-u točna?',o:['UML je jezik za modeliranje. Nije razvojni proces i nije alat.','UML je razvojni proces, kao Scrum ili vodopadni model.','UML je alat za crtanje dijagrama, poput PlantUML-a.','UML propisuje redoslijed faza razvoja programske potpore.'],a:0,e:'Svrha UML-a je specificirati, vizualizirati, konstruirati i dokumentirati artefakte programske potpore. Predavanje naglašava da UML nije razvojni proces (Scrum, vodopad) i nije alat. „Alat crta, a UML definira značenje.”',s:'P04 · UML: svrha, opseg i ograničenja'},
{id:'p4-03',t:'P4',q:'Što prema predavanju govori „pravilo palca 80/20” o UML-u?',o:['Za većinu praktičnih problema dovoljan je mali dio UML-a.','80 % vremena projekta treba trošiti na modeliranje.','UML dijagrami pokrivaju 80 % zahtjeva, a ostatak je kod.','80 % UML dijagrama su strukturni, a 20 % ponašajni.'],a:0,e:'Prema heuristici 80/20 za većinu praktičnih problema dovoljan je mali dio UML-a. Vrijednost nije u broju dijagrama, nego u njihovoj jasnoći i međusobnoj usklađenosti.',s:'P04 · UML: svrha, opseg i ograničenja'},
{id:'p4-04',t:'P4',q:'Koliko strukturnih, ponašajnih i interakcijskih dijagrama navodi taksonomija UML-a s predavanja?',o:['7 strukturnih, 3 ponašajna, 4 interakcijska','4 strukturna, 7 ponašajnih, 3 interakcijska','6 strukturnih, 4 ponašajna, 4 interakcijska','7 strukturnih, 4 ponašajna, 3 interakcijska'],a:0,e:'Strukturni (7): razreda, objekata, paketa, komponenata, složene strukture, razmještaja, profila. Ponašajni (3): obrazaca uporabe, aktivnosti, stanja. Interakcijski (4): sekvencijski, komunikacijski, pregled interakcije, vremenski. Interakcijski dijagrami posebni su podskup ponašajnih.',s:'P04 · Vrste UML dijagrama'},
{id:'p4-05',t:'P4',q:'Koji od navedenih dijagrama NIJE interakcijski dijagram?',o:['Dijagram aktivnosti','Sekvencijski dijagram','Komunikacijski dijagram','Vremenski dijagram'],a:0,e:'Interakcijski dijagrami su sekvencijski, komunikacijski, pregled interakcije i vremenski. Dijagram aktivnosti je ponašajni dijagram koji prikazuje tijek rada, a ne razmjenu poruka među objektima.',s:'P04 · Vrste UML dijagrama; Modeliranje interakcija'},
{id:'p4-06',t:'P4',q:'U kojoj su grupi UML dijagrama dijagram obrazaca uporabe i dijagram stanja?',o:['Ponašajni dijagrami','Strukturni dijagrami','Interakcijski dijagrami','Dijagrami razmještaja'],a:0,e:'Ponašajni dijagrami su obrazaca uporabe, aktivnosti i stanja. Strukturni opisuju statičku strukturu (npr. razreda, komponenata), a interakcijski su podskup ponašajnih koji naglašava razmjenu poruka.',s:'P04 · Vrste UML dijagrama'},
{id:'p4-07',t:'P4',q:'U tablici „jezik, metoda, model, dijagram” što je MODEL?',o:['Apstrakcija koja iskazuje odabrana svojstva sustava, a ostalo skriva','Grafički prikaz dijela modela za određenu svrhu','Standardna sintaksa, semantika i notacija','Postupak koji određuje što modelirati i kako to izvesti'],a:0,e:'Model je apstrakcija koja iskazuje odabrana svojstva, a ostalo skriva. Dijagram je grafički prikaz dijela modela, UML (jezik) daje sintaksu, semantiku i notaciju, a metoda je postupak (npr. FR → UC → SC → SD → TC).',s:'P04 · Jezik, metoda, model i dijagram'},
{id:'p4-08',t:'P4',q:'Lanac FR → UC → SC → SD → TC na predavanju je primjer čega?',o:['Metode: postupka koji kaže što modelirati i kako to izvesti','UML jezika: standardne notacije','Jednog dijagrama obrazaca uporabe','C4 modela arhitekture'],a:0,e:'FR → UC → SC → SD → TC je metoda: od zahtjeva preko obrasca uporabe, scenarija i sekvencijskog dijagrama do ispitnog slučaja. UML sam po sebi ne propisuje razvojni proces.',s:'P04 · Jezik, metoda, model i dijagram; Od zahtjeva do provjere'},
{id:'p4-09',t:'P4',q:'Student je na dijagram obrazaca uporabe nacrtao „Bazu podataka” kao aktera. Dijagram je ispravno nacrtan. Kako to ocijeniti?',o:['Dijagram je sintaktički ispravan, ali semantički pogrešan.','Dijagram je i sintaktički i semantički ispravan.','Dijagram je sintaktički pogrešan, ali semantički ispravan.','Riječ je o pogrešci notacije jer se akter crta kao oval.'],a:0,e:'Sintaksa pita je li dijagram ispravno oblikovan, a semantika što znači. Baza podataka je unutar granice sustava, pa nije akter. Dijagram koji je ispravno nacrtan može značiti nešto pogrešno.',s:'P04 · UML sintaksa, semantika i notacija'},
{id:'p4-10',t:'P4',q:'Što je „pogled” (engl. view) u odnosu sustava, modela, pogleda i dijagrama?',o:['Prikaz sustava iz određene perspektive, npr. pogled dispečera ili ispitivača','Apstrakcija odabranih svojstava sustava','Grafički prikaz odabranih elemenata modela','Pravila i konvencije za oblikovanje dijagrama'],a:0,e:'Pogled je prikaz sustava iz određene perspektive. Model je apstrakcija odabranih svojstava, dijagram je grafički prikaz elemenata modela, a gledište su pravila i konvencije za oblikovanje pogleda.',s:'P04 · Odnosi sustava, modela, pogleda i dijagrama'},
{id:'p4-11',t:'P4',q:'Po čemu se sekvencijski dijagram crne kutije razlikuje od dijagrama bijele kutije?',o:['Crna kutija prikazuje samo aktera i sustav (vanjski ugovor), a bijela kutija unutarnje sudionike i raspodjelu poruka.','Crna kutija se koristi u oblikovanju, a bijela u analizi zahtjeva.','Crna kutija prikazuje samo asinkrone poruke.','Bijela kutija ne smije sadržavati aktera.'],a:0,e:'Crna kutija (npr. Građanin → :LEGIS) prikazuje vanjski ugovor sustava i koristi se u analizi zahtjeva. Bijela kutija prikazuje internu realizaciju (WebUI → ReportController → ReportService → Database) i koristi se u oblikovanju. Preporuka: započeti crnom kutijom i dorađivati do bijele samo gdje je potrebno.',s:'P04 · Načela modeliranja; Sekvencijski dijagrami sustava i oblikovanja'},
{id:'p4-12',t:'P4',q:'Koja je tvrdnja o C4 modelu točna?',o:['C4 prikazuje arhitekturu na četiri razine i nije dio UML-a, ali ga UML dijagrami mogu nadopunjavati.','C4 je dio norme UML 2.5.1.','C4 kontejner uvijek je Docker kontejner.','C4 zamjenjuje dijagram obrazaca uporabe.'],a:0,e:'C4 ima četiri razine: kontekst sustava, kontejneri, komponente i kod. Nije dio UML-a. C4 kontejner je zasebna aplikacijska ili podatkovna cjelina, a ne nužno Docker kontejner.',s:'P04 · C4 model: razine arhitekturne apstrakcije'},
{id:'p4-13',t:'P4',q:'Što prikazuje C4 razina 1 (kontekst sustava) i kome je namijenjena?',o:['Sustav, njegove korisnike i susjedne sustave; svim dionicima','Razrede jednog modula; programerima','Gradivne blokove unutar kontejnera; arhitektima','Fizičke poslužitelje i mreže; administratorima'],a:0,e:'Razina 1 prikazuje sustav, korisnike i susjedne sustave i namijenjena je svima. Razina 2 su kontejneri (tehnički dionici), razina 3 komponente (programeri, arhitekti), a razina 4 kod (programeri, neobvezno).',s:'P04 · C4 model; LEGIS: kontekst sustava (C4 razina 1)'},
{id:'p4-14',t:'P4',q:'Što je obrazac uporabe prema definiciji s predavanja?',o:['Ponašanje sustava (subjekta) koje daje uočljiv rezultat vrijedan za aktera','Jedan konkretan put kroz interakciju aktera i sustava','Funkcija u kodu ili stavka izbornika','Popis svih koraka koje korisnik klikne u sučelju'],a:0,e:'Obrazac uporabe je ponašanje sustava koje daje uočljiv rezultat vrijedan za aktera. Jedan konkretan put kroz obrazac uporabe je scenarij. Obrazac uporabe nije funkcija u kodu niti stavka izbornika, nego cjelovita usluga kojom akter ostvaruje svoj cilj.',s:'P04 · Obrazac uporabe: definicija i temeljni pojmovi'},
{id:'p4-15',t:'P4',q:'Koja je razlika između obrasca uporabe i scenarija?',o:['Scenarij je jedan konkretan put; obrazac uporabe obuhvaća glavni tijek i njegove alternative.','Obrazac uporabe je jedan konkretan put; scenarij grupira više obrazaca.','Nema razlike, to su sinonimi.','Scenarij se crta kao oval, a obrazac uporabe kao tablica.'],a:0,e:'Scenarij je jedan određen slijed (npr. SC-01 uspješna prijava). Obrazac uporabe grupira srodne scenarije, odnosno glavni i alternativne tijekove za isti cilj aktera.',s:'P04 · Obrazac uporabe: definicija; Razrada obrazaca uporabe (koraci 1–2)'},
{id:'p4-16',t:'P4',q:'Što je akter u dijagramu obrazaca uporabe?',o:['Uloga koju ima korisnik ili vanjski sustav u interakciji sa sustavom; uvijek je izvan granice','Konkretna osoba, npr. „Ivan Horvat”','Bilo koji modul unutar sustava','Baza podataka koju sustav koristi'],a:0,e:'Akter je uloga, a ne osoba. Jedna osoba može imati više uloga. Akter je uvijek izvan granice sustava. Baza podataka, zaslon i unutarnji moduli nisu akteri jer su unutar sustava.',s:'P04 · Obrazac uporabe: temeljni pojmovi; Akteri kao uloge'},
{id:'p4-17',t:'P4',q:'Koja je razlika između primarnog i sekundarnog aktera?',o:['Primarni pokreće obrazac uporabe radi svog cilja; sekundarni pruža uslugu sustavu (npr. SMS pristupnik).','Primarni je uvijek čovjek, a sekundarni uvijek računalo.','Primarni se crta lijevo, pa je to njegova definicija.','Sekundarni akter nalazi se unutar granice sustava.'],a:0,e:'Primarni akter pokreće obrazac radi vlastitog cilja (Građanin u UC-01), a sekundarni služi sustavu (npr. SMS pristupnik). Smještanje primarnih lijevo i sekundarnih desno samo je konvencija i ne određuje vrstu aktera.',s:'P04 · Akteri kao uloge; Dodatak: elementi dijagrama obrazaca uporabe'},
{id:'p4-18',t:'P4',q:'Što od navedenog NIJE akter sustava LEGIS?',o:['Baza podataka sustava LEGIS','Dispečer','Građanin','Vanjski pružatelj karata (ako se koristi)'],a:0,e:'Baza podataka je unutar granice sustava LEGIS, pa nije akter. Građanin i dispečer su akteri (uloge), a pružatelj karata može biti sekundarni akter kao vanjska usluga.',s:'P04 · LEGIS: prepoznavanje aktera i obrazaca uporabe'},
{id:'p4-19',t:'P4',q:'Koji je naziv obrasca uporabe dobre granularnosti?',o:['UC-01 Podnošenje prijave','Klikni Spremi','Dodaj / uredi / obriši prijavu','Spremi prijavu u bazu'],a:0,e:'„Klikni Spremi” je korak scenarija, CRUD su funkcije nad podacima bez cilja korisnika, a „Spremi prijavu u bazu” je implementacijska pojedinost. Dobar obrazac uporabe je cilj aktera, imenovan glagolsko-imeničkom frazom.',s:'P04 · Granularnost obrazaca uporabe: ciljevi i koraci'},
{id:'p4-20',t:'P4',q:'Zašto je „Upravljanje prijavama i događajima” loš obrazac uporabe?',o:['Preširok je i obuhvaća više ciljeva, pa ga treba razdvojiti (npr. UC-01, UC-02, UC-05).','Preuzak je jer opisuje samo jedan klik.','Sadrži implementacijski detalj o bazi.','Nije napisan u prvom licu.'],a:0,e:'Prema tablici granularnosti, „Upravljanje prijavama i događajima” je preširoko jer spaja više ciljeva, pa ga treba razdvojiti na UC-01, UC-02 i UC-05. Provjerava se je li ishod smislen za aktera, koherentan i izvana prepoznatljiv.',s:'P04 · Granularnost obrazaca uporabe'},
{id:'p4-21',t:'P4',q:'Na kojoj razini apstrakcije treba uobičajeno modelirati obrasce uporabe?',o:['Na razini cilja korisnika: jedan cilj, jedna sjednica','Na razini sažetka: više ciljeva tijekom vremena','Na razini podfunkcije: zajednički dijelovi','Na razini pojedinačnih klikova'],a:0,e:'Razine su sažetak (više ciljeva, npr. obraditi događaj od početka do kraja), cilj korisnika (uobičajena razina, npr. UC-01) i podfunkcija (zajednički dio, npr. UC-06 Provjera lokacije). Modelira se na razini cilja korisnika, a pojedinosti ostaju u scenariju.',s:'P04 · Razine apstrakcije obrazaca uporabe'},
{id:'p4-22',t:'P4',q:'Koja je tvrdnja o preslikavanju funkcijskih zahtjeva u obrasce uporabe točna?',o:['Jedan obrazac uporabe može pokrivati više zahtjeva, a svaki zahtjev treba se pojaviti u nekom obrascu uporabe.','Svaki funkcijski zahtjev mora biti točno jedan obrazac uporabe.','Obrasci uporabe pokrivaju samo nefunkcijske zahtjeve.','Zahtjeve ne treba povezivati s obrascima uporabe.'],a:0,e:'Zahtjeve ne treba preslikavati jedan-na-jedan. Npr. UC-02 Procjena hitnosti i dodjela ekipe pokriva FR-03 i FR-04. Ipak, svaki zahtjev mora biti pokriven nekim obrascem uporabe (sljedivost).',s:'P04 · Izvođenje obrazaca uporabe iz zahtjeva'},
{id:'p4-23',t:'P4',q:'Što dijagram obrazaca uporabe NE prikazuje?',o:['Redoslijed koraka scenarija','Tko koristi sustav','Koji su ciljevi podržani','Što je unutar, a što izvan granice sustava'],a:0,e:'Dijagram obrazaca uporabe prikazuje tko koristi sustav, koji su ciljevi podržani i granicu sustava. Izostavlja redoslijed koraka (to je scenarij ili sekvencijski dijagram), zaslone, tehnologiju, strukture podataka i detaljne zahtjeve kvalitete.',s:'P04 · Informacije koje prenose dijagrami obrazaca uporabe'},
{id:'p4-24',t:'P4',q:'Od koja se dva dijela sastoji model obrazaca uporabe?',o:['Od dijagrama obrazaca uporabe i tekstualnih specifikacija obrazaca uporabe','Od dijagrama razreda i sekvencijskog dijagrama','Od korisničkih priča i Kanban ploče','Od scenarija i dijagrama razmještaja'],a:0,e:'Model obrazaca uporabe ima dijagram (granica sustava, akteri, obrasci uporabe) i tekstualne specifikacije (tijek događaja, uvjeti, alternativni tijekovi). „Tekst daje značenje ovalu; sam dijagram nije dokumentacija.”',s:'P04 · Model obrazaca uporabe: dijagram i specifikacije'},
{id:'p4-25',t:'P4',q:'Koji je prvi korak razrade obrazaca uporabe prema Brueggeu i Dutoitu?',o:['Identificiranje aktera','Identificiranje početnih objekata analize','Identificiranje odnosa include i extend','Dorada obrazaca uporabe'],a:0,e:'Redoslijed je: 1. akteri, 2. scenariji, 3. obrasci uporabe, 4. dorada, 5. odnosi među akterima i obrascima, 6. početni objekti analize. Postupak je iterativan.',s:'P04 · Prepoznavanje i razrada obrazaca uporabe'},
{id:'p4-26',t:'P4',q:'Što je šesti korak razrade obrazaca uporabe prema Brueggeu i Dutoitu?',o:['Određivanje početnih objekata analize (domenskih pojmova)','Identificiranje scenarija','Određivanje višestrukosti','Pisanje programskog koda'],a:0,e:'U šestom koraku iz scenarija i teksta obrazaca uporabe izdvajaju se imenice kao kandidati za domenske pojmove (sudjelujući objekti). Za LEGIS to su prijava, događaj, intervencija, ekipa i razina hitnosti.',s:'P04 · Izlučivanje zahtjeva: početni objekti analize (korak 6)'},
{id:'p4-27',t:'P4',q:'Kako se u specifikaciji obrasca uporabe numeriraju alternativni tijekovi?',o:['Prema koraku glavnog tijeka od kojeg odstupaju, npr. 2a, 3a','Nastavljaju brojeve glavnog tijeka, npr. 5, 6, 7','Slovima A, B, C bez veze s glavnim tijekom','Ne numeriraju se'],a:0,e:'Alternativni tijekovi numeriraju se prema koraku od kojeg odstupaju. Primjer: 2a znači da je lokacija nevaljana u koraku 2, a 3a da pohrana nije uspjela u koraku 3.',s:'P04 · Struktura specifikacije obrasca uporabe'},
{id:'p4-28',t:'P4',q:'Što polje „Postuvjeti” u specifikaciji obrasca uporabe treba sadržavati?',o:['Minimalno jamstvo i jamstvo uspjeha','Popis zaslona korisničkog sučelja','Okidač koji pokreće obrazac','Popis razreda u kodu'],a:0,e:'Postuvjeti opisuju minimalno jamstvo i jamstvo uspjeha. Za UC-01 to je „prijava je spremljena i sljediva”; „zahtjev poslan” nije dovoljno. Okidač i preduvjeti su zasebna polja.',s:'P04 · Struktura specifikacije obrasca uporabe; UC-01: glavni tijek'},
{id:'p4-29',t:'P4',q:'UC-01 Podnošenje prijave, alternativni tijek 3a: pohrana ne uspije. Što sustav treba učiniti?',o:['Ne potvrđuje prijavu, kaže građaninu da pokuša ponovno i ne izdaje kod za praćenje.','Prikazuje kod za praćenje i kasnije ponovno pokušava spremiti prijavu.','Potvrđuje prijavu jer je zahtjev poslan.','Prosljeđuje prijavu dispečeru bez spremanja.'],a:0,e:'Kod 3a sustav ne potvrđuje i nema koda za praćenje. Izostanak koda pri neuspješnoj pohrani jednako je važan kao uspješan tijek.',s:'P04 · UC-01: alternativni tijekovi podnošenja prijave'},
{id:'p4-30',t:'P4',q:'Otvoreno pitanje Q-01 (anonimna prijava naspram obveznih kontaktnih podataka) u UC-01 je neriješeno. Kako postupiti?',o:['Ostaviti ga kao otvorenu stavku i ne izmišljati pravilo','Odlučiti sam da je prijava uvijek anonimna','Ukloniti obrazac uporabe dok se ne odluči','Napisati to kao funkcijski zahtjev visokog prioriteta'],a:0,e:'Predavanje kaže: „Nije odlučeno; ne izmišljati pravilo.” Otvorena pitanja (Q-xx) bilježe se i rješavaju s naručiteljem. Otvorena pitanja nisu dopuštenje da samostalno uvedemo konačna poslovna pravila.',s:'P04 · UC-01: alternativni tijekovi; P06 · LEGIS: polazni opis'},
{id:'p4-31',t:'P4',q:'Što znači odnos «include» između obrazaca uporabe?',o:['Obuhvaćeno ponašanje je obvezno i uvijek se izvodi kao dio osnovnog obrasca.','Ponašanje se izvodi samo ako je ispunjen uvjet.','Specijalizirani obrazac nasljeđuje opći.','Akter komunicira s obrascem uporabe.'],a:0,e:'«include» znači obvezno obuhvaćeno ponašanje: osnovni obrazac ovisi o obuhvaćenom i on se uvijek izvodi. Koristi se za zajedničko ponašanje i uklanjanje redundancije. Strelica ide od osnovnog prema obuhvaćenom.',s:'P04 · Tumačenje odnosa obrazaca uporabe; Kriteriji za odnose'},
{id:'p4-32',t:'P4',q:'U kojem smjeru ide strelica odnosa «extend»?',o:['Od obrasca proširenja prema osnovnom obrascu','Od osnovnog obrasca prema obrascu proširenja','Od aktera prema obrascu uporabe','Dvosmjerno'],a:0,e:'«extend»: iscrtkana otvorena strelica od proširenja prema osnovnom obrascu. Kod «include» strelica ide od osnovnog prema obuhvaćenom. Osnovni obrazac ne ovisi o proširenju.',s:'P04 · Odnosi obrazaca uporabe i višestrukost (Dodatak)'},
{id:'p4-33',t:'P4',q:'Tvrdnja: „LEGIS uvijek provjerava lokaciju prije spremanja prijave.” Koji je odnos prikladan?',o:['«include»','«extend»','Poopćenje','Nikakav, to je samo korak scenarija'],a:0,e:'Riječ „uvijek” upućuje na obvezno ponašanje, dakle «include» (UC-01 → UC-06 Provjera lokacije prijave). Ovo je zadatak A iz vježbe na predavanju.',s:'P04 · Vježba: odabir odnosa obrazaca uporabe'},
{id:'p4-34',t:'P4',q:'Tvrdnja: „Ako procjena pokaže da jedna ekipa nije dovoljna, dispečer dodaje još jednu ekipu.” Koji je odnos prikladan?',o:['«extend»','«include»','Poopćenje','Asocijacija među obrascima uporabe'],a:0,e:'Ponašanje je uvjetno („ako…”), pa se modelira s «extend». UC-08 Dodjela dodatne ekipe proširuje UC-02 na točki proširenja „Dodjela ekipe”.',s:'P04 · «extend»: uvjetno proširenje ponašanja; Vježba'},
{id:'p4-35',t:'P4',q:'Tvrdnja: „Građanin unosi opis događaja.” Kako je modelirati?',o:['Kao korak scenarija, bez zasebnog obrasca uporabe i odnosa','Kao «include» obrazac „Unos opisa”','Kao «extend» obrazac „Unos opisa”','Kao poopćenje aktera Građanin'],a:0,e:'Unos opisa je korak scenarija unutar UC-01, a ne cilj aktera. «include» nije opći alat za razlaganje cilja na korake.',s:'P04 · Vježba: odabir odnosa; Kriteriji za odnose obrazaca uporabe'},
{id:'p4-36',t:'P4',q:'Koje je pitanje kriterij za odnos poopćenja između obrazaca uporabe ili aktera?',o:['Je li jedan element „vrsta” drugoga?','Je li ponašanje obvezno?','Je li ponašanje uvjetno, s uvjetom i točkom proširenja?','Komunicira li akter s obrascem?'],a:0,e:'Kriteriji s predavanja: «include» – je li obuhvaćeno ponašanje obvezno; «extend» – je li uvjetno, s uvjetom i točkom proširenja; poopćenje – je li jedno „vrsta” drugoga (strelica od specijaliziranog prema općem).',s:'P04 · Kriteriji za odnose obrazaca uporabe'},
{id:'p4-37',t:'P4',q:'Što prema nastavnoj konvenciji kolegija vrijedi za alternativne tijekove i pogreške?',o:['Opisuju se ponajprije u specifikaciji; «extend» se koristi za izdvojeno uvjetno proširenje.','Svaka pogreška mora biti zaseban obrazac s «extend».','Pogreške se crtaju kao akteri.','Alternativni tijekovi se ne dokumentiraju.'],a:0,e:'Nastavna konvencija: «extend» se primjenjuje za izdvojeno uvjetno proširenje, a alternativni tijekovi i pogreške ponajprije se opisuju u specifikaciji. Bruegge i Dutoit koriste «extend» i za iznimne slučajeve. «extend» nije zamjena za opis alternativnih tijekova.',s:'P04 · «extend»: uvjetno proširenje; Terminologija obrazaca uporabe'},
{id:'p4-38',t:'P4',q:'Što prema predavanju znači višestrukost na asocijaciji aktera i obrasca uporabe (npr. Ekipa 1..*)?',o:['Koliko instanci aktera sudjeluje u jednom izvođenju obrasca','Koliko se često obrazac uporabe izvodi','Koliko obrazaca uporabe akter smije imati','Redoslijed izvođenja obrazaca'],a:0,e:'Višestrukost kazuje koliko instanci aktera sudjeluje u jednom izvođenju, a ne koliko se često obrazac izvodi. Dodaje se samo ako nameće ključno ograničenje.',s:'P04 · Odnosi obrazaca uporabe i višestrukost (Dodatak)'},
{id:'p4-39',t:'P4',q:'Što na dijagramu obrazaca uporabe NIJE dopušteno?',o:['Asocijacija između dvaju obrazaca uporabe i strelice koje prikazuju redoslijed','Poopćenje između dvaju aktera','«include» između dvaju obrazaca uporabe','Asocijacija između aktera i obrasca uporabe'],a:0,e:'Prema tablici iz dodatka, asocijacija među obrascima uporabe i strelice koje prikazuju redoslijed nisu dopuštene. Odnosi se biraju prema značenju, a ne radi pretvaranja procesa u dijagram toka.',s:'P04 · Odnosi obrazaca uporabe i višestrukost (Dodatak)'},
{id:'p4-40',t:'P4',q:'Što u sekvencijskom dijagramu izražava okomiti položaj poruka?',o:['Redoslijed događaja, a ne vremensku skalu','Točno vrijeme u sekundama','Prioritet poruke','Broj objekata koji primaju poruku'],a:0,e:'Okomiti položaj izražava redoslijed, a ne vremensku skalu. Redoslijed je zajamčen uzduž svake životne linije i između slanja i primanja iste poruke, a ne među različitim životnim linijama.',s:'P04 · Sekvencijski dijagrami: definicija i semantika'},
{id:'p4-41',t:'P4',q:'Kako se crta sinkrona poruka u UML sekvencijskom dijagramu?',o:['Puna linija s ispunjenom strelicom','Puna linija s otvorenom strelicom','Iscrtkana linija s otvorenom strelicom','Iscrtkana linija prema zaglavlju sudionika'],a:0,e:'Sinkrona poruka je puna linija s ispunjenom strelicom; pošiljatelj čeka dovršetak. Puna linija s otvorenom strelicom je asinkrona poruka, iscrtkana s otvorenom strelicom je odgovor, a iscrtkana strelica prema zaglavlju je stvaranje.',s:'P04 · Vrste poruka u UML-u i njihova notacija'},
{id:'p4-42',t:'P4',q:'Što vrijedi za asinkronu poruku?',o:['Pošiljatelj može nastaviti bez čekanja da primatelj završi.','Pošiljatelj uvijek čeka odgovor.','Crta se iscrtkanom linijom.','Označava uništenje objekta.'],a:0,e:'Kod asinkrone poruke (puna linija, otvorena strelica) pošiljatelj nastavlja bez čekanja. Kod sinkrone čeka završetak pozvanog ponašanja.',s:'P04 · Sinkrone, asinkrone i povratne poruke'},
{id:'p4-43',t:'P4',q:'Kako se u sekvencijskom dijagramu označava kraj životne linije (uništenje sudionika)?',o:['Znakom X na kraju životne linije','Ispunjenim krugom na kraju strelice','Iscrtkanom strelicom prema zaglavlju','Debljom trakom aktivacije'],a:0,e:'X označava završetak životne linije. Ispunjen krug na otvorenom kraju označava pronađenu ili izgubljenu poruku, a iscrtkana strelica prema zaglavlju stvaranje sudionika.',s:'P04 · Stvaranje, uništenje i vremenska ograničenja; Vrste poruka'},
{id:'p4-44',t:'P4',q:'Što označava „izgubljena” ili „pronađena” poruka?',o:['Poruku kojoj pošiljatelj ili primatelj nije poznat (ispunjen krug na kraju)','Poruku koja se ponavlja u petlji','Poruku koju objekt šalje samome sebi','Poruku s vremenskim ograničenjem'],a:0,e:'Pronađena i izgubljena poruka imaju ispunjen krug na otvorenom kraju, a pošiljatelj ili primatelj je nepoznat. Prema priručniku izgubljena poruka nema primatelja, a pronađena nema poznatog pošiljatelja.',s:'P04 · Vrste poruka (Dodatak); Priručnik 4.1.1 Poruke'},
{id:'p4-45',t:'P4',q:'Koliko se operanada izvodi u kombiniranom fragmentu alt?',o:['Točno jedan operand','Svi operandi istodobno','Nijedan ili jedan','Svi operandi redom'],a:0,e:'alt izvodi točno jedan operand (if-then-else). opt izvodi fragment samo ako je uvjet istinit, loop ponavlja, a par izvodi operande isprepleteno.',s:'P04 · Kombinirani fragmenti i upućivanje na interakciju'},
{id:'p4-46',t:'P4',q:'Koji kombinirani fragment omogućuje ponovnu uporabu drugog sekvencijskog dijagrama (npr. obuhvatiti slijed dodjele SD-02)?',o:['ref','alt','par','break'],a:0,e:'ref upućuje na drugu interakciju i služi ponovnoj uporabi. Smjernica: držati se jednog scenarija po dijagramu, velike podijeliti i koristiti ref.',s:'P04 · Kombinirani fragmenti; Smjernice za modeliranje interakcija'},
{id:'p4-47',t:'P4',q:'Koji operator interakcije označava nevaljane tragove?',o:['neg','critical','assert','strict'],a:0,e:'neg označava nevaljane tragove (ono što se ne smije dogoditi). critical je područje koje se ne smije isprepletati, assert zahtijevano ponašanje, a strict strogi redoslijed.',s:'P04 · Napredni operatori interakcije (Dodatak); Priručnik 4.1.2'},
{id:'p4-48',t:'P4',q:'Što predavanje navodi kao „najčešću studentsku pogrešku” u sekvencijskim dijagramima?',o:['Potvrditi uspjeh korisniku prije nego što repozitorij potvrdi spremanje','Koristiti fragment alt umjesto opt','Imenovati poruke glagolima','Crtati aktera kao čovječuljka'],a:0,e:'Najčešća pogreška je reći korisniku „gotovo” prije nego što su podaci sigurni. Uspjeh se potvrđuje tek nakon odgovora repozitorija, a dodaje se i alt grana za neuspjeh.',s:'P04 · Ispravljanje redoslijeda potvrde pohrane'},
{id:'p4-49',t:'P4',q:'Koja je smjernica za modeliranje interakcija ispravna?',o:['Sudionike birati prema odgovornostima, ne za svaki razred; jedan scenarij po dijagramu','Na jedan dijagram staviti sve scenarije sustava','Prvo modelirati alternative, a glavni put na kraju','Ne prikazivati odgovore'],a:0,e:'Smjernice: definirati kontekst (scenarij, obrazac uporabe), birati sudionike prema odgovornostima, najprije glavni put pa važne alternative, imenovati poruke kao operacije ili događaje i prikazati odgovore, jedan scenarij po dijagramu (ref za velike).',s:'P04 · Smjernice za modeliranje interakcija'},
{id:'p4-50',t:'P4',q:'Kako se korak 2 scenarija SC-01 preslikava u numeraciju poruka sekvencijskog dijagrama?',o:['U poruke 2.1, 2.2 …','U poruku 2a','U poruke A, B, C','Numeriranje nije dopušteno u UML-u'],a:0,e:'Korak scenarija n postaje poruke n.1, n.2. Numeriranje nije obvezno u UML-u, a u PlantUML-u se može uključiti naredbom autonumber.',s:'P04 · Sintaksa poruka i konvencije numeriranja'},
{id:'p4-51',t:'P4',q:'Kako status artefakta u sljedivosti napreduje prema predavanju?',o:['kandidat → nacrt → implementirano → provjereno','nacrt → kandidat → provjereno → implementirano','implementirano → nacrt → provjereno','planirano → gotovo'],a:0,e:'Status se prati za svaki zahtjev ili artefakt: kandidat → nacrt → implementirano → provjereno. Postojanje dijagrama nije dokaz implementacije, a „planirano” ne znači „učinjeno”.',s:'P04 · Sljedivost zahtjeva od početka do kraja'},
{id:'p4-52',t:'P4',q:'Koja je provjera konzistentnosti među modelima navedena na predavanju?',o:['Pojavljuju li se iste uloge (akteri) u dijagramu obrazaca uporabe i u sekvencijskom dijagramu','Ima li svaki dijagram barem deset elemenata','Jesu li svi dijagrami nacrtani istim alatom','Jesu li svi obrasci uporabe povezani s «extend»'],a:0,e:'Provjerava se: isti akteri u UC i SD, koji je alternativni tijek prikazan, preslikavaju li se koraci u poruke, pokriva li svaki FR neki UC, isti ID i naziv u tekstu, dijagramu i kodu, razdvojenost pojmova (prijava, događaj, intervencija) te status.',s:'P04 · Provjera konzistentnosti među modelima'},
{id:'p4-53',t:'P4',q:'Što je „dokumentacija kao kod” (docs-as-code)?',o:['Dokumentacija i dijagrami pišu se kao običan tekst (npr. PlantUML, Markdown) i čuvaju u Git repozitoriju uz kod','Komentari u izvornom kodu zamjenjuju svu dokumentaciju','Dokumentacija se piše u Wordu i šalje e-poštom','Dokumentacija se generira isključivo iz baze podataka'],a:0,e:'Dijagrami se pišu kao tekst (PlantUML, Mermaid), žive u Gitu (npr. mapa docs) i pregledavaju se u zahtjevima za uključivanje promjena (PR). To olakšava usklađivanje, ali ne jamči automatsku usklađenost s kodom.',s:'P04 · Tradicionalna dokumentacija i dokumentacija kao kod; Dodatak'},
{id:'p4-54',t:'P4',q:'U PlantUML-u, što prikazuje zapis `UC02 ..> UC07 : <<include>>`?',o:['Iscrtkanu strelicu odnosa «include» od UC02 prema UC07','Asocijaciju aktera i obrasca uporabe','Poopćenje UC07 prema UC02','Sinkronu poruku u sekvencijskom dijagramu'],a:0,e:'U PlantUML-u `--` prikazuje pridruživanje, a `..>` usmjereni iscrtkani odnos kao što su «include» i «extend». PlantUML iscrtava dijagram, ali ne provjerava semantičku opravdanost odnosa.',s:'P04 · Sintaksa dijagrama obrazaca uporabe – PlantUML'},
{id:'p4-55',t:'P4',q:'Tko su „tri amigosa” čije su metode ujedinjene u UML?',o:['Grady Booch, James Rumbaugh i Ivar Jacobson','Kent Beck, Ward Cunningham i Ron Jeffries','Barry Boehm, Winston Royce i Fred Brooks','Simon Brown, Philippe Kruchten i Len Bass'],a:0,e:'UML je nastao sredinom 1990-ih ujedinjavanjem metoda Booch (Grady Booch), OMT (James Rumbaugh) i OOSE (Ivar Jacobson). Beck, Cunningham i Jeffries vezani su uz XP.',s:'P04 · UML: podrijetlo i standardizacija'},
{id:'p4-56',t:'P4',q:'Što je „sudionik” (engl. participant) u sekvencijskom dijagramu i što NE bi smio biti?',o:['Akter ili dio sustava; ne smije biti korak procesa','Korak procesa; ne smije biti akter','Poruka; ne smije biti objekt','Fragment; ne smije biti životna linija'],a:0,e:'Sudionici su samo akteri i dijelovi sustava (okvir „naziv:Tip”), a ne koraci procesa. Akter u SD treba biti ista uloga kao u dijagramu obrazaca uporabe.',s:'P04 · Sekvencijski dijagrami: struktura i sudionici (Dodatak)'},
{id:'p4-57',t:'P4',q:'Što označava traka aktivacije (izvršavanje) na životnoj liniji?',o:['Razdoblje tijekom kojeg se ponašanje izvodi','Vrijeme postojanja objekta u bazi','Uvjet fragmenta alt','Vremensko ograničenje poruke'],a:0,e:'Aktivacija (tanka traka) prikazuje razdoblje izvođenja operacije, ugniježđena kod poziva samoga sebe. Životna linija je iscrtkana okomita linija koja prikazuje postojanje sudionika.',s:'P04 · Elementi sekvencijskog dijagrama'},
{id:'p4-58',t:'P4',q:'Što prema predavanju vrijedi za vremenska ograničenja, stvaranje i uništenje u sekvencijskom dijagramu?',o:['Korisni su elementi notacije, ali se prikazuju samo kada su relevantni.','Obvezni su na svakom sekvencijskom dijagramu.','Zabranjeni su u fazi analize zahtjeva.','Zamjenjuju fragmente alt i opt.'],a:0,e:'Stvaranje, uništenje i vremenska ograničenja (npr. {duration ≤ 2 s}) prikazuju se samo kada su relevantni, odnosno kada je ograničenje zadano.',s:'P04 · Stvaranje, uništenje i vremenska ograničenja'},
{id:'p4-59',t:'P4',q:'Iz čega se izvode ispitni slučajevi prema predavanju o UML-u?',o:['Iz glavnog i alternativnih tijekova scenarija','Samo iz dijagrama razreda','Iz broja dijagrama u dokumentaciji','Iz popisa zaslona'],a:0,e:'Glavni i alternativni tijekovi osnova su za ispitne slučajeve, npr. SC-01 glavni tijek → TC-01, SC-01 alt 2a → TC-02 nevaljano podnošenje. Za svaki se određuju početni uvjeti, ulazi, koraci i očekivani rezultati.',s:'P04 · Izvođenje ispitnih slučajeva iz scenarija'},
{id:'p4-60',t:'P4',q:'Što od navedenog NIJE tehnika izlučivanja zahtjeva navedena u predavanju o UML-u?',o:['Generiranje koda iz dijagrama razreda','Intervjui','Radionice i oluja ideja','Promatranje postojećih procesa'],a:0,e:'Tehnike izlučivanja su intervjui, radionice i oluja ideja, promatranje postojećih procesa i analiza postojećih dokumenata. Model se zatim validira s dionicima.',s:'P04 · Tehnike izlučivanja i validacija zahtjeva'},

/* ---- pitanja s dijagramima ---- */
{id:'p4-d01',t:'P4',q:'Što znači odnos prikazan na dijagramu?',dg:{type:'uc',sys:'LEGIS',actors:[{id:'g',n:'Građanin'}],uc:[{id:'u1',n:'UC-01 Podnošenje prijave'},{id:'u6',n:'UC-06 Provjera lokacije prijave'}],rel:[{f:'g',t:'u1'},{f:'u1',t:'u6',k:'i'}]},o:['UC-06 se uvijek izvodi kao dio UC-01.','UC-06 se izvodi samo ako je lokacija nevaljana.','UC-01 je posebna vrsta UC-06.','Građanin izravno pokreće UC-06.'],a:0,e:'Iscrtkana strelica s «include» od osnovnog (UC-01) prema obuhvaćenom (UC-06) znači obvezno ponašanje: provjera lokacije uvijek se izvodi pri podnošenju prijave.',s:'P04 · «include»: obvezno obuhvaćeno ponašanje'},
{id:'p4-d02',t:'P4',q:'Koja je tvrdnja o prikazanom dijagramu točna?',dg:{type:'uc',sys:'LEGIS',actors:[{id:'d',n:'Dispečer'}],uc:[{id:'u2',n:'UC-02 Procjena hitnosti i dodjela ekipe'},{id:'u8',n:'UC-08 Dodjela dodatne ekipe'}],rel:[{f:'d',t:'u2'},{f:'u8',t:'u2',k:'e'}],w:640,notes:[{x:482,y:150,w:130,h:44,t:'uvjet: jedna ekipa nije dovoljna'}]},o:['UC-08 se izvodi samo kada je uvjet ispunjen, a UC-02 ne ovisi o UC-08.','UC-08 se izvodi uvijek kada se izvodi UC-02.','UC-02 je dio UC-08.','Strelica je pogrešno usmjerena; treba ići od UC-02 prema UC-08.'],a:0,e:'«extend» se crta iscrtkanom strelicom od proširenja (UC-08) prema osnovnom obrascu (UC-02). Proširenje se izvodi samo kada je uvjet istinit, na imenovanoj točki proširenja. Osnovni obrazac ne smije „znati” za svoja proširenja.',s:'P04 · «extend»: uvjetno proširenje ponašanja'},
{id:'p4-d03',t:'P4',q:'Koja je pogreška na ovom dijagramu obrazaca uporabe?',dg:{type:'uc',sys:'LEGIS',actors:[{id:'g',n:'Građanin'},{id:'b',n:'Baza podataka',side:'R'}],uc:[{id:'u1',n:'UC-01 Podnošenje prijave'}],rel:[{f:'g',t:'u1'},{f:'u1',t:'b'}]},o:['Baza podataka nije akter jer je unutar sustava LEGIS.','Građanin mora biti unutar granice sustava.','Obrazac uporabe treba biti nacrtan kao pravokutnik.','Asocijacija mora biti iscrtkana.'],a:0,e:'Baza podataka je unutar granice sustava, pa nije akter. To je sintaktički ispravan, ali semantički pogrešan dijagram.',s:'P04 · Vježba: otkrivanje pogrešaka modeliranja'},
{id:'p4-d04',t:'P4',q:'Analitičar je htio reći da se provjera lokacije UVIJEK izvodi pri podnošenju prijave. Što je pogrešno?',dg:{type:'uc',sys:'LEGIS',actors:[{id:'g',n:'Građanin'}],uc:[{id:'u1',n:'UC-01 Podnošenje prijave'},{id:'u6',n:'UC-06 Provjera lokacije prijave'}],rel:[{f:'g',t:'u1'},{f:'u6',t:'u1',k:'i'}]},o:['Strelica «include» je obrnuta; mora ići od osnovnog (UC-01) prema obuhvaćenom (UC-06).','Treba koristiti «extend» jer je ponašanje obvezno.','Građanin mora biti povezan s UC-06.','Ništa, dijagram je ispravan.'],a:0,e:'Obrnuto usmjerena strelica «include» navedena je među tipičnim pogreškama. Ispravno je osnovni → obuhvaćeni, tj. UC-01 ..> UC-06.',s:'P04 · Vježba: otkrivanje pogrešaka modeliranja'},
{id:'p4-d05',t:'P4',q:'Što prikazuje ovaj dijagram?',dg:{type:'uc',sys:'LEGIS',actors:[{id:'d',n:'Dispečer',row:1},{id:'c',n:'Član osoblja',row:0}],uc:[{id:'u9',n:'Prijava u sustav',row:0},{id:'u2',n:'UC-02 Procjena hitnosti i dodjela ekipe',row:1}],rel:[{f:'c',t:'u9'},{f:'d',t:'u2'},{f:'d',t:'c',k:'g'}]},o:['Dispečer je specijalizirani akter i nasljeđuje sudjelovanje općeg aktera Član osoblja.','Član osoblja nasljeđuje sva prava Dispečera.','Dispečer uključuje (include) Člana osoblja.','Član osoblja i Dispečer su ista osoba.'],a:0,e:'Poopćenje aktera crta se punom linijom sa šupljim trokutom prema općem akteru. Specijalizirani akter (Dispečer) nasljeđuje sudjelovanje opće uloge (npr. Prijava u sustav) i dodaje svoje (UC-02).',s:'P04 · Poopćenje aktera; Tumačenje odnosa obrazaca uporabe'},
{id:'p4-d06',t:'P4',q:'Što je glavni problem ovog modela obrazaca uporabe?',dg:{type:'uc',sys:'LEGIS',actors:[{id:'g',n:'Građanin'}],uc:[{id:'a',n:'Dodaj prijavu'},{id:'b',n:'Uredi prijavu'},{id:'c',n:'Obriši prijavu'}],rel:[{f:'g',t:'a'},{f:'g',t:'b'},{f:'g',t:'c'}]},o:['Obrasci su CRUD funkcije nad podacima bez cilja korisnika; bolje je UC-01 Podnošenje prijave.','Nedostaje «include» između obrazaca.','Građanin treba biti sekundarni akter.','Obrasci uporabe moraju imati vremenski redoslijed.'],a:0,e:'„Dodaj / uredi / obriši prijavu (CRUD)” su funkcije nad podacima bez cilja korisnika. Modelira se cilj aktera, npr. UC-01 Podnošenje prijave.',s:'P04 · Granularnost obrazaca uporabe; Vježba: pogreške modeliranja'},
{id:'p4-d07',t:'P4',q:'Što znači oznaka 1..* uz aktera Ekipa?',dg:{type:'uc',sys:'LEGIS',actors:[{id:'d',n:'Dispečer'},{id:'e',n:'Ekipa',side:'R'}],uc:[{id:'u2',n:'UC-02 Procjena hitnosti i dodjela ekipe'}],rel:[{f:'d',t:'u2'},{f:'e',t:'u2',m1:'1..*'}]},o:['U jednom izvođenju UC-02 sudjeluje jedna ili više ekipa.','UC-02 se izvodi jednom ili više puta dnevno.','Ekipa smije pokrenuti UC-02 najviše jednom.','Ekipa je opcionalna u UC-02.'],a:0,e:'Višestrukost na asocijaciji akter–obrazac znači koliko instanci aktera sudjeluje u jednom izvođenju, a ne koliko se često izvodi. U PlantUML primjeru s predavanja: T "1..*" -- UC02.',s:'P04 · Odnosi obrazaca uporabe i višestrukost; Sintaksa – PlantUML'},
{id:'p4-d08',t:'P4',q:'Koja je vrsta ovog sekvencijskog dijagrama?',dg:{type:'seq',p:[{id:'g',n:'Građanin',a:1},{id:'s',n:':LEGIS'}],m:[{f:'g',t:'s',l:'submit(type, location, description)'},{f:'s',t:'g',l:'potvrda(kod za praćenje)',k:'r'}]},o:['Sekvencijski dijagram sustava (crna kutija), prikladan za analizu zahtjeva','Sekvencijski dijagram oblikovanja (bijela kutija)','Dijagram komunikacije','Dijagram aktivnosti'],a:0,e:'Prikazani su samo akter i sustav kao cjelina, dakle vanjski ugovor (crna kutija). Bijela kutija bi prikazala unutarnje sudionike (sučelje, kontroler, usluga, repozitorij).',s:'P04 · LEGIS: sekvencijski dijagram sustava (SC-01)'},
{id:'p4-d09',t:'P4',q:'Što je pogrešno u ovom sekvencijskom dijagramu?',dg:{type:'seq',p:[{id:'g',n:'Građanin',a:1},{id:'w',n:'Web'},{id:'r',n:'Repository'}],m:[{f:'g',t:'w',l:'submit(data)'},{f:'w',t:'g',l:'uspjeh!',k:'r'},{f:'w',t:'r',l:'save()'}]},o:['Uspjeh se potvrđuje prije pohrane; potvrda mora uslijediti tek nakon odgovora repozitorija.','Građanin ne smije slati poruke sustavu.','Poruka save() mora biti asinkrona.','Repository mora biti akter.'],a:0,e:'Ovo je antipattern s predavanja: sustav kaže „uspjeh” prije save(). Ako baza zakaže, korisnik misli da je prijava spremljena. Ispravno je potvrditi nakon odgovora repozitorija i dodati alt granu za neuspjeh.',s:'P04 · Vježba: dijagnosticiranje pogrešaka u SD'},
{id:'p4-d10',t:'P4',q:'Koliko se grana fragmenta izvodi u jednom prolasku kroz ovaj dijagram?',dg:{type:'seq',p:[{id:'g',n:'Građanin',a:1},{id:'c',n:'ReportController'},{id:'s',n:'ReportService'}],m:[{f:'g',t:'c',l:'POST /reports'},{f:'c',t:'s',l:'submitReport(data)'},{fr:'alt',g:'[lokacija valjana]'},{f:'s',t:'c',l:'report',k:'r'},{f:'c',t:'g',l:'201 Created',k:'r'},{el:'[lokacija nevaljana]'},{f:'s',t:'c',l:'pogreška validacije',k:'r'},{f:'c',t:'g',l:'400 Bad Request',k:'r'},{end:1}]},o:['Točno jedna, ovisno o tome je li lokacija valjana','Obje, jedna za drugom','Obje, paralelno','Nijedna ako je lokacija valjana'],a:0,e:'U fragmentu alt izvodi se točno jedan operand, ona grana čiji je uvjet istinit. Ovo je SD-01 s alternativnim tijekom 2a (nevaljana lokacija).',s:'P04 · SD-01: SD s alternativnim tijekom; Kombinirani fragmenti'},
{id:'p4-d11',t:'P4',q:'Kakvu poruku prikazuje iscrtkana linija s otvorenom strelicom od ReportService prema ReportController?',dg:{type:'seq',p:[{id:'c',n:'ReportController'},{id:'s',n:'ReportService'}],m:[{f:'c',t:'s',l:'submitReport(data)'},{f:'s',t:'c',l:'prijava (kod za praćenje)',k:'r'}]},o:['Odgovor (povrat rezultata), a ne novi poziv','Asinkroni poziv','Poruku stvaranja objekta','Izgubljenu poruku'],a:0,e:'Iscrtkana linija s otvorenom strelicom je odgovor: povrat rezultata, a ne novi poziv. Gornja poruka (puna linija, ispunjena strelica) je sinkroni poziv.',s:'P04 · Sinkrone, asinkrone i povratne poruke'},
{id:'p4-d12',t:'P4',q:'Što prikazuje ovaj fragment?',dg:{type:'seq',p:[{id:'u',n:'UI'},{id:'s',n:'Servis'}],m:[{fr:'opt',g:'[potrebna dodatna ekipa]'},{f:'u',t:'s',l:'assignTeam()'},{end:1}]},o:['Poruka assignTeam() šalje se samo ako je uvjet istinit; inače se ne događa ništa.','Poruka se ponavlja dok je uvjet istinit.','Izvodi se točno jedna od dviju grana.','Poruka se izvodi paralelno s ostalima.'],a:0,e:'opt je neobvezni fragment: izvodi se samo ako je uvjet istinit (jednostruki if). Ako uvjet nije ispunjen, nema dodatne poruke.',s:'P04 · Kombinirani fragmenti: alt, opt, loop'},
{id:'p4-d13',t:'P4',q:'Koji operator treba upisati u okvir da bi se process(report) izveo za svaku prijavu u popisu?',dg:{type:'seq',p:[{id:'u',n:'UI'},{id:'s',n:'Servis'}],m:[{fr:'?',g:'[za svaku prijavu]'},{f:'u',t:'s',l:'process(report)'},{end:1}]},o:['loop','alt','opt','break'],a:0,e:'loop označava ponavljanje, uz uvjet ili granice loop(min,max). Na predavanju je primjer „loop [za svaku prijavu]”.',s:'P04 · Kombinirani fragmenti: alt, opt, loop'},
{id:'p4-d14',t:'P4',q:'Što prikazuju iscrtkana strelica prema zaglavlju report:Report i znak X na dnu njezine životne linije?',dg:{type:'seq',p:[{id:'c',n:'Controller'},{id:'r',n:'report:Report',u:1}],m:[{f:'c',t:'r',l:'createReport()',k:'c'},{f:'c',t:'r',l:'setData()'},{f:'c',t:'r',l:'destroy()'},{destroy:'r'}]},o:['Stvaranje sudionika i završetak (uništenje) njegove životne linije','Asinkronu poruku i izgubljenu poruku','Odgovor i vremensko ograničenje','Poziv samome sebi i rekurziju'],a:0,e:'Životna linija stvorenog sudionika počinje njegovim stvaranjem (iscrtkana strelica prema zaglavlju), a X označava kraj životne linije. Ti se elementi prikazuju samo kada su relevantni.',s:'P04 · Stvaranje, uništenje i vremenska ograničenja'},
{id:'p4-d15',t:'P4',q:'Kako treba ispraviti ovaj dijagram (SD-01, neuspješna pohrana)?',dg:{type:'seq',p:[{id:'g',n:'Građanin',a:1},{id:'s',n:'ReportService'},{id:'r',n:'ReportRepository'}],m:[{f:'g',t:'s',l:'submitReport(data)'},{f:'s',t:'r',l:'save(report)'},{f:'s',t:'g',l:'potvrda(kod)',k:'r'}]},o:['Dodati odgovor repozitorija i alt fragment s granama [pohranjeno] i [pohrana nije uspjela]; potvrda samo u prvoj grani','Zamijeniti save() asinkronom porukom','Ukloniti ReportRepository iz dijagrama','Dodati loop oko save() dok ne uspije'],a:0,e:'Nedostaju odgovor na save() i alternativa za neuspjeh. Ispravak s predavanja: odgovor repozitorij → usluga i alt s granom neuspjeha i porukom o pogrešci. Pri neuspjehu se ne smije poslati potvrda.',s:'P04 · SD-01: neuspješna pohrana; Ispravljanje redoslijeda potvrde pohrane'},
{id:'p4-d16',t:'P4',q:'U SD-02 dispečer traži dodjelu ekipe. Što je ispravno prema predavanju?',dg:{type:'seq',p:[{id:'d',n:'Dispečer',a:1},{id:'c',n:'AssignmentController'},{id:'s',n:'AssignmentService'},{id:'t',n:'TeamRepository'}],m:[{f:'d',t:'c',l:'zahtjev za dodjelu'},{f:'c',t:'c',l:'provjeriOvlast()'},{fr:'alt',g:'[nije ovlašten]'},{f:'c',t:'d',l:'odbijena radnja',k:'r'},{el:'[ovlašten]'},{f:'c',t:'s',l:'findAvailableTeams()'},{f:'s',t:'t',l:'dohvat ekipa'},{f:'t',t:'s',l:'popis ekipa',k:'r'},{end:1}]},o:['Provjera ovlasti mora prethoditi dohvaćanju ekipa i dodjeli.','Ovlast se provjerava tek nakon pohrane dodjele.','Provjera ovlasti nije potrebna jer je dispečer akter.','Dohvat ekipa i provjera ovlasti moraju biti u fragmentu par.'],a:0,e:'Na predavanju stoji: „redoslijed provjere ovlasti ostaje obvezan”. Grana [nije ovlašten] odbija radnju, a tek u grani [ovlašten] dohvaćaju se raspoložive ekipe.',s:'P04 · SD-02: procjena hitnosti i dodjela ekipe'},
{id:'p4-d17',t:'P4',q:'Što ovaj dijagram (iz priručnika) kaže o kvizu?',dg:{type:'uc',sys:'Kviz',actors:[{id:'n',n:'Natjecatelj'}],uc:[{id:'k',n:'Rješavanje kviza'}],rel:[{f:'n',t:'k',m1:'10..100',m2:'1'}]},o:['U kvizu sudjeluje najmanje 10, a najviše 100 natjecatelja; svaki pristupa kvizu jednom.','Kviz se rješava 10 do 100 puta.','Natjecatelj može 10 do 100 puta pristupiti kvizu.','Kvizu pristupa točno jedan natjecatelj.'],a:0,e:'Oznaka uz aktera (10..100) kaže koliko instanci aktera sudjeluje, a oznaka uz obrazac (1) koliko puta svaki natjecatelj sudjeluje. Ako višestrukost nije navedena, podrazumijeva se 1 na obje strane.',s:'Priručnik 3.1.2.1 · Primjer 3.2 Višestrukost'},
{id:'p4-d18',t:'P4',q:'Usmjerena asocijacija od aktera prema obrascu uporabe (prema priručniku) znači:',dg:{type:'uc',sys:'E-trgovina',actors:[{id:'k',n:'Kupac'},{id:'b',n:'Banka',side:'R'}],uc:[{id:'p',n:'Plaćanje'}],rel:[{f:'k',t:'p',dir:1},{f:'p',t:'b',dir:1}]},o:['Kupac je aktivni (primarni) akter koji pokreće plaćanje, a Banka pasivni akter koji samo odgovara.','Banka pokreće plaćanje, a Kupac samo odgovara.','Oba aktera su pasivna.','Strelice označavaju redoslijed izvođenja koraka.'],a:0,e:'U priručniku smjer od aktera prema obrascu označava aktivnog aktora, a obrnuti smjer pasivnog. Ako akter ima obje uloge, crta se neusmjerena linija. U praksi se aktivne i pasivne uloge u ranim fazama često zanemaruju.',s:'Priručnik 3.1.2.1 · Primjer 3.1 Aktivni i pasivni aktori'},
{id:'p4-d19',t:'P4',q:'Prikazan je PlantUML isječak. Što znače `++` i `--` iza poruka?\n\nG -> C ++ : POST /reports\nC -> S ++ : submitReport(data)\nS --> C -- : report',o:['`++` započinje aktivaciju primatelja, a `--` završava aktivaciju pošiljatelja','`++` označava sinkronu, a `--` asinkronu poruku','`++` stvara objekt, a `--` ga uništava','Označavaju početak i kraj fragmenta alt'],a:0,e:'U PlantUML-u `->` je poziv, `-->` isprekidana poruka (često odgovor), `++` započinje aktivaciju primatelja, a `--` završava aktivaciju pošiljatelja. `autonumber` numerira poruke.',s:'P04 · Sintaksa sekvencijskog dijagrama u PlantUML-u'},
{id:'p4-d20',t:'P4',q:'Što prikazuje ovaj fragment poruke koju objekt šalje sam sebi?',dg:{type:'seq',p:[{id:'d',n:'Dispečer',a:1},{id:'c',n:'AssignmentController'}],m:[{f:'d',t:'c',l:'zahtjev za dodjelu'},{f:'c',t:'c',l:'provjeriOvlast()'}]},o:['Poziv vlastite operacije (poruka samome sebi)','Poruku stvaranja kontrolera','Odgovor dispečeru','Izgubljenu poruku'],a:0,e:'Strelica koja se vraća na istu životnu liniju je poruka samome sebi, odnosno poziv vlastite operacije.',s:'P04 · Vrste poruka u UML-u i njihova notacija'}
);

/* P5 – Arhitektura programa */
Q.push(
{id:'p5-01',t:'P5',q:'Kako predavanje definira arhitekturu sustava?',o:['Temeljni elementi, njihovi odnosi i načela koja usmjeravaju oblikovanje i evoluciju','Skup svih razreda u sustavu','Dijagram razmještaja na poslužitelje','Izbor programskog jezika i okvira'],a:0,e:'Arhitektura obuhvaća temeljne elemente, odnose i načela. Arhitektonska odluka određuje važne strukture, a arhitektonski opis (AD) dokumentira arhitekturu pogledima, modelima i obrazloženjima.',s:'P05 · Definicija arhitekture'},
{id:'p5-02',t:'P5',q:'Što uređuje norma ISO/IEC/IEEE 42010:2022?',o:['Arhitektonski opis (AD); povezuje interese dionika s gledištima, pogledima i modelima','Jedan obvezni proces oblikovanja arhitekture','Model kvalitete s devet karakteristika','Procese inženjerstva zahtjeva'],a:0,e:'42010 uređuje arhitektonski opis. Nije metoda koja propisuje jedan proces oblikovanja.',s:'P05 · ISO/IEC/IEEE 42010:2022'},
{id:'p5-03',t:'P5',q:'Koja je razlika između gledišta (viewpoint) i pogleda (view)?',o:['Gledište određuje pravila, konvencije i interese za izradu pogleda; pogled je konkretan prikaz sustava prema gledištu','Pogled određuje pravila, a gledište je konkretan dijagram','To su sinonimi','Gledište je UML dijagram, a pogled tablica'],a:0,e:'Npr. gledište razmještaja (pravila) i pogled razmještaja LEGIS-a (primjena). Pogled može sadržavati više modela, a model je konkretna reprezentacija (dijagram, tablica).',s:'P05 · Odnos gledišta i pogleda'},
{id:'p5-04',t:'P5',q:'Koje su tri vrste elemenata arhitekture prema predavanju?',o:['Komponente za obradu, podatkovne komponente i konektori','Razredi, objekti i sučelja','Aktori, obrasci uporabe i odnosi','Slojevi, razine i poslužitelji'],a:0,e:'Komponente za obradu (npr. mikroservisi, moduli), podatkovne komponente (npr. baze, tokovi događaja) i konektori (npr. REST API, posrednici poruka).',s:'P05 · Elementi, odnosi i načela arhitekture'},
{id:'p5-05',t:'P5',q:'Što kaže Conwayev zakon (1968.)?',o:['Organizacije oblikuju sustave koji preslikavaju njihove komunikacijske strukture','Dodavanje ljudi projektu koji kasni ga usporava','Složenost sustava raste bez refaktoriranja','Broj tranzistora se udvostručuje svake dvije godine'],a:0,e:'Conwayev zakon: organizacije stvaraju sustave čija struktura preslikava njihovu komunikacijsku strukturu.',s:'P05 · Povijest razvoja arhitekture'},
{id:'p5-06',t:'P5',q:'Koji pogled prikazuje preslikavanje programskih jedinica na okruženje izvođenja i komunikacijske veze?',o:['Pogled razmještaja (deployment view)','Pogled modula (module view)','Logički pogled','Pogled scenarija'],a:0,e:'Pogled modula prikazuje dekompoziciju i ovisnosti implementacijskih jedinica. Procesni (ponašajni) pogled prikazuje izvršne elemente i komunikaciju. Pogled razmještaja prikazuje okruženje izvođenja.',s:'P05 · Klasifikacija arhitektonskih pogleda'},
{id:'p5-07',t:'P5',q:'Može li se samo iz UML dijagrama razreda dokazati da će sustav zadovoljiti zahtjev vremena odziva?',o:['Ne; pogled modula ne pokazuje stvarno ponašanje tijekom izvođenja ni performanse','Da, dijagram razreda pokazuje sve performanse','Da, ako su sve operacije javne','Da, ako dijagram ima multiplicitete'],a:0,e:'Nijedan pojedinačni model ne dokazuje sva svojstva. Pogled modula pokazuje odgovornosti i ovisnosti, ali ne i radne performanse. Za to treba mjerenje ili prototip.',s:'P05 · Što možemo zaključiti iz pojedinog pogleda?'},
{id:'p5-08',t:'P5',q:'Koji su pogledi modela 4+1 (Kruchten, 1995.)?',o:['Logički, procesni, razvojni i fizički pogled te scenariji','Kontekst, kontejneri, komponente i kod','Model, pogled, upravljač i servis','Poslovni, podatkovni, aplikacijski, tehnološki i sigurnosni'],a:0,e:'4+1: logički, procesni, razvojni, fizički + scenariji (obrasci uporabe) koji usmjeravaju oblikovanje i provjeravaju usklađenost pogleda.',s:'P05 · Model pogleda: 4+1'},
{id:'p5-09',t:'P5',q:'Koja je uloga scenarija („+1”) u modelu 4+1?',o:['Usmjeravaju oblikovanje i služe za provjeru usklađenosti ostalih pogleda','Opisuju topologiju sklopovlja','Opisuju organizaciju izvornog koda','Zamjenjuju logički pogled'],a:0,e:'Scenariji obrazaca uporabe povezuju četiri pogleda i provjeravaju njihovu usklađenost. Fizički pogled opisuje topologiju, a razvojni organizaciju koda.',s:'P05 · Model pogleda: 4+1'},
{id:'p5-10',t:'P5',q:'Koje su četiri razine C4 modela, od najopćenitije?',o:['Kontekst → kontejneri → komponente → kod','Kod → komponente → kontejneri → kontekst','Logički → procesni → razvojni → fizički','Sustav → podsustav → modul → razred'],a:0,e:'C4 (Simon Brown): kontekst (s kim sustav komunicira), kontejneri (glavne izvršne jedinice), komponente (organizacija jedne jedinice), kod (razredi i sučelja). Nisu nužne sve četiri razine.',s:'P05 · Razine C4 modela'},
{id:'p5-11',t:'P5',q:'Što je „kontejner” u C4 modelu?',o:['Aplikacija ili spremište podataka s vlastitom granicom izvođenja (npr. SPA, backend koji izlaže API, baza)','Docker kontejner','Sam API','UML paket'],a:0,e:'C4 kontejner nije Docker kontejner. API sam po sebi nije kontejner, nego je to aplikacija koja ga izlaže. Dijagram kontejnera nije dijagram razmještaja.',s:'P05 · Razine C4 modela'},
{id:'p5-12',t:'P5',q:'Koja je tvrdnja o odnosu C4, UML-a i 4+1 točna?',o:['C4 ne zamjenjuje UML ni 4+1; C4 se može crtati i UML elementima','C4 je zamijenio UML','4+1 je jedna razina C4 modela','C4 je metoda oblikovanja kao ADD'],a:0,e:'42010 je norma, 4+1 organizacija pogleda, C4 hijerarhijski prikaz statičke strukture, UML jezik, a ADD metoda. C4 prikazuje rezultat, a ADD način dolaska do njega.',s:'P05 · C4 i ostali pristupi'},
{id:'p5-13',t:'P5',q:'Što je TOGAF?',o:['Okvir za arhitekturu organizacije (enterprise architecture) temeljen na iterativnoj metodi ADM','Model kvalitete proizvoda','Arhitektonski stil','Notacija za sekvencijske dijagrame'],a:0,e:'TOGAF (The Open Group Architecture Framework) povezuje poslovnu, podatkovnu, aplikacijsku i tehnološku arhitekturu, a temelji se na ADM-u (Architecture Development Method).',s:'P05 · Arhitektonski okvir'},
{id:'p5-14',t:'P5',q:'Kako se razlikuju stil, obrazac i okvir prema predavanju?',o:['Stil: načela organizacije (npr. slojevita); obrazac: ponovljivo rješenje u kontekstu (npr. MVC); okvir: sustavno oblikovanje i opis (npr. TOGAF)','Stil je TOGAF, obrazac je slojevita arhitektura, okvir je MVC','Sva tri su sinonimi','Obrazac je uvijek konkretna biblioteka'],a:0,e:'Stil = slojevita arhitektura; model = C4 kontekstni prikaz; obrazac = MVC, repozitorij; model organizacije pogleda = 4+1; arhitektonski okvir = TOGAF.',s:'P05 · Stil, model, obrazac i okvir'},
{id:'p5-15',t:'P5',q:'Koja je vrsta odluke „Spring Boot i PostgreSQL” prema predavanju?',o:['Tehnološka odluka','Strateška odluka','Oblikovna odluka','Organizacijska odluka'],a:0,e:'Slojevita arhitektura je strateška odluka, MVC i REST su oblikovne odluke, a Spring Boot i PostgreSQL tehnološke odluke.',s:'P05 · Arhitektonske odluke'},
{id:'p5-16',t:'P5',q:'Što je arhitektonski značajan zahtjev (ASR)?',o:['Zahtjev koji utječe na ključne arhitektonske odluke; može biti funkcijski, kvalitete ili ograničenje','Samo zahtjev performansi','Samo funkcijski zahtjev visokog prioriteta','Zahtjev koji je odobrio arhitekt'],a:0,e:'Arhitektonski značaj ovisi o kontekstu. Npr. 10.000 istodobnih korisnika (skalabilnost), obvezna Oracle baza (ograničenje), GDPR (zakon), video u stvarnom vremenu (funkcijski).',s:'P05 · Arhitektonski značajni zahtjevi (ASR)'},
{id:'p5-17',t:'P5',q:'„Sustav mora koristiti postojeću Oracle bazu podataka.” je primjer:',o:['Ograničenja','Zahtjeva kvalitete (performanse)','Funkcijskog zahtjeva','Scenarija kvalitete'],a:0,e:'To je ograničenje (constraint) koje može biti ASR.',s:'P05 · Arhitektonski značajni zahtjevi (ASR)'},
{id:'p5-18',t:'P5',q:'Koji su dijelovi scenarija kvalitete?',o:['Izvor, podražaj, okolina, artefakt, odgovor, mjera odgovora','Aktor, obrazac uporabe, odnos, granica','Kontekst, alternative, odluka, posljedice','Zadano, kada, tada'],a:0,e:'Scenarij kvalitete pretvara NFR u provjerljivu tvrdnju. Npr. građanin (izvor) šalje prijavu (podražaj) uz slabu mrežu (okolina), modul za zaprimanje (artefakt) potvrđuje tek nakon trajne pohrane (odgovor), nijedna prijava nije izgubljena (mjera).',s:'P05 · Scenarij kvalitete'},
{id:'p5-19',t:'P5',q:'U scenariju kvalitete, što je „okolina”?',o:['Stanje sustava u trenutku događaja (npr. slaba mobilna mreža)','Tko izaziva događaj','Dio sustava na koji se scenarij odnosi','Kako se odgovor provjerava'],a:0,e:'Izvor = tko izaziva; podražaj = događaj; okolina = stanje sustava; artefakt = dio sustava; odgovor = što sustav radi; mjera = kako se provjerava.',s:'P05 · Scenarij kvalitete'},
{id:'p5-20',t:'P5',q:'Koliko karakteristika kvalitete ima ISO/IEC 25010:2023 i što je dodano u odnosu na ranije izdanje?',o:['Devet; dodana je sigurnost od štete (safety), a uporabljivost i prenosivost zamijenjene su interakcijskom sposobnošću i fleksibilnošću','Osam; dodana je skalabilnost','Šest; dodana je dostupnost','Deset; dodana je umjetna inteligencija'],a:0,e:'Devet karakteristika: funkcijska prikladnost, učinkovitost izvedbe, kompatibilnost, interakcijska sposobnost, pouzdanost, sigurnost (security), mogućnost održavanja, fleksibilnost, sigurnost od štete (safety).',s:'P05 · Karakteristike kvalitete: ISO/IEC 25010:2023'},
{id:'p5-21',t:'P5',q:'Koja karakteristika ISO 25010:2023 odgovara na pitanje „Može li se sustav preseliti s Rendera na drugu platformu?”',o:['Fleksibilnost','Kompatibilnost','Pouzdanost','Interakcijska sposobnost'],a:0,e:'Fleksibilnost = prilagodba okruženjima (prije prenosivost). Kompatibilnost = razmjena podataka s drugim sustavima.',s:'P05 · Karakteristike kvalitete: ISO/IEC 25010:2023'},
{id:'p5-22',t:'P5',q:'Koja je razlika između „security” i „safety” u ISO 25010:2023?',o:['Security je zaštita podataka i pristupa; safety je izbjegavanje štete ljudima, imovini i okolišu','Security je izbjegavanje štete ljudima; safety je zaštita podataka','To su sinonimi','Safety se odnosi samo na sklopovlje'],a:0,e:'Security: tko smije vidjeti prijave? Safety (sigurnost od štete): može li pogrešna obrada ugroziti ljude?',s:'P05 · Karakteristike kvalitete: ISO/IEC 25010:2023'},
{id:'p5-23',t:'P5',q:'Koja je tipična provjera pouzdanosti?',o:['Scenariji zatajenja i ispitivanje oporavka','Mjerenje vremena odziva uz opterećenje','Analiza strukture i zadatak promjene','Probna promjena okruženja'],a:0,e:'Učinkovitost izvedbe: mjerenje uz opterećenje. Pouzdanost: scenariji zatajenja i oporavak. Sigurnost: analiza prijetnji. Održavanje: analiza strukture. Fleksibilnost: probna promjena okruženja.',s:'P05 · Provjera odabranih svojstava kvalitete'},
{id:'p5-24',t:'P5',q:'Što je ADD (Attribute-Driven Design) 3.0?',o:['Iterativna metoda oblikovanja arhitekture na temelju arhitektonskih pokretača (ASR-ova)','Norma za arhitektonski opis','Metoda vrednovanja troška i koristi','Model razina C4'],a:0,e:'ADD 3.0 ima sedam koraka. U svakoj iteraciji oblikuje se i provjerava odabrani dio arhitekture.',s:'P05 · Metoda ADD 3.0: sedam koraka'},
